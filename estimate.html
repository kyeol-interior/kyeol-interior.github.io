<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1분 견적 | (주)결</title>

<style>

body {
    margin:0;
    background:#0f0f0f;
    color:#fff;
    font-family:'Noto Sans KR', sans-serif;
}

/* 전체 컨테이너 */
.container {
    max-width:650px;
    margin:auto;
    padding:80px 18px;
}

/* 제목 */
h1 {
    font-size:20px;
    margin-bottom:5px;
    font-weight:800;
}

.sub {
    color:#aaa;
    font-size:13px;
    margin-bottom:25px;
}

/* 카드 */
.card {
    background:#151515;
    border:1px solid #222;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

/* 섹션 타이틀 */
.title {
    color:#ff2d2d;
    font-size:13px;
    font-weight:800;
    margin-bottom:12px;
}

/* ======================
   선택 UI (핵심 개선)
====================== */

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* 버튼형 선택 */
.option {
    background:#0f0f0f;
    border:1px solid #222;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:13px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    white-space:nowrap; /* 🔥 1줄 유지 */
}

/* hover */
.option:hover {
    border-color:#ff2d2d;
}

/* 선택 라디오 숨김 */
input {
    display:none;
}

/* 버튼 */
.btn {
    width:100%;
    padding:14px;
    background:#e60023;
    border:none;
    color:#fff;
    font-weight:800;
    border-radius:10px;
    margin-top:12px;

    -webkit-font-smoothing:antialiased;
}

/* 결과 */
.result {
    background:#111;
    border:1px solid #222;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.price {
    font-size:22px;
    color:#ff2d2d;
    font-weight:900;
}

/* 입력 */
input[type=text] {
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #333;
    background:#0f0f0f;
    color:#fff;
}

/* ======================
   모바일 최적화
====================== */

@media (max-width:600px) {

.grid {
    grid-template-columns:1fr; /* 🔥 세로 정렬 강제 */
}

.option {
    font-size:14px;
    padding:14px;
    white-space:normal; /* 모바일에서 자연스럽게 */
}

}

</style>
</head>

<body>

<div class="container">

<h1>간편 견적</h1>
<p class="sub">문제만 선택하면 예상 비용을 확인할 수 있습니다</p>

<!-- 공간 -->
<div class="card">
<div class="title">공간 유형</div>

<div class="grid">

<label class="option">
아파트
<input type="radio" name="type" value="apt" checked>
</label>

<label class="option">
상가 / 사무실
<input type="radio" name="type" value="shop">
</label>

</div>
</div>

<!-- 평형 추가 (핵심 개선) -->
<div class="card">
<div class="title">평형 선택</div>

<div class="grid">

<label class="option">
10~20평
<input type="radio" name="size" value="1" checked>
</label>

<label class="option">
20~30평
<input type="radio" name="size" value="2">
</label>

<label class="option">
30~40평
<input type="radio" name="size" value="3">
</label>

<label class="option">
40평 이상
<input type="radio" name="size" value="4">
</label>

</div>
</div>

<!-- 문제 선택 (개선 핵심) -->
<div class="card">
<div class="title">문제 선택</div>

<div class="grid">

<label class="option">
필름 들뜸
<input type="checkbox" value="film">
</label>

<label class="option">
도배 손상
<input type="checkbox" value="wall">
</label>

<label class="option">
바닥 찍힘
<input type="checkbox" value="floor">
</label>

<label class="option">
문/문틀 손상
<input type="checkbox" value="door">
</label>

<label class="option">
욕실 실리콘
<input type="checkbox" value="bath">
</label>

</div>
</div>

<button class="btn" onclick="calc()">견적 보기</button>

<div id="result" class="result" style="display:none;">
<div>예상 견적</div>
<div class="price" id="price">0원</div>

<input type="text" placeholder="이름 / 현장명" id="name">
<input type="text" placeholder="연락처" id="phone">

<button class="btn" onclick="send()">카카오 상담</button>
</div>

</div>

<script>

function calc() {

let base = 0;

/* 문제 가중치 */
document.querySelectorAll("input[type=checkbox]:checked").forEach(i=>{
    if(i.value==="film") base += 130;
    if(i.value==="wall") base += 110;
    if(i.value==="floor") base += 150;
    if(i.value==="door") base += 140;
    if(i.value==="bath") base += 120;
});

/* 평형 가중치 */
let size = document.querySelector("input[name=size]:checked").value;

if(size==1) base *= 1;
if(size==2) base *= 1.3;
if(size==3) base *= 1.6;
if(size==4) base *= 2.0;

/* 최소값 */
if(base < 200) base = 250;

document.getElementById("result").style.display="block";
document.getElementById("price").innerText =
Math.round(base * 10000).toLocaleString()+"원";
}

function send() {

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone){
alert("정보 입력 필요");
return;
}

window.open("https://pf.kakao.com/_uxhhjX/chat");

}

</script>

</body>
</html>
