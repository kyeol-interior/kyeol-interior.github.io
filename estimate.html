<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1분견적 | (주)결</title>

<style>
body {margin:0; background:#0f0f0f; color:#fff; font-family:Noto Sans KR;}
.container {max-width:600px; margin:auto; padding:90px 20px;}

h1 {font-size:22px; margin-bottom:5px;}
.sub {color:#aaa; font-size:13px; margin-bottom:20px;}

.card {
    background:#151515;
    border:1px solid #222;
    padding:15px;
    border-radius:12px;
    margin-bottom:12px;
}

.title {color:#ff2d2d; font-size:13px; font-weight:800; margin-bottom:10px;}

.option {
    display:flex;
    justify-content:space-between;
    padding:10px;
    background:#0f0f0f;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
}

.btn {
    width:100%;
    padding:14px;
    background:#ff2d2d;
    border:none;
    color:#fff;
    font-weight:800;
    border-radius:10px;
    margin-top:10px;
}

.result {
    background:#111;
    border:1px solid #222;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.price {
    font-size:22px;
    color:#ff2d2d;
    font-weight:800;
}

input {
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #333;
    background:#0f0f0f;
    color:#fff;
}
</style>
</head>

<body>

<div class="container">

<h1>1분 견적 시스템 v2</h1>
<p class="sub">문제만 선택하면 자동으로 견적이 계산됩니다</p>

<!-- 1 -->
<div class="card">
<div class="title">공간 유형</div>

<label class="option">
<span>아파트</span>
<input type="radio" name="type" value="a" checked>
</label>

<label class="option">
<span>상가 / 사무실</span>
<input type="radio" name="type" value="b">
</label>
</div>

<!-- 2 -->
<div class="card">
<div class="title">문제 선택 (핵심)</div>

<label class="option">
<span>필름 들뜸 / 손상</span>
<input type="checkbox" value="film">
</label>

<label class="option">
<span>도배 손상 / 오염</span>
<input type="checkbox" value="wall">
</label>

<label class="option">
<span>바닥 찍힘 / 마루 손상</span>
<input type="checkbox" value="floor">
</label>

<label class="option">
<span>문 / 문틀 손상</span>
<input type="checkbox" value="door">
</label>

<label class="option">
<span>욕실 실리콘 노후</span>
<input type="checkbox" value="bath">
</label>
</div>

<!-- 3 -->
<div class="card">
<div class="title">공사 범위</div>

<label class="option">
<span>부분 (1~3곳)</span>
<input type="radio" name="range" value="1" checked>
</label>

<label class="option">
<span>중간 (4~10곳)</span>
<input type="radio" name="range" value="2">
</label>

<label class="option">
<span>전체</span>
<input type="radio" name="range" value="3">
</label>
</div>

<button class="btn" onclick="calc()">즉시 견적 보기</button>

<div id="result" class="result" style="display:none;">
<div>예상 견적</div>
<div class="price" id="price">0원</div>

<div style="margin-top:15px;">
<input type="text" id="name" placeholder="이름 / 아파트명">
<input type="text" id="phone" placeholder="연락처">
<button class="btn" onclick="send()">카카오 상담 연결</button>
</div>
</div>

</div>

<script>

function calc() {

let base = 0;

let items = document.querySelectorAll("input[type=checkbox]:checked");

items.forEach(i => {
    if(i.value === "film") base += 120;
    if(i.value === "wall") base += 100;
    if(i.value === "floor") base += 150;
    if(i.value === "door") base += 130;
    if(i.value === "bath") base += 110;
});

let range = document.querySelector("input[name=range]:checked").value;

if(range == 1) base *= 1;
if(range == 2) base *= 1.4;
if(range == 3) base *= 2.1;

if(base < 200) base = 250;

document.getElementById("result").style.display = "block";
document.getElementById("price").innerText =
Math.round(base * 10000).toLocaleString() + "원";
}

function send() {
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;

if(!name || !phone) {
alert("정보 입력 필요");
return;
}

window.open("https://pf.kakao.com/_uxhhjX/chat");
}

</script>

</body>
</html>
