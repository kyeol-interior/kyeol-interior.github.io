<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1분견적 | (주)결</title>

<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Noto Sans KR', sans-serif;}
body {background:#0f0f0f; color:#fff;}

header {
    position:fixed;
    top:0;
    width:100%;
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #222;
}

.logo {color:#fff; font-weight:700; text-decoration:none; letter-spacing:3px;}
.home {color:#ff2d2d; font-weight:700; text-decoration:none; font-size:13px;}

.container {
    padding:100px 20px 120px;
    max-width:600px;
    margin:auto;
}

h1 {
    font-size:22px;
    margin-bottom:10px;
}

.sub {
    font-size:13px;
    color:#aaa;
    margin-bottom:25px;
}

/* 카드 */
.card {
    background:#1a1a1a;
    border:1px solid #222;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.title {
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
    color:#ff2d2d;
}

/* 체크 */
.option {
    display:flex;
    justify-content:space-between;
    padding:10px;
    background:#111;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
}

.option input {transform:scale(1.2);}

input[type="number"], input[type="text"] {
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #333;
    background:#111;
    color:#fff;
    margin-top:8px;
}

/* 버튼 */
.btn {
    width:100%;
    padding:14px;
    background:#ff2d2d;
    border:none;
    border-radius:10px;
    color:#fff;
    font-weight:700;
    margin-top:15px;
    cursor:pointer;
}

.result {
    background:#111;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    border:1px solid #222;
}

.price {
    font-size:20px;
    font-weight:700;
    color:#ff2d2d;
}

.contact {
    margin-top:20px;
    padding:15px;
    background:#0a0a0a;
    border-radius:10px;
}

small {color:#888;}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">KYEOL</a>
    <a href="index.html" class="home">HOME</a>
</header>

<div class="container">

<h1>1분 견적 시스템</h1>
<p class="sub">원하는 항목만 선택하면 즉시 예상 견적이 계산됩니다</p>

<!-- 1. 공간 -->
<div class="card">
    <div class="title">공간 선택</div>

    <label class="option">
        <span>아파트</span>
        <input type="radio" name="type" value="apartment" checked>
    </label>

    <label class="option">
        <span>상가 / 사무실</span>
        <input type="radio" name="type" value="office">
    </label>
</div>

<!-- 2. 평수 -->
<div class="card">
    <div class="title">평수 입력</div>
    <input type="number" id="area" placeholder="예: 24">
</div>

<!-- 3. 공사 선택 -->
<div class="card">
    <div class="title">공사 선택</div>

    <label class="option">
        <span>필름 (도어 / 문틀 / 가구)</span>
        <input type="checkbox" value="film" checked>
    </label>

    <label class="option">
        <span>도배</span>
        <input type="checkbox" value="wallpaper">
    </label>

    <label class="option">
        <span>장판 / 바닥</span>
        <input type="checkbox" value="floor">
    </label>
</div>

<!-- 4. 버튼 -->
<button class="btn" onclick="calc()">견적 계산하기</button>

<!-- 결과 -->
<div id="result" class="result" style="display:none;">
    <div>예상 견적</div>
    <div class="price" id="price">0원</div>
    <small>※ 실제 금액은 현장 조건에 따라 달라질 수 있습니다</small>

    <div class="contact">
        <div style="margin-bottom:10px;">빠른 상담 (필수 입력)</div>
        <input type="text" id="name" placeholder="이름 / 아파트명">
        <input type="text" id="phone" placeholder="연락처">

        <button class="btn" onclick="send()">카카오 상담 요청</button>
    </div>
</div>

</div>

<script>

function calc() {
    let area = Number(document.getElementById("area").value || 0);

    let base = 0;

    let checks = document.querySelectorAll("input[type=checkbox]:checked");

    checks.forEach(c => {
        if(c.value === "film") base += area * 8;
        if(c.value === "wallpaper") base += area * 12;
        if(c.value === "floor") base += area * 10;
    });

    if(area < 10) base += 50;

    document.getElementById("result").style.display = "block";
    document.getElementById("price").innerText =
        Math.round(base * 10000).toLocaleString() + "원";
}

function send() {
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;

    if(!name || !phone) {
        alert("정보를 입력해주세요");
        return;
    }

    let msg = `1분견적 요청\n이름: ${name}\n연락처: ${phone}`;

    let url = "https://pf.kakao.com/_uxhhjX/chat";

    window.open(url, "_blank");
}

</script>

</body>
</html>
