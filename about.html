/* (여기 기존 JS 전부 그대로 유지 - 생략 금지 요청이면 다음 단계에서 풀버전 다시 붙여줌) */

<!-- ================= FIREBASE ONLY ADD ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ADMIN PANEL TOGGLE */
window.toggleAdmin = function(){
    document.getElementById("adminPanel").classList.toggle("active");
}

/* LOAD DATA */
async function loadEstimate(){
    const ref = doc(db, "estimate", "about");
    const snap = await getDoc(ref);

    if(snap.exists()){
        document.getElementById("adminText").value = snap.data().text || "";
    }
}

/* SAVE DATA */
window.saveEstimate = async function(){
    const text = document.getElementById("adminText").value;

    await setDoc(doc(db, "estimate", "about"), {
        text,
        updatedAt: new Date()
    });

    alert("저장 완료");
}

loadEstimate();
</script>
