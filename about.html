<div id="estimatePanel">
    <h2 style="margin-bottom: 25px;">1분 견적</h2>
    <label style="font-weight:700; margin-bottom:10px; display:block;">공사 유형</label>
    <div class="btn-group">
        <div class="type-btn" onclick="selectType(this, 'residence')">주거 리모델링</div>
        <div class="type-btn" onclick="selectType(this, 'commercial')">상업 인테리어</div>
        <div class="type-btn" onclick="selectType(this, 'partial')">부분 보수</div>
    </div>
    
    <div id="subFields" class="detail-section"></div>

    <label style="font-weight:700; margin-bottom:5px; display:block;">연락처</label>
    <input type="tel" id="userPhone" placeholder="010-0000-0000" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd;">
    
    <button id="calcBtn" onclick="calculate()" style="width:100%; padding:15px; background:#111; color:#fff; border:none; cursor:pointer; font-weight:700;">견적 금액 산출하기</button>
    <div id="resultPrice" style="margin-top:20px; text-align:center; font-size:18px; font-weight:800; color:#e60023;"></div>
</div>

<script>
    function togglePanel() { document.getElementById("estimatePanel").classList.toggle("active"); document.getElementById("overlay").classList.toggle("active"); }
    function toggleMenu() { document.getElementById("mobileNav").classList.toggle("active"); }
    
    function selectType(el, type) {
        document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('resultPrice').innerText = ""; // 타입 변경 시 결과 초기화
        const subFields = document.getElementById('subFields');
        subFields.style.display = 'block';
        
        if(type === 'residence') {
            subFields.innerHTML = `
                <div style="margin-bottom:10px;">주거형태: <select id="houseType"><option>주택</option><option>아파트</option></select></div>
                <div style="margin-bottom:10px;">평수 입력: <input type="number" id="pyung" placeholder="평수 입력"></div>
                <div style="margin-bottom:10px;"><input type="checkbox" id="isWindow"> 창호 교체 포함</div>
                <div style="margin-bottom:10px;"><input type="checkbox" id="isPremium"> 프리미엄 자재 선택</div>
                <div style="margin-top:15px; font-size:12px; color:#888;">※ 상세 내역은 상담을 통해 조율됩니다.</div>`;
        } else if(type === 'partial') {
            subFields.innerHTML = `
                <div style="margin-bottom:10px;"><input type="checkbox" class="part-item" value="50"> 필름 공사</div>
                <div style="margin-bottom:10px;"><input type="checkbox" class="part-item" value="30"> 실리콘 보수</div>
                <div style="margin-bottom:10px;"><input type="checkbox" class="part-item" value="100"> 화장실 부분 수리</div>
                <div style="margin-top:15px; font-size:12px; color:#888;">※ 상세 내역은 상담을 통해 조율됩니다.</div>`;
        } else {
            subFields.innerHTML = "상세 내역은 상담을 통해 조율됩니다.";
        }
    }

    function calculate() {
        const phone = document.getElementById("userPhone").value;
        const resultArea = document.getElementById("resultPrice");
        if(phone.length < 10) { alert("연락처를 정확히 입력해주세요."); return; }
        
        const type = document.querySelector('.type-btn.active')?.innerText;
        
        if(type === '주거 리모델링') {
            const pyung = document.getElementById('pyung').value;
            const isWindow = document.getElementById('isWindow').checked;
            const isPremium = document.getElementById('isPremium').checked;
            
            let pricePerPyung = 130;
            if(isPremium) pricePerPyung = 180;
            else if(isWindow) pricePerPyung = 160;
            
            const total = pyung * pricePerPyung * 10000;
            resultArea.innerText = `예상 금액: ${total.toLocaleString()}원`;
        } else if(type === '부분 보수') {
            resultArea.innerText = "예상 금액: 상담을 통해 안내";
        } else {
            resultArea.innerText = "상세 상담 필요";
        }
    }
</script>
