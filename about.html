<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT | KYEOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        /* (기존 CSS 유지) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #fff; color: #111; overflow-x: hidden; }
        nav { position: fixed; top: 0; width: 100%; height: 80px; display: flex; align-items: center; padding: 0 50px; border-bottom: 1px solid #eee; background: #fff; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; letter-spacing: 4px; text-decoration: none; color: #000; }
        .nav-links { display: flex; gap: 28px; align-items: center; margin-left: auto; }
        .nav-links a { text-decoration: none; color: #999; font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; }
        .nav-links a.active { color: #000; font-weight: 700; }
        .nav-links a.estimate { color: #e60023; font-weight: 800; padding: 6px 10px; border-radius: 6px; background: rgba(230,0,35,0.06); }
        
        #estimatePanel { position: fixed; top: 0; right: -50%; width: 50%; height: 100%; background: #fff; z-index: 3000; transition: 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 100px 40px; box-shadow: -5px 0 20px rgba(0,0,0,0.1); overflow-y: auto; }
        #estimatePanel.active { right: 0; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .type-btn { padding: 12px 5px; border: 1px solid #ddd; background: #fff; cursor: pointer; text-align: center; border-radius: 4px; font-size: 12px; transition: 0.3s; }
        .type-btn.active { border-color: #000; background: #000; color: #fff; }
        .house-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .house-btn { padding: 10px; border: 1px solid #ddd; cursor: pointer; text-align: center; border-radius: 4px; font-size: 13px; }
        .house-btn.active { border-color: #000; background: #eee; }
        .detail-section { padding: 15px; background: #fbfbfb; border: 1px solid #eee; margin-bottom: 20px; display: none; font-size: 13px; }
        .wrapper { display: flex; width: 100%; height: 100vh; padding-top: 80px; }
        .text-side { flex: 1; padding: 0 8%; display: flex; flex-direction: column; justify-content: center; background: #fbfbfb; }
        .img-side { flex: 1.3; overflow: hidden; }
        .img-side img { width: 100%; height: 100%; object-fit: cover; }
        .title-main { font-size: 34px; font-weight: 700; line-height: 1.4; margin-bottom: 35px; }
        .desc-text { font-size: 17px; line-height: 2.1; color: #444; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">KYEOL</a>
    <div class="nav-links">
        <a onclick="togglePanel()" class="estimate">1분견적</a>
        <a href="about.html" class="active">ABOUT</a>
    </div>
</nav>

<div id="estimatePanel">
    <h2 style="margin-bottom: 25px;">1분 견적 신청</h2>
    <div class="btn-group">
        <div class="type-btn" onclick="selectType(this, 'residence')">주거 리모델링</div>
        <div class="type-btn" onclick="selectType(this, 'commercial')">상업 인테리어</div>
    </div>
    <div id="subFields" class="detail-section"></div>
    <label>연락처</label>
    <input type="tel" id="userPhone" placeholder="010-0000-0000" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd;">
    <button onclick="calculateAndSend()" style="width:100%; padding:15px; background:#111; color:#fff; cursor:pointer;">견적 산출 및 전송하기</button>
    <div id="resultPrice" style="margin-top:20px; font-weight:800; color:#e60023;"></div>
</div>

<div class="wrapper">
    <div class="text-side">
        <h1 class="title-main">"The devil is in the detail"</h1>
    </div>
    <div class="img-side"><img src="image/about1.jpg" alt="About"></div>
</div>

<script>
    (function(){ emailjs.init("sm7crJ5wvq3K7Phnz"); })();

    function togglePanel() { document.getElementById("estimatePanel").classList.toggle("active"); }

    function calculateAndSend() {
        const phone = document.getElementById("userPhone").value;
        if(phone.length < 10) { alert("연락처를 입력해주세요."); return; }

        // 1. 계산 로직 (기존 함수 내용)
        const pyung = document.getElementById('pyung')?.value || 0;
        const bathQty = document.getElementById('bathQty')?.value || 0;
        const total = (pyung * 130 * 10000) + (bathQty * 3000000);
        
        document.getElementById('resultPrice').innerText = `예상 금액: ${total.toLocaleString()}원`;

        // 2. 이메일 전송
        const templateParams = {
            user_phone: phone,
            total_price: total.toLocaleString() + "원",
            detail: "주거 형태: " + (document.querySelector('.house-btn.active')?.innerText || "미선택")
        };

        emailjs.send('service_fz1110j', 'template_0vo3ea6', templateParams)
            .then(() => alert("견적이 전송되었습니다!"), () => alert("전송 실패"));
    }

    // (selectType, selectHouse 함수는 기존 코드와 동일하게 유지하세요)
</script>
</body>
</html>
