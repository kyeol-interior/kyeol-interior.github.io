<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* Reset */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#111;overflow-x:hidden;}

/* Nav */
nav{position:fixed;top:0;width:100%;height:80px;display:flex;align-items:center;padding:0 50px;border-bottom:1px solid #eee;background:#fff;z-index:1000;}
.logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:4px;text-decoration:none;color:#000;}
.nav-links{display:flex;gap:28px;align-items:center;margin-left:auto;}
.nav-links a{text-decoration:none;color:#999;font-size:13px;letter-spacing:2px;cursor:pointer;transition:0.3s;}
.nav-links a.active{color:#000;font-weight:700;}
.nav-links a.estimate{color:#e60023;font-weight:800;padding:6px 10px;border-radius:6px;background:rgba(230,0,35,0.06);}

/* Slide Panel */
#estimatePanel {
    position: fixed; top: 0; right: -50%; width: 50%; height: 100%;
    background: #fff; z-index: 2000;
    transition: 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    padding: 100px 30px;
    box-shadow: -5px 0 20px rgba(0,0,0,0.1);
    overflow-y: auto;
}
#estimatePanel.active { right: 0; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 1500; }
.overlay.active { display: block; }

/* Mobile Controls */
.mobile-controls { display: none; position: fixed; top: 22px; right: 25px; z-index: 1200; align-items: center; gap: 15px; }
.mobile-estimate { color:#e60023; font-weight:800; font-size:13px; text-decoration:none; background:rgba(230,0,35,0.1); padding:6px 10px; border-radius:6px; cursor:pointer; }
.menu-btn { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
.menu-btn span { width: 22px; height: 2px; background: #000; }

/* Mobile Menu */
.mobile-nav { position: fixed; top: -100%; left: 0; width: 100%; height: 100%; background: #fff; padding-top: 100px; transition: 0.4s ease; z-index: 999; }
.mobile-nav.active { top: 0; }
.mobile-nav a { display: block; padding: 15px 50px; text-decoration: none; color: #111; font-size: 18px; }

/* Layout */
.wrapper{display:flex;width:100%;min-height:100vh;padding-top:80px;}
.text-side{flex:1;padding:0 8%;display:flex;flex-direction:column;justify-content:center;background:#fbfbfb;}
.img-side{flex:1.3;overflow:hidden;}
.img-side img{width:100%;height:100%;object-fit:cover;}

/* Text Style */
.title-main{font-size:34px;font-weight:700;line-height:1.4;margin-bottom:35px;}
.desc-text{font-size:17px;line-height:2.1;color:#444;}
.desc-text b{color:#111;font-weight:700;}

/* Mobile Media Query */
@media(max-width:1024px){
    /* 모바일 슬라이딩 3/4 (75%) */
    #estimatePanel { width: 75%; right: -75%; }
    
    nav { padding: 0 25px; }
    .nav-links { display: none; }
    .mobile-controls { display: flex; }
    .wrapper { flex-direction: column; }
    .img-side { height: 40vh; order: 2; }
    .text-side { padding: 40px 25px; order: 1; }
    .title-main { font-size: 24px; }
}
</style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">KYEOL</a>
    <div class="nav-links">
        <a onclick="togglePanel()" class="estimate">1분견적</a>
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<div class="mobile-controls">
    <a onclick="togglePanel()" class="mobile-estimate">1분견적</a>
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</div>

<div class="mobile-nav" id="mobileNav">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
</div>

<div class="overlay" id="overlay" onclick="togglePanel()"></div>

<!-- 1분 견적 폼 영역 -->
<div id="estimatePanel">
    <h2 style="margin-bottom: 25px;">1분 견적 문의</h2>
    <form id="estimateForm">
        <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700;">공사 유형</label>
        <select style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd;">
            <option>학교 시설 개선</option>
            <option>주거 공간 리모델링</option>
            <option>상업 공간 인테리어</option>
            <option>부분 보수</option>
        </select>

        <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700;">현장 면적 (평)</label>
        <input type="number" placeholder="예: 30" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd;">

        <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700;">희망 공사 항목</label>
        <div style="margin-bottom:20px; font-size:13px; line-height:2;">
            <label><input type="checkbox"> 철거 및 폐기물</label><br>
            <label><input type="checkbox"> 목공사</label><br>
            <label><input type="checkbox"> 도장 및 도배</label><br>
            <label><input type="checkbox"> 전기 및 조명</label><br>
            <label><input type="checkbox"> 기타 설비</label>
        </div>

        <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700;">연락처</label>
        <input type="tel" placeholder="010-0000-0000" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd;">

        <button type="button" style="width:100%; padding:15px; background:#111; color:#fff; border:none; cursor:pointer;">견적 문의 보내기</button>
    </form>
</div>

<div class="wrapper">
    <div class="text-side">
        <h1 class="title-main">
            "The devil is in the detail,<br>
            악마는 디테일에 있다."
        </h1>
        <p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.<br><br>
            <b>"머무는 순간의 온기, 눈에 닿는 모든 곳에<br>
            결이 좋은 공간을 짓습니다."</b>
        </p>
    </div>
    <div class="img-side">
        <img src="image/about1.jpg" alt="About">
    </div>
</div>

<script>
    function togglePanel() {
        document.getElementById("estimatePanel").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }
    function toggleMenu() {
        document.getElementById("mobileNav").classList.toggle("active");
    }
</script>

</body>
</html>
