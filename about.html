<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Noto Sans KR',sans-serif;
background:#fff;
color:#111;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
height:80px;
display:flex;
align-items:center;
padding:0 50px;
border-bottom:1px solid #eee;
background:#fff;
z-index:1000;
}

.logo{
font-family:'Playfair Display',serif;
font-size:24px;
font-weight:700;
letter-spacing:4px;
text-decoration:none;
color:#000;
}

.nav-links{
margin-left:auto;
display:flex;
gap:28px;
align-items:center;
}

.nav-links a{
text-decoration:none;
color:#999;
font-size:13px;
cursor:pointer;
}

.nav-links a.active{
color:#000;
font-weight:700;
}

/* MOBILE HAMBURGER */
.menu-btn{
display:none;
flex-direction:column;
gap:5px;
cursor:pointer;
margin-left:auto;
}

.menu-btn span{
width:24px;
height:2px;
background:#111;
}

.mobile-menu{
position:fixed;
top:80px;
right:-100%;
width:100%;
height:calc(100vh - 80px);
background:#fff;
z-index:2000;
padding:40px;
transition:.3s;
}

.mobile-menu.active{
right:0;
}

.mobile-menu a{
display:block;
padding:15px 0;
border-bottom:1px solid #eee;
text-decoration:none;
color:#111;
}

/* MAIN */
.wrapper{
display:flex;
width:100%;
height:100vh;
padding-top:80px;
}

.text-side{
flex:1;
padding:0 8%;
display:flex;
flex-direction:column;
justify-content:center;
background:#fbfbfb;
}

.img-side{
flex:1.3;
}

.img-side img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.title-main{
font-size:34px;
margin-bottom:30px;
line-height:1.4;
}

.desc-text{
font-size:17px;
line-height:2;
color:#444;
}

/* PANEL */
#overlay{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
display:none;
z-index:2500;
}

#overlay.active{
display:block;
}

#estimatePanel{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:#fff;
z-index:3000;
transition:.4s;
padding:90px 25px;
overflow-y:auto;
}

#estimatePanel.active{
right:0;
}

.btn-group{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:15px;
}

.type-btn{
padding:12px;
border:1px solid #ddd;
text-align:center;
cursor:pointer;
}

.type-btn.active{
background:#111;
color:#fff;
}

#subFields{
margin-top:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
}

/* MOBILE */
@media(max-width:1024px){

.nav-links{display:none;}

.menu-btn{display:flex;}

.wrapper{
flex-direction:column;
height:auto;
}

.img-side{
height:40vh;
order:2;
}

.text-side{
order:1;
padding:40px 20px;
}

.title-main{font-size:24px;}
.desc-text{font-size:15px;}
}
</style>
</head>

<body>

<div id="overlay" onclick="closePanel()"></div>

<!-- NAV -->
<nav>
<a href="index.html" class="logo">KYEOL</a>

<div class="nav-links">
<a onclick="openPanel()">1분견적</a>
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<div class="menu-btn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>
</nav>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
<a href="about.html">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
<a onclick="openPanel()">1분견적</a>
</div>

<!-- MAIN -->
<div class="wrapper">

<div class="text-side">

<h1 class="title-main">
"The devil is in the detail,<br>
악마는 디테일에 있다."
</h1>

<p class="desc-text">
단순해 보이는 공간일지라도,<br>
그 완성도는 눈에 잘 띄지 않는<br>
작은 디테일에서 결정됩니다.<br><br>

<b>
머무는 순간의 온기,<br>
눈에 닿는 모든 곳에 결이 좋은 공간을 짓습니다.
</b>
</p>

</div>

<div class="img-side">
<img src="image/about1.jpg">
</div>

</div>

<!-- PANEL -->
<div id="estimatePanel">

<h2>1분 견적</h2>

<div class="btn-group">
<div class="type-btn" onclick="selectType(this,'residence')">주거</div>
<div class="type-btn" onclick="selectType(this,'commercial')">상가</div>
<div class="type-btn" onclick="selectType(this,'partial')">부분시공</div>
</div>

<div id="subFields"></div>

<input id="requestDate" placeholder="시공일">
<input id="requestArea" placeholder="지역">
<input id="userPhone" placeholder="연락처">

<button onclick="calculate()">전송</button>

</div>

<script>
function openPanel(){
document.getElementById("estimatePanel").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closePanel(){
document.getElementById("estimatePanel").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}

function selectType(el,type){
document.querySelectorAll(".type-btn").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

const sub=document.getElementById("subFields");

if(type==="residence"){
sub.innerHTML=`<input placeholder="평수">`;
}

if(type==="commercial"){
sub.innerHTML=`<p>상가 상담 필요</p>`;
}

if(type==="partial"){
sub.innerHTML=`<label><input type="checkbox">필름</label>`;
}
}
</script>

</body>
</html>
