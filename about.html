<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="description" content="전주 인테리어 전문 기업 (주)결을 소개합니다.">
    <title>ABOUT | (주)결</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
        body { background:#fff; font-family:'Noto Sans KR', sans-serif; color:#111; overflow-x:hidden; }

        /* NAV */
        nav {
            position:fixed;
            top:0;
            width:100%;
            height:80px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 50px;
            background:#fff;
            border-bottom:1px solid #f2f2f2;
            z-index:1100;
        }

        .logo {
            font-size:24px;
            font-weight:700;
            text-decoration:none;
            color:#000;
            letter-spacing:4px;
        }

        .nav-left {
            display:flex;
            align-items:center;
            gap:25px;
        }

        .estimate-btn {
            font-size:12px;
            font-weight:700;
            color:#e60012;
            text-decoration:none;
            letter-spacing:2px;
            padding:6px 10px;
            border:1px solid #e60012;
            border-radius:4px;
            transition:0.3s;
        }

        .estimate-btn:hover {
            background:#e60012;
            color:#fff;
        }

        .nav-links {
            display:flex;
            gap:35px;
        }

        .nav-links a {
            text-decoration:none;
            color:#999;
            font-size:13px;
            letter-spacing:2px;
        }

        .nav-links a.active { color:#000; font-weight:700; }

        /* hamburger */
        .menu-btn {
            display:none;
            flex-direction:column;
            gap:6px;
            cursor:pointer;
        }

        .menu-btn span {
            width:22px;
            height:2px;
            background:#000;
        }

        /* MOBILE MENU */
        .mobile-nav {
            position:fixed;
            top:-100%;
            left:0;
            width:100%;
            background:#fff;
            border-bottom:1px solid #eee;
            padding:100px 0 30px;
            transition:0.4s;
            z-index:1050;
        }

        .mobile-nav.active { top:0; }

        .mobile-nav a {
            display:block;
            padding:15px 50px;
            text-decoration:none;
            color:#111;
            border-bottom:1px solid #f9f9f9;
        }

        .mobile-estimate {
            color:#e60012 !important;
            font-weight:700;
        }

        /* LAYOUT */
        .wrapper {
            display:flex;
            height:100vh;
            padding-top:80px;
        }

        .text-side {
            flex:1;
            padding:0 8%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            background:#fbfbfb;
        }

        .img-side {
            flex:1.3;
        }

        .img-side img {
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .title-main {
            font-size:34px;
            font-weight:700;
            line-height:1.4;
            margin-bottom:30px;
            word-break:keep-all;
        }

        /* 핵심: 줄바꿈 방지 */
        .title-main br {
            display:block;
        }

        .desc-text {
            font-size:17px;
            line-height:2.1;
            color:#444;
            word-break:keep-all;
        }

        .mobile-br { display:none; }

        .highlight {
            margin-top:40px;
            border-top:1px solid #ddd;
            padding-top:30px;
        }

        .badge {
            display:inline-block;
            padding:6px 12px;
            background:#000;
            color:#fff;
            font-size:11px;
            margin-right:6px;
            margin-bottom:8px;
        }

        /* MOBILE */
        @media (max-width:1024px) {

            nav {
                padding:0 20px;
                height:70px;
            }

            .nav-links { display:none; }

            .menu-btn { display:flex; }

            .nav-left {
                gap:12px;
            }

            .estimate-btn {
                font-size:11px;
                padding:5px 8px;
                /* 모바일에서는 햄버거 기준 오른쪽으로 밀림 */
                margin-left:auto;
                margin-right:10px;
            }

            .wrapper {
                flex-direction:column;
                height:auto;
            }

            .img-side {
                height:40vh;
            }

            .text-side {
                padding:40px 20px;
            }

            .title-main {
                font-size:22px;
                line-height:1.35;
            }

            /* 핵심: 3줄 방지 */
            .desc-text {
                font-size:15px;
                line-height:1.9;
            }

            .mobile-br {
                display:block;
            }
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav>

    <div class="nav-left">
        <a href="index.html" class="logo">KYEOL</a>

        <!-- PC / MOBILE 공통 1분견적 -->
        <a href="estimate.html" class="estimate-btn">1분견적</a>
    </div>

    <div class="nav-links">
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <div class="menu-btn" id="menuBtn">
        <span></span><span></span><span></span>
    </div>

</nav>

<!-- MOBILE MENU -->
<div class="mobile-nav" id="mobileNav">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
    <a href="estimate.html" class="mobile-estimate">1분견적</a>
</div>

<!-- CONTENT -->
<div class="wrapper">

    <div class="text-side">

        <h1 class="title-main">
            "The devil is in the detail,<br>
            악마는 디테일에 있다."
        </h1>

        <p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.<br><br>

            <b>"머무는 순간의 온기, 눈에 닿는 모든 곳에<br class="mobile-br">
            결이 좋은 공간을 짓습니다."</b>
        </p>

        <div class="highlight">
            <span class="badge">실내건축공사업 면허</span>
            <span class="badge">인증 장애인기업</span>
        </div>

    </div>

    <div class="img-side">
        <img src="image/about1.jpg" alt="about">
    </div>

</div>

<script>
const menuBtn = document.getElementById("menuBtn");
const mobileNav = document.getElementById("mobileNav");

menuBtn.onclick = () => {
    menuBtn.classList.toggle("open");
    mobileNav.classList.toggle("active");
};
</script>

</body>
</html>
