<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>

/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Noto Sans KR',sans-serif;
    background:#fff;
    color:#111;
    overflow-x:hidden;
}

/* ================= NAV ================= */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 50px;
    border-bottom:1px solid #eee;
    background:#fff;
    z-index:1000;
}

.logo{
    font-family:'Playfair Display',serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    text-decoration:none;
    color:#000;
}

/* ================= PC MENU (우측 정렬) ================= */
.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
    margin-left: auto; /* 우측으로 밀어내기 */
}

.nav-links a{
    text-decoration:none;
    color:#999;
    font-size:13px;
    letter-spacing:2px;
    transition:0.3s;
}

.nav-links a.active{
    color:#000;
    font-weight:700;
}

/* 1분견적 스타일 */
.nav-links a.estimate{
    color:#e60023;
    font-weight:800;
    padding:6px 10px;
    border-radius:6px;
    background:rgba(230,0,35,0.06);
}

/* ================= HAMBURGER ================= */
.menu-btn{
    display:none;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
    margin-left: 20px;
}

.menu-btn span{
    width:22px;
    height:2px;
    background:#000;
}

/* ================= MOBILE MENU ================= */
.mobile-nav{
    position:fixed;
    top:-100%;
    left:0;
    width:100%;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    flex-direction:column;
    padding:90px 0 30px;
    transition:0.4s ease;
    z-index:999;
}

.mobile-nav.active { top: 0; }

.mobile-nav a{
    padding:15px 50px;
    text-decoration:none;
    color:#111;
    font-size:16px;
    border-bottom:1px solid #f9f9f9;
}

/* ================= LAYOUT ================= */
.wrapper{
    display:flex;
    width:100%;
    height:100vh;
    padding-top:80px;
}

.text-side{
    flex:1;
    padding:0 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#fbfbfb;
}

.img-side{
    flex:1.3;
    overflow:hidden;
}

.img-side img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= TEXT ================= */
.title-main{
    font-size:34px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:35px;
    word-break:keep-all;
}

.desc-text{
    font-size:17px;
    line-height:2.1;
    color:#444;
}

.desc-text b{
    color:#111;
    font-weight:700;
}

.mobile-br { display: none; }

/* ================= MOBILE ================= */
@media(max-width:1024px){
    nav{ padding:0 25px; height:70px; }
    .nav-links{ display:none; }
    
    .menu-btn{ display:flex; }
    
    .mobile-estimate{
        position:fixed;
        top:22px;
        right:70px;
        z-index:1200;
        color:#e60023;
        font-weight:800;
        font-size:13px;
        text-decoration:none;
        background:rgba(230,0,35,0.1);
        padding:6px 10px;
        border-radius:6px;
    }

    .title-main{ font-size:24px; }
    .wrapper{ flex-direction:column; height:auto; }
    .img-side{ height:40vh; }
    .mobile-br { display: block; }
}
</style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">KYEOL</a>

    <div class="nav-links">
        <a href="estimate.html" class="estimate">1분견적</a>
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <div class="menu-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
</nav>

<a href="estimate.html" class="mobile-estimate">1분견적</a>

<div class="mobile-nav" id="mobileNav">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
</div>

<div class="wrapper">
    <div class="text-side">
        <h1 class="title-main">
            "The devil is in the detail,<br>악마는 디테일에 있다."
        </h1>
        <p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.<br><br>
            <b>
                "머무는 순간의 온기, 눈에 닿는 모든 곳에<br class="mobile-br">
                결이 좋은 공간을 짓습니다."
            </b>
        </p>
    </div>
    <div class="img-side">
        <img src="image/about1.jpg" alt="About Image">
    </div>
</div>

<script>
    function toggleMenu(){
        document.getElementById("mobileNav").classList.toggle("active");
    }
</script>

</body>
</html>
