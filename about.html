<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="전주 인테리어 전문 기업 (주)결을 소개합니다. 공간의 밀도를 다시 쓰는 정밀 시공, 장애인기업 인증을 보유한 믿을 수 있는 인테리어 파트너입니다.">
    <title>ABOUT | (주)결</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
        body { background:#fff; font-family: 'Noto Sans KR', sans-serif; color:#111; overflow-x:hidden; }

        nav {
            position:fixed; top:0; width:100%; height:80px;
            display:flex; justify-content:space-between; align-items:center;
            padding:0 50px; background:#fff; z-index:1100; border-bottom:1px solid #f2f2f2;
        }

        .logo { font-family:'Playfair Display', serif; font-size:24px; font-weight:700; text-decoration:none; color:#000; letter-spacing:4px; }

        .nav-links { display:flex; gap:35px; }
        .nav-links a { text-decoration:none; color:#999; font-size:13px; letter-spacing:2px; transition:0.3s; }
        .nav-links a.active { color:#000; font-weight:700; }

        .menu-btn { display:none; cursor:pointer; flex-direction:column; gap:6px; }
        .menu-btn span { width:22px; height:2px; background:#000; }

        /* 🔴 1분 견적 버튼 (추가 핵심) */
        .quote-btn {
            position:fixed;
            right:20px;
            top:22px;
            z-index:1200;
            background:#e11d48;
            color:#fff;
            padding:10px 14px;
            font-size:12px;
            font-weight:700;
            border-radius:30px;
            cursor:pointer;
            box-shadow:0 6px 18px rgba(0,0,0,0.15);
        }

        .quote-btn:hover {
            transform:translateY(-2px);
        }

        /* 슬라이드 패널 */
        .quote-panel {
            position:fixed;
            top:0;
            right:-420px;
            width:380px;
            height:100vh;
            background:#fff;
            z-index:2000;
            box-shadow:-10px 0 30px rgba(0,0,0,0.15);
            transition:0.35s ease;
            padding:20px;
            overflow-y:auto;
        }

        .quote-panel.active { right:0; }

        .panel-title {
            font-size:18px;
            font-weight:700;
            margin-bottom:20px;
        }

        .opt {
            padding:12px;
            border:1px solid #eee;
            margin-bottom:10px;
            cursor:pointer;
            border-radius:8px;
        }

        .opt:hover { border-color:#e11d48; }

        .close-btn {
            float:right;
            cursor:pointer;
            font-size:14px;
            color:#999;
        }

        /* ===== 기존 구조 절대 유지 ===== */
        .mobile-nav {
            position: fixed; top: -100%; left: 0; width: 100%;
            background:#fff;
            transition:0.4s;
        }

        .mobile-nav.active { top:0; }

        .wrapper { display:flex; width:100%; height:100vh; padding-top:80px; }

        .text-side { flex:1; padding:0 8%; display:flex; flex-direction:column; justify-content:center; background:#fbfbfb; }

        .img-side { flex:1.3; overflow:hidden; }
        .img-side img { width:100%; height:100%; object-fit:cover; }

        .title-main { font-size:34px; font-weight:700; margin-bottom:35px; }

        .desc-text { font-size:17px; color:#444; line-height:2.1; }

        .highlight-section { margin-top:45px; padding-top:35px; border-top:1px solid #ddd; }

        .cert-badge { display:inline-block; padding:7px 15px; background:#000; color:#fff; font-size:11px; margin-right:8px; }

        /* 모바일 */
        @media(max-width:1024px){
            nav{padding:0 25px;}
            .wrapper{flex-direction:column;}
            .quote-panel{width:100%;}
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav>
    <a href="index.html" class="logo">KYEOL</a>

    <div class="nav-links">
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <div class="menu-btn">
        <span></span><span></span><span></span>
    </div>
</nav>

<!-- 🔴 1분 견적 버튼 -->
<div class="quote-btn" onclick="openQuote()">1분 견적</div>

<!-- 슬라이드 패널 -->
<div class="quote-panel" id="quotePanel">
    <div class="panel-title">
        1분 견적
        <span class="close-btn" onclick="closeQuote()">닫기</span>
    </div>

    <div class="opt">필름 공사</div>
    <div class="opt">도배 / 장판</div>
    <div class="opt">주방 공사</div>
    <div class="opt">화장실 공사</div>

    <hr style="margin:20px 0;">

    <input type="text" placeholder="연락처" style="width:100%;padding:10px;margin-bottom:10px;">
    <input type="text" placeholder="아파트명" style="width:100%;padding:10px;margin-bottom:10px;">

    <button style="width:100%;padding:12px;background:#e11d48;color:#fff;border:none;">
        견적 요청
    </button>
</div>

<!-- MOBILE MENU -->
<div class="mobile-nav" id="dropdown"></div>

<!-- CONTENT (그대로 유지) -->
<div class="wrapper">
    <div class="text-side">
        <h1 class="title-main">"The devil is in the detail,<br>악마는 디테일에 있다."</h1>

        <p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.
        </p>

        <div class="highlight-section">
            <span class="cert-badge">실내건축공사업 면허 보유 법인</span>
            <span class="cert-badge">인증 장애인기업</span>
        </div>
    </div>

    <div class="img-side">
        <img src="image/about1.jpg" alt="">
    </div>
</div>

<script>
function openQuote(){
    document.getElementById('quotePanel').classList.add('active');
}

function closeQuote(){
    document.getElementById('quotePanel').classList.remove('active');
}
</script>

</body>
</html>
