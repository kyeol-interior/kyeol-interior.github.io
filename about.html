<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABOUT | (주)결</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Noto Sans KR;background:#fff;overflow-x:hidden;}

/* ================= NAV ================= */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 40px;
    background:#fff;
    border-bottom:1px solid #eee;
    z-index:2000;
}

/* LEFT */
.logo{
    font-size:20px;
    font-weight:700;
    text-decoration:none;
    color:#000;
}

/* CENTER MENU */
.nav-center{
    display:flex;
    gap:28px;
}

.nav-center a{
    font-size:13px;
    text-decoration:none;
    color:#999;
    letter-spacing:2px;
}

.nav-center a:hover{color:#000;}

/* RIGHT AREA */
.nav-right{
    display:flex;
    align-items:center;
    gap:14px;
}

/* 1분견적 (강제 우측 고정 CTA) */
.quick-estimate{
    background:#e60012;
    color:#fff;
    border:none;
    padding:7px 12px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
}

/* hamburger */
.menu-btn{
    display:none;
    flex-direction:column;
    gap:4px;
    cursor:pointer;
}

.menu-btn span{
    width:22px;
    height:2px;
    background:#000;
}

/* ================= MOBILE ================= */
@media(max-width:1024px){

nav{
    padding:0 15px;
}

/* center menu 제거 */
.nav-center{
    display:none;
}

/* RIGHT 유지 */
.menu-btn{
    display:flex;
}

.quick-estimate{
    font-size:11px;
    padding:6px 10px;
}

}

/* layout */
.wrapper{
    display:flex;
    padding-top:80px;
    height:100vh;
}

.text{
    flex:1;
    padding:80px;
}

.img{
    flex:1;
}

.img img{
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>
</head>

<body>

<nav>

    <!-- LEFT -->
    <a class="logo" href="index.html">KYEOL</a>

    <!-- CENTER -->
    <div class="nav-center">
        <a href="about.html">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <!-- RIGHT -->
    <div class="nav-right">

        <!-- 1분견적 (우측 고정) -->
        <button class="quick-estimate"
            onclick="location.href='estimate.html'">
            1분견적
        </button>

        <!-- hamburger -->
        <div class="menu-btn">
            <span></span><span></span><span></span>
        </div>

    </div>

</nav>

<!-- CONTENT -->
<div class="wrapper">
    <div class="text">
        ABOUT CONTENT
    </div>
    <div class="img">
        <img src="image/about1.jpg">
    </div>
</div>

</body>
</html>
