<!-- estimatePanel 내부 전체 교체용 코드 -->
<div id="estimatePanel" style="overflow-y:auto; padding-bottom:50px;">
    <h2 style="margin-bottom: 25px;">1분 견적 문의</h2>
    <form id="estimateForm">
        <!-- 1. 공사 유형 선택 -->
        <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700;">공사 유형</label>
        <select id="typeSelect" onchange="updateForm()" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd;">
            <option value="none">선택해주세요</option>
            <option value="residence">주거 공간 리모델링</option>
            <option value="commercial">상업 공간 인테리어</option>
            <option value="partial">부분 공사</option>
        </select>

        <!-- 2. 동적 항목 영역 -->
        <div id="dynamicFields"></div>

        <!-- 3. 공통: 연락처 -->
        <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700; margin-top:15px;">연락처</label>
        <input type="tel" id="userPhone" placeholder="010-0000-0000" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd;">

        <button type="button" onclick="calculateEstimate()" style="width:100%; padding:15px; background:#111; color:#fff; border:none; cursor:pointer;">견적 금액 산출하기</button>
        
        <div id="resultArea" style="margin-top:20px; padding:15px; background:#f9f9f9; display:none; font-weight:700; border:1px solid #eee;"></div>
    </form>
</div>

<script>
function updateForm() {
    const type = document.getElementById("typeSelect").value;
    const container = document.getElementById("dynamicFields");
    container.innerHTML = ""; // 초기화

    if (type === "residence") {
        container.innerHTML = `
            <label style="display:block; margin-bottom:5px; font-size:14px; font-weight:700;">희망 공사 항목</label>
            <label><input type="checkbox" name="item" value="500000"> 화장실 변경 (개소당 50만원 기준)</label><br>
            <input type="number" name="qty" placeholder="개소 수 입력" style="width:100%; padding:5px; margin:5px 0;">`;
    } else if (type === "commercial") {
        container.innerHTML = `<p style="font-size:13px; color:#e60023;">※ 업종에 따라 자재비 및 마감재 수준이 상이하여 상세 상담이 필요합니다.</p>`;
    } else if (type === "partial") {
        container.innerHTML = `
            <label><input type="checkbox" onchange="toggleDetail('film')"> 필름 공사</label>
            <div id="filmDetail" style="display:none; padding:10px; background:#eee;">
                도어 <input type="number" style="width:50px;">개소 | 방화문 <input type="number" style="width:50px;">개소
            </div>
            <label><input type="checkbox" onchange="toggleDetail('window')"> 창호 교체</label>
            <select><option>프리미엄</option><option>일반</option></select>`;
    }
}

function toggleDetail(id) {
    const el = document.getElementById(id + "Detail");
    el.style.display = el.style.display === "none" ? "block" : "none";
}

function calculateEstimate() {
    // 여기에 귀사의 일위대가 단가표를 기반으로 한 계산 로직을 넣습니다.
    const resultArea = document.getElementById("resultArea");
    resultArea.style.display = "block";
    resultArea.innerText = "산출된 예상 견적: 000,000원 (상세 상담 요망)";
}
</script>
