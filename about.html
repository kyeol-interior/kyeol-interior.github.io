<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Noto Sans KR',sans-serif;
background:#fff;
color:#111;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
height:80px;
display:flex;
align-items:center;
padding:0 50px;
border-bottom:1px solid #eee;
background:#fff;
z-index:1000;
}

.logo{
font-family:'Playfair Display',serif;
font-size:24px;
font-weight:700;
letter-spacing:4px;
text-decoration:none;
color:#000;
}

.nav-links{
margin-left:auto;
display:flex;
gap:28px;
}

.nav-links a{
text-decoration:none;
color:#999;
font-size:13px;
}

.nav-links a.active{
color:#000;
font-weight:700;
}

/* MOBILE */
.menu-btn{
display:none;
flex-direction:column;
gap:5px;
cursor:pointer;
margin-left:auto;
}

.menu-btn span{
width:24px;
height:2px;
background:#111;
}

#mobileMenu{
position:fixed;
top:80px;
right:-100%;
width:100%;
height:calc(100vh - 80px);
background:#fff;
z-index:2000;
padding:40px;
transition:.3s;
}

#mobileMenu.active{right:0;}

#mobileMenu a{
display:block;
padding:15px 0;
border-bottom:1px solid #eee;
text-decoration:none;
color:#111;
}

/* MAIN */
.wrapper{
display:flex;
width:100%;
height:100vh;
padding-top:80px;
}

.text-side{
flex:1;
padding:0 8%;
display:flex;
flex-direction:column;
justify-content:center;
background:#fbfbfb;
}

.img-side{
flex:1.3;
}

.img-side img{
width:100%;
height:100%;
object-fit:cover;
}

/* CTA */
.cta{
position:fixed;
right:24px;
bottom:24px;
background:#e60023;
color:#fff;
padding:18px 22px;
border-radius:16px;
cursor:pointer;
z-index:5000;
box-shadow:0 12px 35px rgba(230,0,35,0.35);
}

.cta-sub{font-size:11px;opacity:0.85;}
.cta-main{font-size:18px;font-weight:800;}

/* PANEL */
#overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.35);
display:none;
z-index:2500;
}

#overlay.active{display:block;}

#panel{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:#fff;
z-index:3000;
transition:.35s;
padding:90px 25px;
overflow:auto;
}

#panel.active{right:0;}

.btn-group{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:15px;
}

.btn{
padding:12px;
border:1px solid #ddd;
text-align:center;
cursor:pointer;
}

.btn.active{
background:#111;
color:#fff;
}

#formArea{
margin-top:20px;
}

.partial-group{
margin-bottom:15px;
padding:10px;
border:1px solid #eee;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
}

/* MOBILE */
@media(max-width:1024px){

.nav-links{display:none;}
.menu-btn{display:flex;}

.wrapper{
flex-direction:column;
height:auto;
}

.img-side{height:40vh;}
.text-side{padding:40px 20px;}

.cta{
width:calc(100% - 32px);
right:16px;
bottom:16px;
text-align:center;
}
}
</style>
</head>

<body>

<div id="overlay" onclick="closePanel()"></div>

<!-- NAV -->
<nav>
<a href="index.html" class="logo">KYEOL</a>

<div class="nav-links">
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<div class="menu-btn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>
</nav>

<!-- MOBILE MENU -->
<div id="mobileMenu">
<a href="about.html">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<!-- MAIN (원본 문구 복구) -->
<div class="wrapper">

<div class="text-side">

<h1 style="font-size:34px;line-height:1.4;">
"The devil is in the detail,<br>
악마는 디테일에 있다."
</h1>

<p style="margin-top:35px;font-size:17px;line-height:2;color:#444;">
단순해 보이는 공간일지라도,<br>
그 완성도는 눈에 잘 띄지 않는<br>
작은 디테일에서 결정됩니다.
</p>

</div>

<div class="img-side">
<img src="image/about1.jpg">
</div>

</div>

<!-- CTA -->
<div class="cta" onclick="openPanel()">
<div class="cta-sub">무료 상담 가능</div>
<div class="cta-main">1분 견적 →</div>
</div>

<!-- PANEL -->
<div id="panel">

<h2>1분 견적</h2>

<div class="btn-group">
<div class="btn" onclick="setType(this,'residence')">주거 리모델링</div>
<div class="btn" onclick="setType(this,'commercial')">상가 인테리어</div>
<div class="btn" onclick="setType(this,'partial')">부분시공</div>
</div>

<div id="formArea"></div>

<input id="date" placeholder="시공 요청 일자 (예: 26년 5월 27일)">
<input id="area" placeholder="시공 요청 지역 (예: 전주시 완산구)">
<input id="phone" placeholder="연락처">

<button onclick="submitEstimate()">견적 전송</button>

</div>

<script>

function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}

function openPanel(){
document.getElementById("panel").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closePanel(){
document.getElementById("panel").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

/* 1분견적 (정상 복구) */
function setType(el,type){

document.querySelectorAll(".btn").forEach(b=>b.classList.remove("active"));
el.classList.add("active");

const area=document.getElementById("formArea");

if(type==="residence"){
area.innerHTML=`
주거 형태<br>
<label><input type="radio" name="home"> 주택</label>
<label><input type="radio" name="home"> 아파트</label>
<br><br>
평수 <input type="number">
<br>
<label><input type="checkbox"> 창호 포함</label>
<label><input type="checkbox"> 프리미엄</label>
<br><br>
화장실 :
<select>
<option>0</option>
<option>1</option>
<option>2</option>
</select>
`;
}

if(type==="commercial"){
area.innerHTML=`
<div style="color:#e60023;line-height:1.8;">
자재 / 업종 / 현장 조건에 따라 견적이 달라집니다.<br>
담당자 상담 후 정확한 안내가 가능합니다.
</div>
`;
}

if(type==="partial"){
area.innerHTML=`
<b>필름</b><br>
<label><input type="checkbox">방문</label>
<label><input type="checkbox">싱크대</label>
<label><input type="checkbox">붙박이장</label>
<br><br>
<b>실리콘</b><br>
<label><input type="checkbox">세면대</label>
<label><input type="checkbox">변기</label>
<label><input type="checkbox">샷시</label>
`;
}
}

function submitEstimate(){
const phone=document.getElementById("phone").value;
if(phone.length<10) return alert("연락처 확인");

alert("접수 완료");
closePanel();
}

</script>

</body>
</html>
