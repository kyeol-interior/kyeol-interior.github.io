<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Noto Sans KR',sans-serif;
background:#fff;
color:#111;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
height:80px;
display:flex;
align-items:center;
padding:0 50px;
border-bottom:1px solid #eee;
background:#fff;
z-index:1000;
}

.logo{
font-family:'Playfair Display',serif;
font-size:24px;
font-weight:700;
letter-spacing:4px;
text-decoration:none;
color:#000;
}

.nav-links{
margin-left:auto;
display:flex;
gap:28px;
}

.nav-links a{
text-decoration:none;
color:#999;
font-size:13px;
}

.nav-links a.active{
color:#000;
font-weight:700;
}

/* MAIN */
.wrapper{
display:flex;
width:100%;
height:100vh;
padding-top:80px;
}

.text-side{
flex:1;
padding:0 8%;
display:flex;
flex-direction:column;
justify-content:center;
background:#fbfbfb;
}

.img-side{
flex:1.3;
}

.img-side img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.title-main{
font-size:34px;
margin-bottom:30px;
line-height:1.4;
}

.desc-text{
font-size:17px;
line-height:2;
color:#444;
}

/* PANEL */
#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
display:none;
z-index:2500;
}

#overlay.active{
display:block;
}

#estimatePanel{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:#fff;
z-index:3000;
transition:.4s;
padding:90px 25px;
overflow-y:auto;
}

#estimatePanel.active{
right:0;
}

.btn-group{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:15px;
}

.type-btn{
padding:12px;
border:1px solid #ddd;
text-align:center;
cursor:pointer;
}

.type-btn.active{
background:#111;
color:#fff;
}

#subFields{
margin-top:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
}

/* CTA BUTTON */
.cta-estimate{
position:fixed;
right:24px;
bottom:24px;
z-index:5000;
background:#e60023;
color:#fff;
padding:18px 22px;
border-radius:18px;
cursor:pointer;
box-shadow:0 12px 35px rgba(230,0,35,0.35);
transition:.2s;
}

.cta-estimate:hover{
transform:scale(1.03);
}

.cta-sub{
font-size:11px;
opacity:0.85;
}

.cta-main{
font-size:18px;
font-weight:800;
margin-top:3px;
}

@media(max-width:1024px){

.nav-links{display:none;}

.wrapper{
flex-direction:column;
height:auto;
}

.img-side{
height:40vh;
order:2;
}

.text-side{
order:1;
padding:40px 20px;
}

.title-main{font-size:24px;}
.desc-text{font-size:15px;}

.cta-estimate{
width:calc(100% - 32px);
right:16px;
bottom:16px;
text-align:center;
}
}
</style>
</head>

<body>

<div id="overlay" onclick="closePanel()"></div>

<!-- NAV (1분견적 완전 제거) -->
<nav>
<a href="index.html" class="logo">KYEOL</a>

<div class="nav-links">
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>
</nav>

<!-- MAIN -->
<div class="wrapper">

<div class="text-side">

<h1 class="title-main">
"The devil is in the detail,<br>
악마는 디테일에 있다."
</h1>

<p class="desc-text">
단순해 보이는 공간일지라도,<br>
그 완성도는 눈에 잘 띄지 않는<br>
작은 디테일에서 결정됩니다.<br><br>

<b>
머무는 순간의 온기,<br>
눈에 닿는 모든 곳에 결이 좋은 공간을 짓습니다.
</b>
</p>

</div>

<div class="img-side">
<img src="image/about1.jpg">
</div>

</div>

<!-- CTA BUTTON (핵심) -->
<div class="cta-estimate" onclick="openPanel()">

<div class="cta-sub">무료 상담 가능</div>
<div class="cta-main">1분 견적 →</div>

</div>

<!-- PANEL -->
<div id="estimatePanel">

<h2>1분 견적</h2>

<div class="btn-group">
<div class="type-btn" onclick="selectType(this,'residence')">주거</div>
<div class="type-btn" onclick="selectType(this,'commercial')">상가</div>
<div class="type-btn" onclick="selectType(this,'partial')">부분시공</div>
</div>

<div id="subFields"></div>

<input id="requestDate" placeholder="시공일">
<input id="requestArea" placeholder="지역">
<input id="userPhone" placeholder="연락처">

<button onclick="calculate()">전송</button>

</div>

<script>
function openPanel(){
document.getElementById("estimatePanel").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closePanel(){
document.getElementById("estimatePanel").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

function selectType(el,type){

document.querySelectorAll(".type-btn").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

const sub=document.getElementById("subFields");

if(type==="residence"){
sub.innerHTML=`
<input placeholder="평수">
<label><input type="checkbox">창호</label>
<label><input type="checkbox">프리미엄</label>
`;
}

if(type==="commercial"){
sub.innerHTML=`
<p style="color:#e60023;">
자재 / 업종에 따라 담당자 상담이 필요합니다.
</p>`;
}

if(type==="partial"){
sub.innerHTML=`
<label><input type="checkbox">필름</label>
<label><input type="checkbox">도배</label>
<label><input type="checkbox">실리콘</label>
`;
}
}
</script>

</body>
</html>
