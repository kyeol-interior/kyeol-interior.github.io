<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:#111;overflow-x:hidden;}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    padding:0 50px;
    border-bottom:1px solid #eee;
    background:#fff;
    z-index:1000;
}

.logo{
    font-family:'Playfair Display',serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    text-decoration:none;
    color:#000;
}

.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
    margin-left:auto;
}

.nav-links a{
    text-decoration:none;
    color:#999;
    font-size:13px;
    letter-spacing:2px;
    transition:0.3s;
}

.nav-links a.active{color:#000;font-weight:700;}

.nav-links a.estimate{
    color:#e60023;
    font-weight:800;
    padding:6px 10px;
    border-radius:6px;
    background:rgba(230,0,35,0.06);
}

/* ===== SLIDE PANEL ===== */
#estimatePanel{
    position:fixed;
    top:0;
    right:-66.66%;
    width:66.66%;
    height:100%;
    background:#fff;
    z-index:3000;
    transition:0.45s cubic-bezier(0.25,0.8,0.25,1);
    padding:100px 30px;
    box-shadow:-5px 0 20px rgba(0,0,0,0.15);
}

#estimatePanel.active{
    right:0;
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    display:none;
    z-index:2500;
}

.overlay.active{
    display:block;
}

/* ===== MOBILE CONTROLS ===== */
.mobile-controls{
    display:none;
    position:fixed;
    top:22px;
    right:20px;
    z-index:4000;
    align-items:center;
    gap:14px;
}

/* 1분견적 (왼쪽) */
.mobile-estimate{
    color:#e60023;
    font-weight:800;
    font-size:13px;
    text-decoration:none;
    background:rgba(230,0,35,0.1);
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
}

/* 햄버거 */
.menu-btn{
    display:flex;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
}

.menu-btn span{
    width:22px;
    height:2px;
    background:#000;
}

/* MOBILE NAV */
.mobile-nav{
    position:fixed;
    top:-100%;
    left:0;
    width:100%;
    height:100%;
    background:#fff;
    padding-top:100px;
    transition:0.35s ease;
    z-index:2000;
}

.mobile-nav.active{
    top:0;
}

.mobile-nav a{
    display:block;
    padding:15px 50px;
    text-decoration:none;
    color:#111;
    font-size:18px;
}

/* LAYOUT */
.wrapper{
    display:flex;
    width:100%;
    min-height:100vh;
    padding-top:80px;
}

.text-side{
    flex:1;
    padding:0 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#fbfbfb;
}

.img-side{
    flex:1.3;
    overflow:hidden;
}

.img-side img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===== MOBILE ===== */
@media(max-width:1024px){

    nav{padding:0 25px;}

    .nav-links{display:none;}

    /* 핵심: 무조건 보이게 + 최상단 */
    .mobile-controls{
        display:flex !important;
        position:fixed;
        top:18px;
        right:18px;
        z-index:9999;
    }

    .wrapper{
        flex-direction:column;
    }

    .img-side{
        height:40vh;
        order:2;
    }

    .text-side{
        padding:40px 25px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">KYEOL</a>

    <div class="nav-links">
        <a onclick="togglePanel()" class="estimate">1분견적</a>
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<!-- MOBILE -->
<div class="mobile-controls">
    <a onclick="togglePanel()" class="mobile-estimate">1분견적</a>
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="mobile-nav" id="mobileNav">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
</div>

<div class="overlay" id="overlay" onclick="togglePanel()"></div>

<div id="estimatePanel">
    <h1>1분 견적</h1>
    <p>견적 문의 내용을 입력해주세요.</p>
</div>

<div class="wrapper">
    <div class="text-side">
        <h1>"The devil is in the detail,<br>악마는 디테일에 있다."</h1>
<p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.<br><br>
            <b>"머무는 순간의 온기, 눈에 닿는 모든 곳에 결이 좋은 공간을 짓습니다."</b>
        </p>
    </div>
    <div class="img-side">
        <img src="image/about1.jpg">
    </div>
</div>

<script>
function togglePanel(){
    document.getElementById("estimatePanel").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

function toggleMenu(){
    document.getElementById("mobileNav").classList.toggle("active");
}
</script>

</body>
</html>
