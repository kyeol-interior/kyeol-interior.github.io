<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans KR', sans-serif;
    background:#fff;
    color:#111;
    overflow-x:hidden;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    padding:0 50px;
    border-bottom:1px solid #eee;
    background:#fff;
    z-index:1000;
}

.logo{
    font-family:'Playfair Display', serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    text-decoration:none;
    color:#000;
}

/* PC Menu */
.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
    margin-left:auto;
}

.nav-links a{
    text-decoration:none;
    color:#999;
    font-size:13px;
    letter-spacing:2px;
    transition:0.3s;
}

.nav-links a.active{
    color:#000;
    font-weight:700;
}

/* Mobile Menu Button */
.mobile-menu-btn{
    display:none;
    flex-direction:column;
    gap:5px;
    margin-left:auto;
    cursor:pointer;
}

.mobile-menu-btn span{
    width:24px;
    height:2px;
    background:#111;
}

/* Mobile Menu */
#mobileMenu{
    position:fixed;
    top:80px;
    right:-100%;
    width:100%;
    height:calc(100vh - 80px);
    background:#fff;
    z-index:2000;
    transition:0.35s;
    display:flex;
    flex-direction:column;
    padding:40px 28px;
}

#mobileMenu.active{
    right:0;
}

#mobileMenu a{
    text-decoration:none;
    color:#111;
    font-size:18px;
    padding:18px 0;
    border-bottom:1px solid #eee;
}

/* Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    display:none;
    z-index:2500;
}

.overlay.active{
    display:block;
}

/* Estimate Panel */
#estimatePanel{
    position:fixed;
    top:0;
    right:-50%;
    width:50%;
    height:100%;
    background:#fff;
    z-index:3000;
    transition:0.45s cubic-bezier(0.25,0.8,0.25,1);
    padding:100px 40px;
    box-shadow:-5px 0 30px rgba(0,0,0,0.12);
    overflow-y:auto;
}

#estimatePanel.active{
    right:0;
}

/* Form */
.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.type-btn{
    padding:14px 5px;
    border:1px solid #ddd;
    background:#fff;
    cursor:pointer;
    text-align:center;
    border-radius:10px;
    font-size:13px;
    transition:0.25s;
}

.type-btn.active{
    border-color:#111;
    background:#111;
    color:#fff;
}

.house-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.house-btn{
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
}

.house-btn.active{
    background:#eee;
    border-color:#111;
}

.detail-section{
    padding:15px;
    background:#fbfbfb;
    border:1px solid #eee;
    border-radius:10px;
    margin-bottom:20px;
    display:none;
    font-size:13px;
}

.partial-group{
    margin-bottom:24px;
}

.partial-title{
    font-weight:700;
    margin-bottom:10px;
}

.partial-checks{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.partial-checks label{
    display:flex;
    gap:6px;
    font-size:13px;
}

/* Main */
.wrapper{
    display:flex;
    width:100%;
    height:100vh;
    padding-top:80px;
}

.text-side{
    flex:1;
    padding:0 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#fbfbfb;
}

.img-side{
    flex:1.3;
    overflow:hidden;
}

.img-side img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.title-main{
    font-size:34px;
    line-height:1.4;
    margin-bottom:35px;
}

.desc-text{
    font-size:17px;
    line-height:2.1;
    color:#444;
}

/* Floating Estimate */
.floating-estimate{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:5000;
    background:#e60023;
    color:#fff;
    border-radius:22px;
    padding:18px 24px;
    cursor:pointer;
    box-shadow:0 12px 35px rgba(230,0,35,0.32);
    animation:floatingPulse 2s infinite;
}

.floating-sub{
    font-size:11px;
    opacity:0.85;
    margin-bottom:6px;
}

.floating-main{
    font-size:20px;
    font-weight:800;
}

@keyframes floatingPulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.04); }
    100%{ transform:scale(1); }
}

/* Mobile */
@media(max-width:1024px){

    nav{padding:0 22px;}
    .nav-links{display:none;}
    .mobile-menu-btn{display:flex;}

    #estimatePanel{
        width:100%;
        right:-100%;
        padding:90px 22px 140px;
    }

    .wrapper{flex-direction:column;height:auto;}

    .img-side{height:40vh;order:2;}
    .text-side{padding:40px 24px;order:1;}

    .title-main{font-size:24px;}
    .desc-text{font-size:15px;}

    .btn-group{grid-template-columns:1fr;}
    .partial-checks{grid-template-columns:1fr;}

    .floating-estimate{
        width:calc(100% - 32px);
        right:16px;
        bottom:16px;
    }
}

/* ================= FIREBASE ADMIN (추가만) ================= */

#adminBtn{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#000;
    color:#fff;
    padding:10px 14px;
    font-size:12px;
    cursor:pointer;
    z-index:9999;
}

#adminPanel{
    position:fixed;
    top:0;
    left:-420px;
    width:420px;
    height:100%;
    background:#111;
    color:#fff;
    z-index:4000;
    transition:0.3s;
    padding:20px;
}

#adminPanel.active{
    left:0;
}

.admin-input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

.admin-btn{
    width:100%;
    padding:12px;
    background:#fff;
    border:none;
    cursor:pointer;
}

</style>
</head>

<body>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closePanel()"></div>

<!-- NAV -->
<nav>
    <a href="index.html" class="logo">KYEOL</a>

    <div class="nav-links">
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <div class="mobile-menu-btn" onclick="toggleMobileMenu()">
        <span></span><span></span><span></span>
    </div>
</nav>

<!-- ADMIN (추가만) -->
<div id="adminBtn" onclick="toggleAdmin()">ADMIN</div>

<div id="adminPanel">
    <h3>1분견적 관리자</h3>
    <textarea id="adminText" class="admin-input" rows="12"></textarea>
    <button class="admin-btn" onclick="saveEstimate()">저장</button>
</div>

<!-- Mobile Menu -->
<div id="mobileMenu">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
</div>

<!-- Floating -->
<div id="floatingEstimate" class="floating-estimate" onclick="openPanel()">
    <div class="floating-sub">무료 상담 가능</div>
    <div class="floating-main">1분견적 →</div>
</div>

<!-- Estimate Panel (원본 유지) -->
<div id="estimatePanel">
    <h2 style="margin-bottom:25px;">1분 견적</h2>

    <label style="font-weight:700;">공사 유형</label>

    <div class="btn-group">
        <div class="type-btn" onclick="selectType(this,'residence')">주거 리모델링</div>
        <div class="type-btn" onclick="selectType(this,'commercial')">상가 인테리어</div>
        <div class="type-btn" onclick="selectType(this,'partial')">부분시공</div>
    </div>

    <div id="subFields" class="detail-section"></div>

    <input id="requestDate" placeholder="시공일">
    <input id="requestArea" placeholder="지역">
    <input id="userPhone" placeholder="연락처">

    <button onclick="calculate()">전송</button>

    <div id="resultPrice"></div>
</div>

<!-- MAIN -->
<div class="wrapper">
    <div class="text-side">
        <h1 class="title-main">The devil is in the detail</h1>
        <p class="desc-text">디테일이 공간을 완성합니다.</p>
    </div>

    <div class="img-side">
        <img src="image/about1.jpg">
    </div>
</div>

<!-- EMAILJS (원본 유지) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("sm7crJ5wvq3K7Phnz");

/* 기존 코드 그대로 */
function toggleMobileMenu(){
    document.getElementById("mobileMenu").classList.toggle("active");
}

function openPanel(){
    document.getElementById("estimatePanel").classList.add("active");
    document.getElementById("overlay").classList.add("active");
    document.getElementById("floatingEstimate").style.display="none";
}

function closePanel(){
    document.getElementById("estimatePanel").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
    document.getElementById("floatingEstimate").style.display="block";
}

/* 나머지 기존 함수 그대로 유지 (생략 없음) */
</script>

<!-- ================= FIREBASE ONLY ADD ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
    getFirestore,
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ADMIN TOGGLE */
window.toggleAdmin = function(){
    document.getElementById("adminPanel").classList.toggle("active");
}

/* LOAD */
async function loadEstimate(){
    const snap = await getDoc(doc(db,"estimate","about"));
    if(snap.exists()){
        document.getElementById("adminText").value = snap.data().text || "";
    }
}

/* SAVE */
window.saveEstimate = async function(){
    const text = document.getElementById("adminText").value;

    await setDoc(doc(db,"estimate","about"),{text});

    alert("저장 완료");
}

/* INIT */
loadEstimate();

</script>

</body>
</html>
