<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)결 인테리어 견적 계산기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f3f4f6; font-family: Pretendard, sans-serif; }
        .card { background: white; border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .result-card { background: #111827; color: white; border-radius: 24px; padding: 24px; }
        .title { font-size: 32px; font-weight: 800; }
        .sub { color: #666; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        select, input { width: 100%; border: 1px solid #ddd; border-radius: 14px; padding: 14px; background: white; }
        .result-price { font-size: 20px; font-weight: 700; }
        .total-price { font-size: 42px; font-weight: 900; color: #fde047; }
        .house-btn { flex: 1; padding: 14px; border: 1px solid #ddd; border-radius: 14px; text-align: center; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .house-btn.active { border-color: #000; background: #000; color: #fff; }
    </style>
</head>
<body>

<div class="max-w-7xl mx-auto p-6">
    <div class="card mb-6">
        <h1 class="title">(주)결 인테리어 견적 계산기</h1>
        <p class="sub mt-2">아파트 / 주택 인테리어 예상 견적 자동 계산</p>
    </div>

    <div class="grid lg:grid-cols-2 gap-6">
        <div class="card">
            <h2 class="text-2xl font-bold mb-6">견적 옵션 선택</h2>
            
            <div class="mb-5">
                <label>주거 형태</label>
                <div class="flex gap-4">
                    <div id="houseTypeBtn1" class="house-btn active" onclick="setHouseType('아파트')">아파트</div>
                    <div id="houseTypeBtn2" class="house-btn" onclick="setHouseType('주택')">주택</div>
                </div>
            </div>

            <div class="mb-5">
                <label>평수 입력</label>
                <input type="number" id="size" placeholder="예: 24" value="24" oninput="calculate()">
            </div>

            <div class="mb-5">
                <label>도배 종류</label>
                <select id="wallpaper" onchange="calculate()">
                    <option value="silk">실크 벽지</option>
                    <option value="paper">합지 벽지</option>
                    <option value="premium">고급 실크 벽지</option>
                </select>
            </div>

            <div class="mb-5">
                <label>바닥 종류</label>
                <select id="floor" onchange="calculate()">
                    <option value="18">1.8T 장판</option>
                    <option value="22">2.2T 장판</option>
                    <option value="45">4.5T 지아소리잠</option>
                    <option value="50">5.0T X컴포트</option>
                    <option value="kang">강마루</option>
                    <option value="stone">대리석 마루</option>
                </select>
            </div>

            <div class="mb-5">
                <label>욕실 공사 (개소당 300만원)</label>
                <select id="bathroom" onchange="calculate()">
                    <option value="0">안함</option>
                    <option value="1">욕실 1개</option>
                    <option value="2">욕실 2개</option>
                </select>
            </div>

            <div class="mb-5">
                <label>샷시 필름</label>
                <select id="windowFilm" onchange="calculate()">
                    <option value="0">안함</option>
                    <option value="1300000">샷시 필름 (+130만원)</option>
                </select>
            </div>

            <div class="mb-5">
                <label>샷시 교체</label>
                <select id="windowReplace" onchange="calculate()">
                    <option value="0">안함</option>
                    <option value="7000000">기본 샷시 교체 (+700만원)</option>
                    <option value="12000000">프리미엄 샷시 교체 (+1200만원)</option>
                </select>
            </div>
        </div>

        <div class="result-card">
            <h2 class="text-3xl font-bold mb-8">예상 견적 결과</h2>
            <div class="space-y-4">
                <div class="flex justify-between"><span>도배</span><span id="wallpaperResult">0원</span></div>
                <div class="flex justify-between"><span>바닥</span><span id="floorResult">0원</span></div>
                <div class="flex justify-between"><span>욕실</span><span id="bathroomResult">0원</span></div>
                <div class="flex justify-between"><span>철거(평당 12만)</span><span id="demolitionResult">0원</span></div>
                <div class="flex justify-between"><span>샷시 필름</span><span id="filmResult">0원</span></div>
                <div class="flex justify-between"><span>샷시 교체</span><span id="windowResult">0원</span></div>
                <hr class="border-gray-700 my-4">
                <div class="text-gray-300">최종 소비자 견적</div>
                <div id="totalResult" class="total-price">0원</div>
            </div>
            <div class="mt-8 bg-white/10 p-5 rounded-2xl" id="description">옵션을 선택하면 상세 설명이 표시됩니다.</div>
        </div>
    </div>
</div>

<script>
    let selectedHouseType = '아파트';

    function setHouseType(type) {
        selectedHouseType = type;
        document.getElementById('houseTypeBtn1').classList.toggle('active', type === '아파트');
        document.getElementById('houseTypeBtn2').classList.toggle('active', type === '주택');
        calculate();
    }

    function numberFormat(num) { return Number(num).toLocaleString() + "원"; }

    function calculate() {
        const size = parseFloat(document.getElementById("size").value) || 0;
        const wallpaper = document.getElementById("wallpaper").value;
        const floor = document.getElementById("floor").value;
        const bathroom = parseInt(document.getElementById("bathroom").value);
        const windowFilm = parseInt(document.getElementById("windowFilm").value);
        const windowReplace = parseInt(document.getElementById("windowReplace").value);

        // 비용 계산
        const wallpaperRates = { silk: 30000, paper: 18000, premium: 50000 };
        const floorRates = { "18":35100, "22":65000, "45":120900, "50":156000, "kang":156000, "stone":182000 };
        
        const wallpaperCost = size * wallpaperRates[wallpaper];
        const floorCost = size * floorRates[floor];
        const bathroomCost = bathroom * 3000000;
        const demolitionCost = size * 120000;
        const filmCost = windowFilm;
        const windowCost = windowReplace;

        const totalPrice = wallpaperCost + floorCost + bathroomCost + demolitionCost + filmCost + windowCost;

        // 화면 출력
        document.getElementById("wallpaperResult").innerText = numberFormat(wallpaperCost);
        document.getElementById("floorResult").innerText = numberFormat(floorCost);
        document.getElementById("bathroomResult").innerText = numberFormat(bathroomCost);
        document.getElementById("demolitionResult").innerText = numberFormat(demolitionCost);
        document.getElementById("filmResult").innerText = numberFormat(filmCost);
        document.getElementById("windowResult").innerText = numberFormat(windowCost);
        document.getElementById("totalResult").innerText = numberFormat(totalPrice);
        
        document.getElementById("description").innerHTML = `<b>주거 형태: ${selectedHouseType}</b><br>현재 ${size}평 기준으로 산출된 예상 견적입니다. 상세 항목별로 상담을 통해 최종 조율이 가능합니다.`;
    }

    calculate();
</script>

</body>
</html>
