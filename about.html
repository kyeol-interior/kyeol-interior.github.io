<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans KR', sans-serif;
    background:#fff;
    color:#111;
    overflow-x:hidden;
}

/* Nav */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    padding:0 50px;
    border-bottom:1px solid #eee;
    background:#fff;
    z-index:1000;
}

.logo{
    font-family:'Playfair Display', serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    text-decoration:none;
    color:#000;
}

.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
    margin-left:auto;
}

.nav-links a{
    text-decoration:none;
    color:#999;
    font-size:13px;
    letter-spacing:2px;
    cursor:pointer;
    transition:0.3s;
}

.nav-links a.active{
    color:#000;
    font-weight:700;
}

.nav-links a.estimate{
    color:#e60023;
    font-weight:800;
    padding:6px 10px;
    border-radius:6px;
    background:rgba(230,0,35,0.06);
}

/* Overlay */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.3);
    display:none;
    z-index:2500;
}

.overlay.active{
    display:block;
}

/* Estimate Panel */
#estimatePanel{
    position:fixed;
    top:0;
    right:-50%;
    width:50%;
    height:100%;
    background:#fff;
    z-index:3000;
    transition:0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
    padding:100px 40px;
    box-shadow:-5px 0 20px rgba(0,0,0,0.1);
    overflow-y:auto;
}

#estimatePanel.active{
    right:0;
}

/* Form */
.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-bottom:20px;
}

.type-btn{
    padding:12px 5px;
    border:1px solid #ddd;
    background:#fff;
    cursor:pointer;
    text-align:center;
    border-radius:4px;
    font-size:12px;
    transition:0.3s;
}

.type-btn.active{
    border-color:#000;
    background:#000;
    color:#fff;
}

.house-group{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.house-btn{
    padding:10px;
    border:1px solid #ddd;
    cursor:pointer;
    text-align:center;
    border-radius:4px;
    font-size:13px;
}

.house-btn.active{
    border-color:#000;
    background:#eee;
}

.detail-section{
    padding:15px;
    background:#fbfbfb;
    border:1px solid #eee;
    margin-bottom:20px;
    display:none;
    font-size:13px;
}

/* Mobile */
.mobile-controls{
    display:none;
    position:fixed;
    top:25px;
    right:25px;
    z-index:2000;
    align-items:center;
    gap:15px;
}

.mobile-estimate{
    color:#e60023;
    font-weight:800;
    font-size:13px;
    text-decoration:none;
    background:rgba(230,0,35,0.1);
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

.menu-btn{
    display:flex;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
}

.menu-btn span{
    width:22px;
    height:2px;
    background:#000;
}

/* Layout */
.wrapper{
    display:flex;
    width:100%;
    height:100vh;
    padding-top:80px;
}

.text-side{
    flex:1;
    padding:0 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#fbfbfb;
}

.img-side{
    flex:1.3;
    overflow:hidden;
}

.img-side img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.title-main{
    font-size:34px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:35px;
}

.desc-text{
    font-size:17px;
    line-height:2.1;
    color:#444;
}

.desc-text b{
    color:#111;
    font-weight:700;
}

/* Responsive */
@media(max-width:1024px){

    nav{
        padding:0 25px;
    }

    .nav-links{
        display:none;
    }

    .mobile-controls{
        display:flex;
    }

    #estimatePanel{
        width:85%;
        right:-85%;
    }

    .wrapper{
        flex-direction:column;
        height:auto;
    }

    .img-side{
        height:40vh;
        order:2;
    }

    .text-side{
        padding:40px 25px;
        order:1;
    }

    .title-main{
        font-size:24px;
    }

    .btn-group{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closePanel()"></div>

<!-- Nav -->
<nav>

    <a href="index.html" class="logo">KYEOL</a>

    <div class="nav-links">

        <a onclick="openPanel()" class="estimate">
            1분견적
        </a>

        <a href="about.html" class="active">
            ABOUT
        </a>

        <a href="portfolio.html">
            PORTFOLIO
        </a>

        <a href="proposal.html">
            PROPOSAL
        </a>

        <a href="contact.html">
            CONTACT
        </a>

    </div>

</nav>

<!-- Mobile -->
<div class="mobile-controls">

    <a onclick="openPanel()" class="mobile-estimate">
        1분견적
    </a>

    <div class="menu-btn">
        <span></span>
        <span></span>
        <span></span>
    </div>

</div>

<!-- Estimate Panel -->
<div id="estimatePanel">

    <h2 style="margin-bottom:25px;">
        1분 견적
    </h2>

    <label style="font-weight:700; margin-bottom:10px; display:block;">
        공사 유형
    </label>

    <div class="btn-group">

        <div class="type-btn" onclick="selectType(this, 'residence')">
            주거 리모델링
        </div>

        <div class="type-btn" onclick="selectType(this, 'commercial')">
            상가 인테리어
        </div>

        <div class="type-btn" onclick="selectType(this, 'partial')">
            부분 보수
        </div>

    </div>

    <div id="subFields" class="detail-section"></div>

    <label style="font-weight:700; margin-bottom:5px; display:block;">
        연락처
    </label>

    <input
        type="tel"
        id="userPhone"
        placeholder="010-0000-0000"
        style="
            width:100%;
            padding:10px;
            margin-bottom:20px;
            border:1px solid #ddd;
        "
    >

    <!-- Buttons -->
    <div style="display:flex; gap:10px;">

        <button
            onclick="resetEstimate()"
            style="
                width:35%;
                padding:15px;
                background:#f5f5f5;
                color:#111;
                border:1px solid #ddd;
                cursor:pointer;
                font-weight:700;
            "
        >
            초기화
        </button>

        <button
            onclick="calculate()"
            style="
                width:65%;
                padding:15px;
                background:#111;
                color:#fff;
                border:none;
                cursor:pointer;
                font-weight:700;
            "
        >
            견적 금액 산출하기
        </button>

    </div>

    <div
        id="resultPrice"
        style="
            margin-top:20px;
            text-align:center;
            font-size:18px;
            font-weight:800;
            color:#e60023;
        "
    ></div>

</div>

<!-- Main -->
<div class="wrapper">

    <div class="text-side">

        <h1 class="title-main">
            "The devil is in the detail,<br>
            악마는 디테일에 있다."
        </h1>

        <p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.<br><br>

            <b>
                "머무는 순간의 온기, 눈에 닿는 모든 곳에<br>
                결이 좋은 공간을 짓습니다."
            </b>
        </p>

    </div>

    <div class="img-side">
        <img src="image/about1.jpg" alt="About">
    </div>

</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

/* EmailJS */
emailjs.init("sm7crJ5wvq3K7Phnz");

/* 패널 열기 */
function openPanel(){

    document.getElementById("estimatePanel").classList.add("active");
    document.getElementById("overlay").classList.add("active");

}

/* 패널 닫기 */
function closePanel(){

    document.getElementById("estimatePanel").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");

}

/* 주거형태 선택 */
function selectHouse(el){

    document.querySelectorAll('.house-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    el.classList.add('active');

}

/* 공사유형 선택 */
function selectType(el, type){

    document.querySelectorAll('.type-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    el.classList.add('active');

    document.getElementById('resultPrice').innerText = "";

    const subFields = document.getElementById('subFields');

    subFields.style.display = 'block';

    /* 주거 리모델링 */
    if(type === 'residence'){

        subFields.innerHTML = `

            <div style="margin-bottom:10px;">
                주거형태
            </div>

            <div class="house-group">

                <div class="house-btn" onclick="selectHouse(this)">
                    주택
                </div>

                <div class="house-btn" onclick="selectHouse(this)">
                    아파트
                </div>

            </div>

            <div style="margin-bottom:10px;">
                평수:
                <input type="number" id="pyung" style="width:60px; padding:5px;"> 평
            </div>

            <div style="margin-bottom:5px;">
                <input type="checkbox" id="isWindow">
                창호 교체 포함
            </div>

            <div style="margin-bottom:10px;">
                <input type="checkbox" id="isPremium">
                프리미엄 자재 선택
            </div>

            <div style="margin-bottom:10px;">
                화장실 공사:

                <select id="bathQty">

                    <option value="0">0개소</option>
                    <option value="1">1개소</option>
                    <option value="2">2개소</option>

                </select>
            </div>

        `;

    }

    /* 상가 인테리어 */
    else if(type === 'commercial'){

        subFields.innerHTML = `

            <div style="
                font-size:13px;
                line-height:1.9;
                color:#e60023;
                font-weight:500;
            ">

                자재 사양, 공사 범위, 업종 특성 및 현장 조건에 따라<br>
                견적 금액은 달라질 수 있습니다.<br><br>

                보다 정확한 상담과 안내를 위해<br>
                담당자가 직접 상담 도와드리고 있습니다.

            </div>

        `;

    }

    /* 부분 보수 */
    else if(type === 'partial'){

        subFields.innerHTML = `

            <!-- 필름 -->
            <div style="
                margin-bottom:25px;
                padding-bottom:20px;
                border-bottom:1px solid #eee;
            ">

                <div style="
                    font-weight:700;
                    margin-bottom:12px;
                    color:#111;
                ">
                    필름
                </div>

                <div style="display:grid; gap:8px;">

                    <label><input type="checkbox"> 방문(도어)</label>
                    <label><input type="checkbox"> 방문틀(도어틀)</label>
                    <label><input type="checkbox"> 싱크대</label>
                    <label><input type="checkbox"> 붙박이장</label>
                    <label><input type="checkbox"> 화장대</label>
                    <label><input type="checkbox"> 신발장</label>
                    <label><input type="checkbox"> 현관방화문</label>
                    <label><input type="checkbox"> 샷시(창호)</label>

                </div>

            </div>

            <!-- 실리콘 -->
            <div style="
                margin-bottom:25px;
                padding-bottom:20px;
                border-bottom:1px solid #eee;
            ">

                <div style="
                    font-weight:700;
                    margin-bottom:12px;
                    color:#111;
                ">
                    실리콘(코킹)
                </div>

                <div style="display:grid; gap:8px;">

                    <label><input type="checkbox"> 화장실 세면대</label>
                    <label><input type="checkbox"> 화장실 변기</label>
                    <label><input type="checkbox"> 싱크대</label>
                    <label><input type="checkbox"> 샷시(창호)</label>
                    <label><input type="checkbox"> 필름지 시공부위</label>

                </div>

            </div>

            <!-- 도배 -->
            <div style="
                margin-bottom:25px;
                padding-bottom:20px;
                border-bottom:1px solid #eee;
            ">

                <div style="
                    font-weight:700;
                    margin-bottom:12px;
                    color:#111;
                ">
                    도배
                </div>

                <div style="display:grid; gap:8px;">

                    <label><input type="checkbox"> 안방</label>
                    <label><input type="checkbox"> 거실</label>
                    <label><input type="checkbox"> 작은방</label>

                </div>

            </div>

            <!-- 도장 -->
            <div style="
                margin-bottom:25px;
                padding-bottom:20px;
                border-bottom:1px solid #eee;
            ">

                <div style="
                    font-weight:700;
                    margin-bottom:12px;
                    color:#111;
                ">
                    도장(페인트)
                </div>

                <div style="display:grid; gap:8px;">

                    <label><input type="checkbox"> 베란다</label>
                    <label><input type="checkbox"> 현관</label>

                </div>

            </div>

            <!-- 도어시공 -->
            <div style="margin-bottom:10px;">

                <div style="
                    font-weight:700;
                    margin-bottom:12px;
                    color:#111;
                ">
                    도어시공
                </div>

                <div style="display:grid; gap:8px;">

                    <label><input type="checkbox"> 중문</label>

                    <label style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                    ">
                        안방도어 외

                        <input
                            type="number"
                            placeholder="0"
                            style="
                                width:70px;
                                padding:5px;
                                border:1px solid #ddd;
                            "
                        >

                        개소
                    </label>

                </div>

            </div>

            <!-- 안내문 -->
            <div style="
                margin-top:25px;
                padding-top:15px;
                border-top:1px solid #eee;
                font-size:12px;
                line-height:1.8;
                color:#e60023;
            ">

                부분 보수 공사는 현장 상태 및 시공 범위에 따라<br>
                금액 차이가 발생할 수 있습니다.<br><br>

                보다 정확한 안내를 위해 담당자가 직접 연락드리고 있습니다.

            </div>

        `;

    }

}

/* 초기화 */
function resetEstimate(){

    document.querySelectorAll('.type-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    document.getElementById('subFields').style.display = 'none';
    document.getElementById('subFields').innerHTML = '';

    document.getElementById('userPhone').value = '';

    document.getElementById('resultPrice').innerText = '';

}

/* 계산 */
function calculate(){

    const phone = document.getElementById("userPhone").value;

    if(phone.length < 10){

        alert("연락처를 정확히 입력해주세요.");
        return;

    }

    const type =
        document.querySelector('.type-btn.active')?.innerText || "선택안함";

    document.getElementById("resultPrice").innerText =
        "담당자가 빠르게 연락드리겠습니다.";

    /* 메일 전송 */
    emailjs.send(
        "service_fz1110j",
        "template_0vo3ea6",
        {

            project_type:type,
            phone:phone

        }
    )

    .then(function(){

        alert("견적 문의가 정상 접수되었습니다.");

        closePanel();

    })

    .catch(function(){

        alert("메일 전송에 실패했습니다.");

    });

}

</script>

</body>
</html>
