<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* ===== 기존 CSS 그대로 유지 ===== */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR', sans-serif;background:#fff;color:#111;overflow-x:hidden;}

nav{position:fixed;top:0;width:100%;height:80px;display:flex;align-items:center;padding:0 50px;border-bottom:1px solid #eee;background:#fff;z-index:1000;}
.logo{font-family:'Playfair Display', serif;font-size:24px;font-weight:700;letter-spacing:4px;text-decoration:none;color:#000;}

.nav-links{display:flex;gap:28px;align-items:center;margin-left:auto;}
.nav-links a{text-decoration:none;color:#999;font-size:13px;letter-spacing:2px;transition:0.3s;}
.nav-links a.active{color:#000;font-weight:700;}

#estimatePanel{
position:fixed;top:0;right:-100%;
width:100%;height:100%;
background:#fff;z-index:3000;
transition:0.45s;
padding:100px 40px;
overflow-y:auto;
}
#estimatePanel.active{right:0;}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.35);display:none;z-index:2500;}
.overlay.active{display:block;}

.wrapper{display:flex;width:100%;height:100vh;padding-top:80px;}
.text-side{flex:1;padding:0 8%;display:flex;flex-direction:column;justify-content:center;background:#fbfbfb;}
.img-side{flex:1.3;}
.img-side img{width:100%;height:100%;object-fit:cover;}
.title-main{font-size:34px;margin-bottom:35px;}
.desc-text{font-size:17px;line-height:2.1;color:#444;}
</style>
</head>

<body>

<div id="overlay" class="overlay" onclick="closePanel()"></div>

<nav>
<a href="index.html" class="logo">KYEOL</a>
<div class="nav-links">
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>
</nav>

<!-- ================= ESTIMATE ================= -->
<div id="estimatePanel">

<h2>1분 견적</h2>

<div class="btn-group">
<div class="type-btn" onclick="selectType(this,'residence')">주거 리모델링</div>
<div class="type-btn" onclick="selectType(this,'commercial')">상가 인테리어</div>
<div class="type-btn" onclick="selectType(this,'partial')">부분시공</div>
</div>

<div id="subFields"></div>

<input type="text" id="requestDate" placeholder="시공 요청 일자">
<input type="text" id="requestArea" placeholder="시공 요청 지역">
<input type="tel" id="userPhone" placeholder="연락처">

<button onclick="calculate()">견적 문의</button>

<div id="resultPrice"></div>

</div>

<!-- ================= MAIN ================= -->
<div class="wrapper">
<div class="text-side">
<h1 class="title-main">디테일이 공간을 완성합니다</h1>
<p class="desc-text">작은 차이가 큰 결과를 만듭니다.</p>
</div>
<div class="img-side">
<img src="image/about1.jpg">
</div>
</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init("sm7crJ5wvq3K7Phnz");

/* ================= FIREBASE (Firestore 연동) ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyD2Ct9z_RzhkheCicuZXf5-mL10S7cU3zc",
authDomain:"kyeol-site.firebaseapp.com",
projectId:"kyeol-site",
storageBucket:"kyeol-site.firebasestorage.app",
messagingSenderId:"1051027367783",
appId:"1:1051027367783:web:efa4b6d64ecff81da7f1c2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 기본값 */
window.firebasePrices = {
basePrice:130,
premiumPrice:180,
windowPrice:160
};

/* Firestore 로드 */
async function loadSettings(){
try{
const snap = await getDoc(doc(db,"settings","estimate"));
if(snap.exists()){
const d = snap.data();
window.firebasePrices = {
basePrice:d.basePrice ?? 130,
premiumPrice:d.premiumPrice ?? 180,
windowPrice:d.windowPrice ?? 160
};
}
}catch(e){
console.log(e);
}
}
loadSettings();

/* ================= UI ================= */
function openPanel(){
document.getElementById("estimatePanel").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closePanel(){
document.getElementById("estimatePanel").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

/* ================= TYPE ================= */
function selectType(el,type){
document.querySelectorAll(".type-btn").forEach(b=>b.classList.remove("active"));
el.classList.add("active");

const sub=document.getElementById("subFields");

if(type==="residence"){
sub.innerHTML=`
<p>주거형</p>
<input id="pyung" placeholder="평수">
<label><input type="checkbox" id="isWindow"> 창호</label>
<label><input type="checkbox" id="isPremium"> 프리미엄</label>
`;
}

if(type==="commercial"){
sub.innerHTML=`
<p style="color:red">
자재/업종/현장조건에 따라 금액이 상이하며<br>
담당자가 직접 상담드립니다.
</p>`;
}

if(type==="partial"){
sub.innerHTML=`
<p>부분시공 선택</p>
<label><input type="checkbox" value="필름">필름</label>
<label><input type="checkbox" value="도배">도배</label>
<label><input type="checkbox" value="실리콘">실리콘</label>
`;
}
}

/* ================= CALC ================= */
function calculate(){

const phone=document.getElementById("userPhone").value;
if(phone.length<10){
alert("연락처 확인");
return;
}

const type=document.querySelector(".type-btn.active")?.innerText;

const date=document.getElementById("requestDate").value;
const area=document.getElementById("requestArea").value;

let message="";

if(type==="주거 리모델링"){

const pyung=document.getElementById("pyung")?.value||0;
const win=document.getElementById("isWindow")?.checked;
const pre=document.getElementById("isPremium")?.checked;

let price=window.firebasePrices.basePrice;

if(pre) price=window.firebasePrices.premiumPrice;
else if(win) price=window.firebasePrices.windowPrice;

message=
`[주거]

평: ${pyung}
가격기준: ${price}
날짜: ${date}
지역: ${area}
폰: ${phone}`;
}

if(type==="상가 인테리어"){
message=
`[상가]

상가 인테리어 상담 요청
날짜: ${date}
지역: ${area}
폰: ${phone}`;
}

if(type==="부분시공"){

const list=[...document.querySelectorAll("#subFields input:checked")]
.map(e=>e.value);

message=
`[부분시공]

${list.join(",")}
날짜: ${date}
지역: ${area}
폰: ${phone}`;
}

/* SEND */
emailjs.send("service_fz1110j","template_0vo3ea6",{
message
});

document.getElementById("resultPrice").innerText="전송 완료";
}

</script>

</body>
</html>
