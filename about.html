<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="description" content="전주 인테리어 전문 기업 (주)결을 소개합니다.">
<title>ABOUT | (주)결</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-font-smoothing:antialiased;
}

body {
    background:#fff;
    font-family:'Noto Sans KR', sans-serif;
    color:#111;
    overflow-x:hidden;
}

/* ================= NAV ================= */
nav {
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    padding:0 50px;
    background:#fff;
    border-bottom:1px solid #eee;
    z-index:2000;
}

/* LEFT GROUP */
.nav-left {
    display:flex;
    align-items:center;
    gap:18px;
}

/* LOGO */
.logo {
    font-size:22px;
    font-weight:700;
    letter-spacing:3px;
    text-decoration:none;
    color:#000;
}

/* 1분견적 (빨간 CTA - 핵심 변경) */
.quick-estimate {
    font-size:12px;
    padding:7px 12px;
    background:#e60012;
    color:#fff;
    border:none;
    cursor:pointer;
    white-space:nowrap;
    font-weight:700;
}

/* RIGHT MENU */
.nav-right {
    margin-left:auto;
    display:flex;
    gap:30px;
}

.nav-right a {
    text-decoration:none;
    font-size:13px;
    color:#999;
    letter-spacing:2px;
    transition:0.3s;
}

.nav-right a:hover {
    color:#000;
}

/* MOBILE HAMBURGER */
.menu-btn {
    display:none;
    flex-direction:column;
    gap:5px;
    margin-left:20px;
    cursor:pointer;
}

.menu-btn span {
    width:22px;
    height:2px;
    background:#000;
}

/* ================= MOBILE MENU ================= */
.mobile-nav {
    position:fixed;
    top:-100%;
    left:0;
    width:100%;
    background:#fff;
    padding:100px 40px 30px;
    display:flex;
    flex-direction:column;
    border-bottom:1px solid #eee;
    transition:0.4s;
    z-index:1500;
}

.mobile-nav.active {
    top:0;
}

.mobile-nav a {
    padding:15px 0;
    border-bottom:1px solid #f2f2f2;
    text-decoration:none;
    color:#111;
    font-size:16px;
}

/* ================= LAYOUT ================= */
.wrapper {
    display:flex;
    height:100vh;
    padding-top:80px;
}

.text-side {
    flex:1;
    padding:0 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.img-side {
    flex:1.3;
}

.img-side img {
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ================= MOBILE ================= */
@media (max-width:1024px) {

nav {
    padding:0 20px;
}

/* PC 메뉴 숨김 */
.nav-right {
    display:none;
}

/* 햄버거 표시 */
.menu-btn {
    display:flex;
}

/* 모바일 구조 유지 */
.wrapper {
    flex-direction:column;
    height:auto;
}

.img-side {
    height:40vh;
}

.text-side {
    padding:40px 20px;
}

/* CTA 유지 (작게) */
.quick-estimate {
    font-size:11px;
    padding:6px 10px;
}
}
</style>
</head>

<body>

<nav>

    <!-- LEFT -->
    <div class="nav-left">
        <a href="index.html" class="logo">KYEOL</a>

        <!-- 🔴 1분견적 (로고 바로 옆, ABOUT보다 좌측) -->
        <button class="quick-estimate" onclick="location.href='proposal.html#estimate'">
            1분견적
        </button>
    </div>

    <!-- RIGHT (PC MENU) -->
    <div class="nav-right">
        <a href="about.html">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <!-- MOBILE -->
    <div class="menu-btn" id="menuBtn">
        <span></span><span></span><span></span>
    </div>

</nav>

<!-- MOBILE NAV -->
<div class="mobile-nav" id="mobileNav">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
</div>

<!-- CONTENT -->
<div class="wrapper">

    <div class="text-side">
        <h1 style="font-size:34px; margin-bottom:30px;">
            The devil is in the detail
        </h1>

        <p style="line-height:2;">
            디테일이 공간의 완성도를 결정합니다.
        </p>
    </div>

    <div class="img-side">
        <img src="image/about1.jpg">
    </div>

</div>

<script>
const btn = document.getElementById('menuBtn');
const nav = document.getElementById('mobileNav');

btn.onclick = () => {
    nav.classList.toggle('active');
};
</script>

</body>
</html>
