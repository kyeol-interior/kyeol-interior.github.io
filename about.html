<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>

/* ===== 기존 코드 100% 유지 (절대 변경 없음) ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans KR', sans-serif;
    background:#fff;
    color:#111;
    overflow-x:hidden;
}

/* NAV */
nav{
    position:fixed;
    top:0;
    width:100%;
    height:80px;
    display:flex;
    align-items:center;
    padding:0 50px;
    border-bottom:1px solid #eee;
    background:#fff;
    z-index:1000;
}

.logo{
    font-family:'Playfair Display', serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    text-decoration:none;
    color:#000;
}

.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
    margin-left:auto;
}

.nav-links a{
    text-decoration:none;
    color:#999;
    font-size:13px;
    letter-spacing:2px;
    transition:0.3s;
}

.nav-links a.active{
    color:#000;
    font-weight:700;
}

/* MOBILE MENU */
.mobile-menu-btn{
    display:none;
    flex-direction:column;
    gap:5px;
    margin-left:auto;
    cursor:pointer;
}

.mobile-menu-btn span{
    width:24px;
    height:2px;
    background:#111;
}

#mobileMenu{
    position:fixed;
    top:80px;
    right:-100%;
    width:100%;
    height:calc(100vh - 80px);
    background:#fff;
    z-index:2000;
    transition:0.35s;
    display:flex;
    flex-direction:column;
    padding:40px 28px;
}

#mobileMenu.active{
    right:0;
}

#mobileMenu a{
    text-decoration:none;
    color:#111;
    font-size:18px;
    padding:18px 0;
    border-bottom:1px solid #eee;
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.35);
    display:none;
    z-index:2500;
}

.overlay.active{
    display:block;
}

/* WRAPPER (절대 수정 금지) */
.wrapper{
    display:flex;
    width:100%;
    height:100vh;
    padding-top:80px;
}

.text-side{
    flex:1;
    padding:0 8%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:#fbfbfb;
}

.img-side{
    flex:1.3;
    overflow:hidden;
}

.img-side img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.title-main{
    font-size:34px;
    line-height:1.4;
    margin-bottom:35px;
}

.desc-text{
    font-size:17px;
    line-height:2.1;
    color:#444;
}

/* CTA */
.floating-estimate{
    position:fixed;
    right:24px;
    bottom:24px;
    z-index:5000;
    background:#e60023;
    color:#fff;
    border-radius:22px;
    padding:18px 24px;
    cursor:pointer;
}

.floating-sub{
    font-size:11px;
    opacity:0.85;
    margin-bottom:6px;
}

.floating-main{
    font-size:20px;
    font-weight:800;
}

/* PANEL (UI 유지) */
#estimatePanel{
    position:fixed;
    top:0;
    right:-100%;
    width:100%;
    height:100%;
    background:#fff;
    z-index:3000;
    transition:0.4s;
    padding:90px 25px;
    overflow-y:auto;
}

#estimatePanel.active{
    right:0;
}

/* FORM (기존 유지) */
.btn-group{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

.type-btn{
    padding:14px;
    border:1px solid #ddd;
    text-align:center;
    cursor:pointer;
}

.type-btn.active{
    background:#111;
    color:#fff;
}

/* MOBILE (기존 유지) */
@media(max-width:1024px){

.nav-links{display:none;}
.mobile-menu-btn{display:flex;}

.wrapper{
    flex-direction:column;
    height:auto;
}

.img-side{height:40vh;}

.floating-estimate{
    width:calc(100% - 32px);
    right:16px;
}
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" class="overlay" onclick="closePanel()"></div>

<!-- NAV (그대로 유지) -->
<nav>
<a href="index.html" class="logo">KYEOL</a>

<div class="nav-links">
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<div class="mobile-menu-btn" onclick="toggleMobileMenu()">
<span></span><span></span><span></span>
</div>
</nav>

<!-- MOBILE MENU -->
<div id="mobileMenu">
<a href="about.html">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<!-- MAIN (절대 수정 금지) -->
<div class="wrapper">

<div class="text-side">

<h1 class="title-main">
"The devil is in the detail,<br>
악마는 디테일에 있다."
</h1>

<p class="desc-text">
단순해 보이는 공간일지라도,<br>
그 완성도는 눈에 잘 띄지 않는<br>
작은 디테일에서 결정됩니다.<br><br>

<b>"머무는 순간의 온기, 눈에 닿는 모든 곳에<br>
결이 좋은 공간을 짓습니다."</b>
</p>

</div>

<div class="img-side">
<img src="image/about1.jpg">
</div>

</div>

<!-- CTA -->
<div class="floating-estimate" onclick="openPanel()">
<div class="floating-sub">무료 상담 가능</div>
<div class="floating-main">1분견적 →</div>
</div>

<!-- PANEL (UI 유지) -->
<div id="estimatePanel">

<h2>1분 견적</h2>

<div class="btn-group">
<div class="type-btn" onclick="selectType(this,'residence')">주거</div>
<div class="type-btn" onclick="selectType(this,'commercial')">상가</div>
<div class="type-btn" onclick="selectType(this,'partial')">부분</div>
</div>

<input id="date" placeholder="일자">
<input id="area" placeholder="지역">
<input id="phone" placeholder="연락처">

<button onclick="submitEstimate()">전송</button>

</div>

<!-- FIREBASE (추가만, UI 영향 없음) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD2Ct9z_RzhkheCicuZXf5-mL10S7cU3zc",
  authDomain: "kyeol-site.firebaseapp.com",
  projectId: "kyeol-site",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
window.addDoc = addDoc;
window.collection = collection;

</script>

<script>

/* UI 그대로 유지 */
function toggleMobileMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}

function openPanel(){
document.getElementById("estimatePanel").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closePanel(){
document.getElementById("estimatePanel").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

/* SEND (추가만) */
async function submitEstimate(){

const data = {
type: document.querySelector(".type-btn.active")?.innerText || "",
date: document.getElementById("date").value,
area: document.getElementById("area").value,
phone: document.getElementById("phone").value,
createdAt: new Date()
};

await addDoc(collection(db,"estimates"), data);

alert("접수 완료");
closePanel();

}

</script>

</body>
</html>
