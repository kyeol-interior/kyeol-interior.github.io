<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #fff; color: #111; overflow-x: hidden; }

    /* Nav */
    nav { position: fixed; top: 0; width: 100%; height: 80px; display: flex; align-items: center; padding: 0 50px; border-bottom: 1px solid #eee; background: #fff; z-index: 1000; }
    .logo { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; letter-spacing: 4px; text-decoration: none; color: #000; }
    .nav-links { display: flex; gap: 28px; align-items: center; margin-left: auto; }
    .nav-links a { text-decoration: none; color: #999; font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; }
    .nav-links a.active { color: #000; font-weight: 700; }
    .nav-links a.estimate { color: #e60023; font-weight: 800; padding: 6px 10px; border-radius: 6px; background: rgba(230,0,35,0.06); }

    /* Estimate Panel */
    #estimatePanel { position: fixed; top: 0; right: -50%; width: 50%; height: 100%; background: #fff; z-index: 3000; transition: 0.5s cubic-bezier(0.25, 0.8, 0.25, 1); padding: 100px 40px; box-shadow: -5px 0 20px rgba(0,0,0,0.1); overflow-y: auto; }
    #estimatePanel.active { right: 0; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 2500; }
    .overlay.active { display: block; }

    /* Form UI */
    .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .type-btn { padding: 12px 5px; border: 1px solid #ddd; background: #fff; cursor: pointer; text-align: center; border-radius: 4px; font-size: 12px; transition: 0.3s; }
    .type-btn.active { border-color: #000; background: #000; color: #fff; }
    
    .house-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .house-btn { padding: 10px; border: 1px solid #ddd; cursor: pointer; text-align: center; border-radius: 4px; font-size: 13px; }
    .house-btn.active { border-color: #000; background: #eee; }

    .detail-section { padding: 15px; background: #fbfbfb; border: 1px solid #eee; margin-bottom: 20px; display: none; font-size: 13px; }

    /* Mobile Controls */
    .mobile-controls { display: none; position: fixed; top: 25px; right: 25px; z-index: 2000; align-items: center; gap: 15px; }
    .mobile-estimate { color: #e60023; font-weight: 800; font-size: 13px; text-decoration: none; background: rgba(230,0,35,0.1); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    .menu-btn { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
    .menu-btn span { width: 22px; height: 2px; background: #000; }

    .wrapper { display: flex; width: 100%; height: 100vh; padding-top: 80px; }
    .text-side { flex: 1; padding: 0 8%; display: flex; flex-direction: column; justify-content: center; background: #fbfbfb; }
    .img-side { flex: 1.3; overflow: hidden; }
    .img-side img { width: 100%; height: 100%; object-fit: cover; }
    .title-main { font-size: 34px; font-weight: 700; line-height: 1.4; margin-bottom: 35px; }
    .desc-text { font-size: 17px; line-height: 2.1; color: #444; }
    .desc-text b { color: #111; font-weight: 700; }

    @media(max-width:1024px) {
        nav { padding: 0 25px; }
        .nav-links { display: none; }
        .mobile-controls { display: flex; }
        #estimatePanel { width: 85%; right: -85%; }
        .wrapper { flex-direction: column; height: auto; }
        .img-side { height: 40vh; order: 2; }
        .text-side { padding: 40px 25px; order: 1; }
        .title-main { font-size: 24px; }
        .btn-group { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">KYEOL</a>
    <div class="nav-links">
        <a onclick="togglePanel()" class="estimate">1분견적</a>
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>
</nav>

<div class="mobile-controls">
    <a onclick="togglePanel()" class="mobile-estimate">1분견적</a>
    <div class="menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>
</div>

<div id="estimatePanel">
    <h2 style="margin-bottom: 25px;">1분 견적</h2>
    <label style="font-weight:700; margin-bottom:10px; display:block;">공사 유형</label>
    <div class="btn-group">
        <div class="type-btn" onclick="selectType(this, 'residence')">주거 리모델링</div>
        <div class="type-btn" onclick="selectType(this, 'commercial')">상업 인테리어</div>
        <div class="type-btn" onclick="selectType(this, 'partial')">부분 보수</div>
    </div>
    
    <div id="subFields" class="detail-section"></div>

    <label style="font-weight:700; margin-bottom:5px; display:block;">연락처</label>
    <input type="tel" id="userPhone" placeholder="010-0000-0000" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ddd;">
    
    <button onclick="calculate()" style="width:100%; padding:15px; background:#111; color:#fff; border:none; cursor:pointer; font-weight:700;">견적 금액 산출하기</button>
    <div id="resultPrice" style="margin-top:20px; text-align:center; font-size:18px; font-weight:800; color:#e60023;"></div>
</div>

<div class="wrapper">
    <div class="text-side">
        <h1 class="title-main">"The devil is in the detail,<br>악마는 디테일에 있다."</h1>
        <p class="desc-text">단순해 보이는 공간일지라도,<br>그 완성도는 눈에 잘 띄지 않는<br>작은 디테일에서 결정됩니다.</p>
    </div>
    <div class="img-side">
        <img src="image/about1.jpg" alt="About">
    </div>
</div>

<script>
    function togglePanel() { document.getElementById("estimatePanel").classList.toggle("active"); document.getElementById("overlay").classList.toggle("active"); }
    function toggleMenu() { document.getElementById("mobileNav").classList.toggle("active"); }
    
    function selectHouse(el) {
        document.querySelectorAll('.house-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }

    function selectType(el, type) {
        document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('resultPrice').innerText = ""; 
        const subFields = document.getElementById('subFields');
        subFields.style.display = 'block';
        
        if(type === 'residence') {
            subFields.innerHTML = `
                <div style="margin-bottom:10px;">주거형태</div>
                <div class="house-group">
                    <div class="house-btn" onclick="selectHouse(this)">주택</div>
                    <div class="house-btn" onclick="selectHouse(this)">아파트</div>
                </div>
                <div style="margin-bottom:10px;">평수: <input type="number" id="pyung" style="width:60px; padding:5px;"> 평</div>
                <div style="margin-bottom:5px;"><input type="checkbox" id="isWindow"> 창호 교체 포함</div>
                <div style="margin-bottom:10px;"><input type="checkbox" id="isPremium"> 프리미엄 자재 선택</div>
                <div style="margin-bottom:10px;">화장실 공사: 
                    <select id="bathQty"><option value="0">0개소</option><option value="1">1개소</option><option value="2">2개소</option></select>
                </div>
                <div style="font-size:12px; color:#888; border-top:1px solid #eee; padding-top:10px;">※ 상세 내역은 상담을 통해 조율됩니다.</div>`;
        } else {
            subFields.innerHTML = "상세 내역은 상담을 통해 조율됩니다.";
        }
    }

    function calculate() {
        const phone = document.getElementById("userPhone").value;
        const resultArea = document.getElementById("resultPrice");
        if(phone.length < 10) { alert("연락처를 정확히 입력해주세요."); return; }
        
        const type = document.querySelector('.type-btn.active')?.innerText;
        if(type === '주거 리모델링') {
            const pyung = document.getElementById('pyung').value;
            const isWindow = document.getElementById('isWindow').checked;
            const isPremium = document.getElementById('isPremium').checked;
            const bathQty = document.getElementById('bathQty').value;
            
            let pricePerPyung = 130;
            if(isPremium) pricePerPyung = 180;
            else if(isWindow) pricePerPyung = 160;
            
            const total = (pyung * pricePerPyung * 10000) + (bathQty * 3000000);
            resultArea.innerText = `예상 금액: ${total.toLocaleString()}원`;
        } else {
            resultArea.innerText = "상담을 통해 안내드립니다.";
        }
    }
</script>
</body>
</html>
