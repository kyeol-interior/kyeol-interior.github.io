<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT | KYEOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ font-family:'Noto Sans KR', sans-serif; background:#fff; color:#111; }
        /* 레이아웃 디자인은 기존과 동일하게 유지됩니다 */
        nav{ position:fixed; top:0; width:100%; height:80px; display:flex; align-items:center; padding:0 50px; border-bottom:1px solid #eee; background:#fff; z-index:1000; }
        .logo{ font-family:'Playfair Display', serif; font-size:24px; font-weight:700; letter-spacing:4px; text-decoration:none; color:#000; }
        #estimatePanel{ position:fixed; top:0; right:-100%; width:50%; height:100%; background:#fff; z-index:3000; transition:0.4s; padding:100px 40px; box-shadow:-5px 0 30px rgba(0,0,0,0.1); overflow-y:auto; }
        #estimatePanel.active{ right:0; }
        .btn-group{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
        .type-btn{ padding:14px 5px; border:1px solid #ddd; cursor:pointer; text-align:center; border-radius:10px; font-size:13px; }
        .type-btn.active{ background:#111; color:#fff; }
        .detail-section{ padding:15px; background:#fbfbfb; border:1px solid #eee; border-radius:10px; margin-bottom:20px; display:none; }
        .wrapper{ display:flex; width:100%; height:100vh; padding-top:80px; }
        .text-side{ flex:1; padding:0 8%; display:flex; flex-direction:column; justify-content:center; }
        .floating-estimate{ position:fixed; right:24px; bottom:24px; z-index:5000; background:#e60023; color:#fff; padding:18px 24px; cursor:pointer; border-radius:22px; }
        @media(max-width: 600px){ .title-main { font-size: 24px; } #estimatePanel{ width:100%; } }
    </style>
</head>
<body>
    <div id="estimatePanel">
        <h2>1분 견적</h2>
        <div class="btn-group">
            <div class="type-btn" onclick="selectType(this, '주거')">주거 리모델링</div>
            <div class="type-btn" onclick="selectType(this, '상가')">상가 인테리어</div>
            <div class="type-btn" onclick="selectType(this, '부분시공')">부분시공</div>
        </div>
        <div id="subFields" class="detail-section"></div>
        <input type="tel" id="userPhone" placeholder="연락처 입력" style="width:100%; padding:14px; margin-bottom:10px;">
        <button onclick="calculate()" style="width:100%; padding:16px; background:#111; color:#fff; border:none;">견적 문의하기</button>
        <div id="resultPrice" style="margin-top:20px; font-weight:800; color:#e60023;"></div>
    </div>

    <div class="wrapper">
        <div class="text-side">
            <h1 class="title-main">"The devil is in the detail,<br>악마는 디테일에 있다."</h1>
            <p class="desc-text">결이 좋은 공간을 짓습니다.</p>
        </div>
    </div>
    <div class="floating-estimate" onclick="document.getElementById('estimatePanel').classList.add('active')">1분견적</div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwM2VXrP2g1o18D-FjJrfDWW55jtaj6nHcJCyjgqlqma5RnuqK5mxQIAcS0wTILABr7/exec";
        let allData = [];

        // 페이지 로드 시 시트에서 데이터를 한 번에 가져옴
        fetch(WEB_APP_URL + "?t=" + Date.now())
            .then(res => res.json())
            .then(data => { allData = data; });

        function selectType(el, categoryName){
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            const subFields = document.getElementById('subFields');
            subFields.style.display = 'block';
            subFields.innerHTML = ''; 

            // 시트에서 가져온 데이터로 항목을 동적 생성
            const items = allData.filter(item => item.카테고리 === categoryName);
            items.forEach(item => {
                if (item.타입 === 'select') {
                    subFields.innerHTML += `<div style="margin:10px 0;">${item.항목명} <input type="number" class="part-item" data-price="${item.단가}" value="0" min="0" style="width:50px;"> 개</div>`;
                } else if (item.타입 === 'text') {
                    subFields.innerHTML += `<div style="color:#e60023; margin:10px 0;">${item.단가}</div>`;
                } else {
                    subFields.innerHTML += `<label style="display:block; margin:5px 0;"><input type="${item.타입}" class="part-item" name="${categoryName}" value="${item.단가}" data-name="${item.항목명}"> ${item.항목명} (+${parseInt(item.단가).toLocaleString()}원)</label>`;
                }
            });
        }

        function calculate(){
            let total = 0;
            document.querySelectorAll('.part-item').forEach(el => {
                if (el.type === 'number') total += (parseInt(el.value) * parseInt(el.dataset.price));
                else if (el.checked) total += parseInt(el.value);
            });
            document.getElementById("resultPrice").innerText = "예상 견적: " + total.toLocaleString() + "원";
        }
    </script>
</body>
</html>
