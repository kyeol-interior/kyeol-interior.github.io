<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="전주 인테리어 전문 기업 (주)결을 소개합니다.">
    <title>ABOUT | (주)결</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background:#fff;
            font-family: 'Noto Sans KR', sans-serif;
            color:#111;
            overflow-x:hidden;
        }

        /* ================= NAV ================= */
        nav {
            position:fixed;
            top:0;
            width:100%;
            height:80px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 50px;
            background:#fff;
            z-index:1100;
            border-bottom:1px solid #f2f2f2;
        }

        /* 🔥 로고 통일 (핵심 수정) */
        .logo {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 900;
            font-size:24px;
            letter-spacing:4px;
            text-decoration:none;
            color:#000;
        }

        .nav-links {
            display:flex;
            gap:35px;
        }

        .nav-links a {
            text-decoration:none;
            color:#999;
            font-size:13px;
            letter-spacing:2px;
            transition:0.3s;
        }

        .nav-links a.active {
            color:#000;
            font-weight:700;
        }

        /* ================= MOBILE MENU ================= */
        .menu-btn {
            display:none;
            flex-direction:column;
            gap:6px;
            cursor:pointer;
        }

        .menu-btn span {
            width:22px;
            height:2px;
            background:#000;
        }

        .mobile-nav {
            position:fixed;
            top:-100%;
            left:0;
            width:100%;
            background:#fff;
            display:flex;
            flex-direction:column;
            padding:90px 0 30px;
            transition:0.4s;
            z-index:1050;
            border-bottom:1px solid #eee;
        }

        .mobile-nav.active {
            top:0;
        }

        .mobile-nav a {
            padding:15px 30px;
            text-decoration:none;
            color:#111;
            font-size:16px;
        }

        /* ================= LAYOUT ================= */
        .wrapper {
            display:flex;
            width:100%;
            height:100vh;
            padding-top:80px;
        }

        .text-side {
            flex:1;
            padding:0 8%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            background:#fbfbfb;
        }

        .img-side {
            flex:1.3;
            overflow:hidden;
        }

        .img-side img {
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .title-main {
            font-size:34px;
            font-weight:700;
            line-height:1.4;
            margin-bottom:35px;
            word-break:keep-all;
        }

        /* 🔥 모바일 3줄 깨짐 방지 */
        .desc-text {
            font-size:17px;
            color:#444;
            font-weight:300;
            line-height:2.1;
            word-break:keep-all;
        }

        .desc-text b {
            font-weight:700;
            color:#111;
        }

        .mobile-br {
            display:none;
        }

        .highlight-section {
            margin-top:45px;
            padding-top:35px;
            border-top:1px solid #ddd;
        }

        .cert-badge {
            display:inline-block;
            padding:7px 15px;
            background:#000;
            color:#fff;
            font-size:11px;
            margin-right:8px;
            margin-bottom:12px;
        }

        /* ================= MOBILE ================= */
        @media (max-width:1024px) {

            nav {
                padding:0 25px;
                height:70px;
            }

            .logo {
                font-size:20px;
            }

            .nav-links {
                display:none;
            }

            .menu-btn {
                display:flex;
            }

            .wrapper {
                flex-direction:column;
                height:auto;
                padding-top:70px;
            }

            .img-side {
                height:40vh;
                width:100%;
                order:1;
            }

            .text-side {
                order:2;
                padding:40px 20px 70px;
                background:#fff;
            }

            .title-main {
                font-size:24px;
                margin-bottom:20px;
                line-height:1.35;
            }

            /* 🔥 모바일 2줄 유지 강제 */
            .desc-text {
                font-size:16px;
                line-height:1.9;
                word-break:keep-all;
            }

            .mobile-br {
                display:block;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html" class="logo">KYEOL</a>

    <div class="nav-links">
        <a href="about.html" class="active">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <div class="menu-btn" id="menuBtn">
        <span></span><span></span><span></span>
    </div>
</nav>

<div class="mobile-nav" id="mobileNav">
    <a href="about.html">ABOUT</a>
    <a href="portfolio.html">PORTFOLIO</a>
    <a href="proposal.html">PROPOSAL</a>
    <a href="contact.html">CONTACT</a>
</div>

<div class="wrapper">

    <div class="text-side">

        <h1 class="title-main">
            "The devil is in the detail,<br>
            악마는 디테일에 있다."
        </h1>

        <p class="desc-text">
            단순해 보이는 공간일지라도,<br>
            그 완성도는 눈에 잘 띄지 않는<br>
            작은 디테일에서 결정됩니다.<br><br>

            <b>
                "머무는 순간의 온기, 눈에 닿는 모든 곳에
                <br class="mobile-br">
                결이 좋은 공간을 짓습니다."
            </b>
        </p>

        <div class="highlight-section">
            <span class="cert-badge">실내건축공사업 면허</span>
            <span class="cert-badge">인증 장애인기업</span>
        </div>

    </div>

    <div class="img-side">
        <img src="image/about1.jpg">
    </div>

</div>

<script>
const menuBtn = document.getElementById("menuBtn");
const mobileNav = document.getElementById("mobileNav");

menuBtn.onclick = () => {
    menuBtn.classList.toggle("open");
    mobileNav.classList.toggle("active");
};

document.addEventListener("click", (e) => {
    if (!menuBtn.contains(e.target) && !mobileNav.contains(e.target)) {
        menuBtn.classList.remove("open");
        mobileNav.classList.remove("active");
    }
});
</script>

</body>
</html>
