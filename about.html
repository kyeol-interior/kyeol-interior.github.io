<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ABOUT | (주)결</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-font-smoothing:antialiased;
}

body{
background:#fff;
font-family:'Noto Sans KR', sans-serif;
color:#111;
}

/* ================= NAV ================= */
nav{
position:fixed;
top:0;
width:100%;
height:80px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 50px;
background:#fff;
border-bottom:1px solid #eee;
z-index:1000;
}

/* 🔥 KYEOL 원본 복구 */
.logo{
font-family:'Playfair Display', serif;
font-weight:700;
font-size:24px;
letter-spacing:4px;
color:#000;
text-decoration:none;
}

/* 메뉴 */
.nav-links{
display:flex;
gap:30px;
align-items:center;
}

.nav-links a{
text-decoration:none;
color:#888;
font-size:13px;
letter-spacing:2px;
}

.nav-links a.active{
color:#000;
font-weight:700;
}

/* 🔥 1분견적 강조 */
.nav-links a.estimate{
color:#e60023;
font-weight:800;
}

/* ================= MOBILE MENU ================= */
.menu-btn{
display:none;
flex-direction:column;
gap:5px;
cursor:pointer;
}

.menu-btn span{
width:22px;
height:2px;
background:#000;
}

.mobile-nav{
position:fixed;
top:-100%;
left:0;
width:100%;
background:#fff;
padding:90px 0;
display:flex;
flex-direction:column;
transition:0.4s;
z-index:999;
border-bottom:1px solid #eee;
}

.mobile-nav.active{
top:0;
}

.mobile-nav a{
padding:15px 30px;
text-decoration:none;
color:#111;
}

/* ================= LAYOUT ================= */
.wrapper{
display:flex;
height:100vh;
padding-top:80px;
}

.text{
flex:1;
padding:0 8%;
display:flex;
flex-direction:column;
justify-content:center;
}

.img{
flex:1.3;
}

.img img{
width:100%;
height:100%;
object-fit:cover;
}

/* 타이틀 */
.title{
font-size:34px;
font-weight:700;
line-height:1.4;
margin-bottom:30px;
word-break:keep-all;
}

/* 설명 */
.desc{
font-size:17px;
line-height:2;
color:#444;
word-break:keep-all;
}

/* 모바일 줄바꿈 */
.mobile-br{display:none;}

/* ================= MOBILE ================= */
@media(max-width:1024px){

nav{
padding:0 25px;
height:70px;
}

.nav-links{
display:none;
}

.menu-btn{
display:flex;
}

.wrapper{
flex-direction:column;
height:auto;
}

.img{
height:40vh;
order:1;
}

.text{
order:2;
padding:40px 20px;
}

.title{
font-size:24px;
line-height:1.35;
}

/* 🔥 모바일 2줄 유지 */
.desc{
font-size:16px;
line-height:1.8;
}

.mobile-br{
display:block;
}

}

</style>
</head>

<body>

<nav>

<a href="index.html" class="logo">KYEOL</a>

<div class="nav-links">
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>

<!-- 🔥 1분견적 복구 -->
<a href="estimate.html" class="estimate">1분견적</a>

<a href="contact.html">CONTACT</a>
</div>

<div class="menu-btn" id="menuBtn">
<span></span><span></span><span></span>
</div>

</nav>

<!-- mobile -->
<div class="mobile-nav" id="mobileNav">
<a href="about.html">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="estimate.html" style="color:#e60023;font-weight:800;">1분견적</a>
<a href="contact.html">CONTACT</a>
</div>

<div class="wrapper">

<div class="text">

<h1 class="title">
"The devil is in the detail,<br>
악마는 디테일에 있다."
</h1>

<p class="desc">
단순해 보이는 공간일지라도,<br>
그 완성도는 눈에 잘 띄지 않는<br>
작은 디테일에서 결정됩니다.<br><br>

<b>
머무는 순간의 온기,<br class="mobile-br">
결이 좋은 공간을 짓습니다.
</b>

</p>

</div>

<div class="img">
<img src="image/about1.jpg">
</div>

</div>

<script>

const menuBtn = document.getElementById("menuBtn");
const mobileNav = document.getElementById("mobileNav");

menuBtn.onclick = () => {
menuBtn.classList.toggle("open");
mobileNav.classList.toggle("active");
};

</script>

</body>
</html>
