<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABOUT | KYEOL</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Noto Sans KR',sans-serif;
background:#fff;
color:#111;
overflow-x:hidden;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
height:80px;
display:flex;
align-items:center;
padding:0 50px;
border-bottom:1px solid #eee;
background:#fff;
z-index:1000;
}

.logo{
font-family:'Playfair Display',serif;
font-size:24px;
font-weight:700;
letter-spacing:4px;
text-decoration:none;
color:#000;
}

.nav-links{
margin-left:auto;
display:flex;
gap:28px;
}

.nav-links a{
text-decoration:none;
color:#999;
font-size:13px;
}

.nav-links a.active{
color:#000;
font-weight:700;
}

/* MOBILE HAMBURGER */
.menu-btn{
display:none;
flex-direction:column;
gap:5px;
cursor:pointer;
margin-left:auto;
}

.menu-btn span{
width:24px;
height:2px;
background:#111;
}

#mobileMenu{
position:fixed;
top:80px;
right:-100%;
width:100%;
height:calc(100vh - 80px);
background:#fff;
z-index:2000;
padding:40px;
transition:.3s;
}

#mobileMenu.active{right:0;}

#mobileMenu a{
display:block;
padding:15px 0;
border-bottom:1px solid #eee;
text-decoration:none;
color:#111;
}

/* MAIN */
.wrapper{
display:flex;
width:100%;
height:100vh;
padding-top:80px;
}

.text-side{
flex:1;
padding:0 8%;
display:flex;
flex-direction:column;
justify-content:center;
background:#fbfbfb;
}

.img-side{
flex:1.3;
}

.img-side img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.title-main{
font-size:34px;
margin-bottom:30px;
line-height:1.4;
}

.desc-text{
font-size:17px;
line-height:2;
color:#444;
}

/* CTA */
.cta-estimate{
position:fixed;
right:24px;
bottom:24px;
z-index:5000;
background:#e60023;
color:#fff;
padding:18px 22px;
border-radius:18px;
cursor:pointer;
box-shadow:0 12px 35px rgba(230,0,35,0.35);
}

.cta-sub{font-size:11px;opacity:0.85;}
.cta-main{font-size:18px;font-weight:800;}

/* PANEL */
#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
display:none;
z-index:2500;
}
#overlay.active{display:block;}

#estimatePanel{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:#fff;
z-index:3000;
transition:.4s;
padding:90px 25px;
overflow-y:auto;
}
#estimatePanel.active{right:0;}

.btn-group{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:15px;
}

.type-btn{
padding:12px;
border:1px solid #ddd;
text-align:center;
cursor:pointer;
}

.type-btn.active{
background:#111;
color:#fff;
}

#subFields{
margin-top:20px;
}

input,select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
}

.partial-group{
margin-top:15px;
padding:10px;
border:1px solid #eee;
}

/* MOBILE */
@media(max-width:1024px){

.nav-links{display:none;}
.menu-btn{display:flex;}

.wrapper{
flex-direction:column;
height:auto;
}

.img-side{
height:40vh;
order:2;
}

.text-side{
order:1;
padding:40px 20px;
}

.title-main{font-size:24px;}
.desc-text{font-size:15px;}

.cta-estimate{
width:calc(100% - 32px);
right:16px;
bottom:16px;
text-align:center;
}
}
</style>
</head>

<body>

<div id="overlay" onclick="closePanel()"></div>

<!-- NAV -->
<nav>
<a href="index.html" class="logo">KYEOL</a>

<div class="nav-links">
<a href="about.html" class="active">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<div class="menu-btn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</div>
</nav>

<!-- MOBILE MENU -->
<div id="mobileMenu">
<a href="about.html">ABOUT</a>
<a href="portfolio.html">PORTFOLIO</a>
<a href="proposal.html">PROPOSAL</a>
<a href="contact.html">CONTACT</a>
</div>

<!-- MAIN -->
<div class="wrapper">

<div class="text-side">
<h1 class="title-main">
"The devil is in the detail,<br>
악마는 디테일에 있다."
</h1>

<p class="desc-text">
단순해 보이는 공간일지라도,<br>
그 완성도는 눈에 잘 띄지 않는<br>
작은 디테일에서 결정됩니다.<br><br>

<b>
머무는 순간의 온기,<br>
눈에 닿는 모든 곳에 결이 좋은 공간을 짓습니다.
</b>
</p>
</div>

<div class="img-side">
<img src="image/about1.jpg">
</div>

</div>

<!-- CTA -->
<div class="cta-estimate" onclick="openPanel()">
<div class="cta-sub">무료 상담 가능</div>
<div class="cta-main">1분 견적 →</div>
</div>

<!-- PANEL -->
<div id="estimatePanel">

<h2>1분 견적</h2>

<div class="btn-group">
<div class="type-btn" onclick="selectType(this,'residence')">주거 리모델링</div>
<div class="type-btn" onclick="selectType(this,'commercial')">상가 인테리어</div>
<div class="type-btn" onclick="selectType(this,'partial')">부분시공</div>
</div>

<div id="subFields"></div>

<input id="requestDate" placeholder="시공 요청 일자 (예: 26년 5월 27일)">
<input id="requestArea" placeholder="시공 요청 지역 (예: 전주시 완산구)">
<input id="userPhone" placeholder="연락처">

<button onclick="calculate()">견적 문의하기</button>

</div>

<script>
function toggleMenu(){
document.getElementById("mobileMenu").classList.toggle("active");
}

function openPanel(){
document.getElementById("estimatePanel").classList.add("active");
document.getElementById("overlay").classList.add("active");
}

function closePanel(){
document.getElementById("estimatePanel").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

/* ================= FULL RESTORE ================= */
function selectType(el,type){

document.querySelectorAll(".type-btn").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

const sub=document.getElementById("subFields");

/* 주거 */
if(type==="residence"){
sub.innerHTML=`
<div class="partial-group">
<label>주거 형태</label><br>
<label><input type="radio" name="home"> 주택</label>
<label><input type="radio" name="home"> 아파트</label>
</div>

<div class="partial-group">
평수 : <input type="number" id="pyung"> 평
</div>

<div class="partial-group">
<label><input type="checkbox" id="window"> 창호 교체 포함</label><br>
<label><input type="checkbox" id="premium"> 프리미엄 자재 선택</label>
</div>

<div class="partial-group">
화장실 공사 :
<select id="bath">
<option value="0">0개소</option>
<option value="1">1개소</option>
<option value="2">2개소</option>
</select>
</div>
`;
}

/* 상가 */
if(type==="commercial"){
sub.innerHTML=`
<p style="color:#e60023;line-height:1.8;">
자재비, 요구사항, 업종, 현장 조건에 따라 금액이 달라집니다.<br>
정확한 견적은 담당자 상담을 통해 안내드립니다.
</p>
`;
}

/* 부분시공 */
if(type==="partial"){
sub.innerHTML=`
<div class="partial-group">
<b>필름</b><br>
<label><input type="checkbox" value="방문"> 방문</label>
<label><input type="checkbox" value="싱크대"> 싱크대</label>
<label><input type="checkbox" value="붙박이장"> 붙박이장</label>
<label><input type="checkbox" value="현관문"> 현관문</label>
</div>

<div class="partial-group">
<b>실리콘</b><br>
<label><input type="checkbox" value="세면대"> 세면대</label>
<label><input type="checkbox" value="변기"> 변기</label>
<label><input type="checkbox" value="샷시"> 샷시</label>
</div>

<div class="partial-group">
<b>도배</b><br>
<label><input type="checkbox" value="안방"> 안방</label>
<label><input type="checkbox" value="거실"> 거실</label>
</div>

<div class="partial-group">
<b>도장</b><br>
<label><input type="checkbox" value="베란다"> 베란다</label>
<label><input type="checkbox" value="현관"> 현관</label>
</div>

<div class="partial-group">
<b>도어</b><br>
<label><input type="checkbox" value="중문"> 중문</label><br>
기타 : <input type="text" id="doorExtra">
</div>
`;
}
}

/* SEND */
function calculate(){

const phone=document.getElementById("userPhone").value;
if(phone.length<10) return alert("연락처 입력");

const type=document.querySelector(".type-btn.active")?.innerText;
const date=document.getElementById("requestDate").value;
const area=document.getElementById("requestArea").value;

let message=`[1분견적]\n유형:${type}\n${date}\n${area}\n${phone}`;

alert("전송 완료 (구조 복구 버전)");
console.log(message);
}
</script>

</body>
</html>
