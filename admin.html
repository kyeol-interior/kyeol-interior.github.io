<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN | KYEOL</title>

<style>
body{font-family:sans-serif;padding:40px;background:#f5f5f5;}
.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:10px;}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;}
button{padding:12px;width:100%;margin-top:10px;background:#111;color:#fff;border:none;cursor:pointer;}
h2{margin-bottom:20px;}
.hidden{display:none;}
</style>
</head>

<body>

<div class="box">

<h2>관리자 로그인</h2>

<div id="loginBox">
<input id="email" placeholder="이메일">
<input id="password" type="password" placeholder="비밀번호">
<button onclick="login()">로그인</button>
</div>

<div id="adminBox" class="hidden">

<h3>견적 설정</h3>

<input id="basePrice" placeholder="기본 단가">
<input id="premiumPrice" placeholder="프리미엄 단가">
<input id="windowPrice" placeholder="창호 단가">

<h3>상가 안내 문구</h3>
<input id="commercialNotice" placeholder="상가 안내 문구">

<button onclick="save()">저장</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
getFirestore,
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
apiKey:"AIzaSyD2Ct9z_RzhkheCicuZXf5-mL10S7cU3zc",
authDomain:"kyeol-site.firebaseapp.com",
projectId:"kyeol-site",
storageBucket:"kyeol-site.firebasestorage.app",
messagingSenderId:"1051027367783",
appId:"1:1051027367783:web:efa4b6d64ecff81da7f1c2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* LOGIN */
window.login = async function(){

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

document.getElementById("loginBox").style.display="none";
document.getElementById("adminBox").classList.remove("hidden");

loadData();

}catch(e){
alert("로그인 실패");
}

}

/* LOAD */
async function loadData(){

const snap = await getDoc(doc(db,"settings","estimate"));

if(snap.exists()){

const d = snap.data();

document.getElementById("basePrice").value = d.basePrice || 0;
document.getElementById("premiumPrice").value = d.premiumPrice || 0;
document.getElementById("windowPrice").value = d.windowPrice || 0;
document.getElementById("commercialNotice").value = d.commercialNotice || "";

}

}

/* SAVE */
window.save = async function(){

await setDoc(doc(db,"settings","estimate"),{

basePrice:Number(document.getElementById("basePrice").value),
premiumPrice:Number(document.getElementById("premiumPrice").value),
windowPrice:Number(document.getElementById("windowPrice").value),
commercialNotice:document.getElementById("commercialNotice").value

});

alert("저장 완료");
loadData();

}

</script>

</body>
</html>
