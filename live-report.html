<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE 현장 리포트 | (주)결</title>
    <style>
        /* 기본 스타일 */
        body { background: #000; color: #fff; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; text-align: center; }
        
        /* 헤더 영역 */
        h1 { color: #d4af37; font-size: 28px; margin-bottom: 10px; letter-spacing: -1px; }
        .sub-txt { color: #888; font-size: 15px; margin-bottom: 40px; }
        
        /* 콘텐츠 영역 (비밀번호 확인 전 숨김) */
        #protected-content { display: none; }

        /* 사진첩 프레임 */
        .photo-frame { 
            width: 100%; min-height: 600px; background: #111; 
            border: 1px solid #222; border-radius: 8px; overflow: hidden;
            margin-bottom: 40px;
        }

        /* 다운로드 섹션 */
        .download-section {
            background: #111; padding: 30px; border-radius: 8px; border: 1px solid #d4af3733;
        }
        .download-section p { font-size: 14px; color: #ccc; margin-bottom: 20px; }
        
        .download-btn {
            display: inline-block; padding: 15px 40px; background: #d4af37; color: #000;
            text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 15px;
            transition: 0.3s;
        }
        .download-btn:hover { background: #fff; }

        /* 하단 돌아가기 */
        .back-home { margin-top: 40px; display: block; color: #666; text-decoration: none; font-size: 13px; }
        .back-home:hover { color: #fff; }

        @media (max-width: 768px) {
            h1 { font-size: 22px; }
            .photo-frame { min-height: 400px; }
        }
    </style>
</head>
<body>

    <script>
        // 1. 사용할 비밀번호 설정 (원하시는 번호로 수정 가능)
        var correctPassword = "6452"; 
        
        var userInput = prompt("(주)결 현장 관리 보안 시스템입니다.\n부여받은 비밀번호를 입력해주세요.");

        if (userInput === correctPassword) {
            alert("인증에 성공하였습니다.");
            // 인증 성공 시 콘텐츠 표시
            document.write('<style>#protected-content { display: block !important; }</style>');
        } else {
            alert("비밀번호가 틀렸습니다. 메인 화면으로 이동합니다.");
            window.location.href = "index.html";
        }
    </script>

    <div id="protected-content" class="container">
        <header>
            <h1>[LIVE] 실시간 현장 리포트</h1>
            <p class="sub-txt">(주)결은 시공의 전 과정을 투명하게 공개하여 최상의 신뢰를 약속합니다.</p>
        </header>

        <article>
            <div class="photo-frame">
                <iframe src="about:blank" style="width:100%; height:600px; border:none;"></iframe>
                <p style="padding: 50px; color: #444;">구글 포토 앨범 연동 코드를 입력하면 사진이 이곳에 나타납니다.</p>
            </div>

            <section class="download-section">
                <p>※ 보고서 작성을 위해 고화질 원본 사진이 필요하신 경우 아래 버튼을 이용하세요.</p>
                <a href="#" target="_blank" class="download-btn">📸 현장 사진 전체 다운로드 (원본)</a>
            </section>
        </article>

        <a href="index.html" class="back-home">메인 화면으로 돌아가기</a>
    </div>

</body>
</html>
