<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 리포트 보안 접속 | (주)결</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Noto Sans KR', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111; padding: 40px; border-radius: 15px; border: 1px solid #d4af37; text-align: center; width: 90%; max-width: 400px; }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border-radius: 5px; border: none; background: #222; color: #fff; font-size: 18px; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #d4af37; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #fff; }
        .info-txt { color: #666; font-size: 13px; margin-top: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="login-box">
    <h1>현장 보안 인증</h1>
    <p style="color:#888; font-size:14px;">부여받은 현장 비밀번호를 입력하세요.</p>
    <input type="password" id="sitePassword" placeholder="비밀번호 입력" onkeypress="if(event.keyCode==13) checkPassword()">
    <button onclick="checkPassword()">현장 접속하기</button>
    <div class="info-txt">
        (주)결 보안 시스템<br>인증되지 않은 접근은 차단됩니다.
    </div>
</div>

<script>
    function checkPassword() {
        var pw = document.getElementById("sitePassword").value;
        
        // 현장별 비밀번호 및 링크 설정
        var sites = {
            "1111": "https://photos.app.goo.gl/6YwVX4go9T8StCHq5", // 전북은행
            "2222": "https://photos.app.goo.gl/BqKR9TnFSAYk9jip6", // 현장 1
            "3333": "https://photos.app.goo.gl/v8tdtX7ZyciW6JXt5", // 현장 2
            "4444": "https://photos.app.goo.gl/fTVBR2tkz3FVA8EEA", // 현장 3
            "5555": "https://photos.app.goo.gl/Pw8EqAwvR3Shx6Zi7"  // 현장 4
        };

        if (sites[pw]) {
            // 해당 현장의 구글 포토로 바로 이동
            window.location.href = sites[pw];
        } else {
            alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
            document.getElementById("sitePassword").value = "";
        }
    }
</script>

</body>
</html>
