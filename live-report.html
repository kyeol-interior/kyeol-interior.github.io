<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현장 리포트 센터 | (주)결</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        h1 { color: #d4af37; font-size: 26px; margin-bottom: 10px; letter-spacing: -1px; }
        .sub-txt { color: #888; font-size: 15px; margin-bottom: 40px; line-height: 1.6; }

        /* 현장 리스트 스타일 */
        .site-list { display: flex; flex-direction: column; gap: 12px; }
        .site-item {
            background: #111; border: 1px solid #222; border-radius: 12px;
            padding: 25px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.3s;
        }
        .site-item:hover { border-color: #d4af37; background: #161616; transform: translateY(-3px); }
        .site-info { text-align: left; }
        .site-name { display: block; font-size: 17px; font-weight: bold; color: #fff; }
        .site-status { font-size: 12px; color: #d4af37; margin-top: 6px; display: block; }
        
        .btn-lock { background: #222; color: #d4af37; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: bold; border: 1px solid #333; }

        /* 하단 돌아가기 */
        .back-home { display: inline-block; color: #555; text-decoration: none; font-size: 14px; margin-top: 60px; transition: 0.3s; }
        .back-home:hover { color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 style="margin-bottom: 5px;">(주)결</h1>
            <h1 style="font-size: 22px; color: #fff;">현장 리포트 센터</h1>
            <p class="sub-txt">현장을 선택하신 후 부여받은<br>보안 비밀번호를 입력해 주세요.</p>
        </header>

        <div class="site-list">
            <div class="site-item" onclick="enterSite('현장 1', '1111', 'https://photos.app.goo.gl/6YwVX4go9T8StCHq5')">
                <div class="site-info">
                    <span class="site-name">현장 1</span>
                    <span class="site-status">● 실시간 업데이트 중</span>
                </div>
                <div class="btn-lock">보안 접속</div>
            </div>

            <div class="site-item" onclick="enterSite('현장 2', '2222', 'https://photos.app.goo.gl/BqKR9TnFSAYk9jip6')">
                <div class="site-info">
                    <span class="site-name">현장 2</span>
                    <span class="site-status">● 실시간 업데이트 중</span>
                </div>
                <div class="btn-lock">보안 접속</div>
            </div>

            <div class="site-item" onclick="enterSite('현장 3', '3333', 'https://photos.app.goo.gl/v8tdtX7ZyciW6JXt5')">
                <div class="site-info">
                    <span class="site-name">현장 3</span>
                    <span class="site-status">● 실시간 업데이트 중</span>
                </div>
                <div class="btn-lock">보안 접속</div>
            </div>

            <div class="site-item" onclick="enterSite('현장 4', '4444', 'https://photos.app.goo.gl/fTVBR2tkz3FVA8EEA')">
                <div class="site-info">
                    <span class="site-name">현장 4</span>
                    <span class="site-status">● 실시간 업데이트 중</span>
                </div>
                <div class="btn-lock">보안 접속</div>
            </div>

            <div class="site-item" onclick="enterSite('현장 5', '5555', 'https://photos.app.goo.gl/Pw8EqAwvR3Shx6Zi7')">
                <div class="site-info">
                    <span class="site-name">현장 5</span>
                    <span class="site-status">● 실시간 업데이트 중</span>
                </div>
                <div class="btn-lock">보안 접속</div>
            </div>
        </div>

        <footer>
            <a href="index.html" class="back-home">← (주)결 홈페이지로 돌아가기</a>
        </footer>
    </div>

    <script>
        function enterSite(name, password, url) {
            var userInput = prompt("[" + name + "] 보안 인증\n현장 비밀번호를 입력해주세요.");
            
            if (userInput === null) return; 

            if (userInput === password) {
                window.location.href = url;
            } else {
                alert("비밀번호가 일치하지 않습니다. 다시 확인해주세요.");
            }
        }
    </script>

</body>
</html>
