<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>(주)결 | 인테리어 전문기업</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #d4af37;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .container {
            width: 85%;
            max-width: 400px;
            padding: 40px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-out;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 240px; 
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        p {
            font-size: 14px;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 16px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .home {
            background: #2db400;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(45, 180, 0, 0.2);
            background: #28a100;
        }

        .kakao {
            background: #fee500;
            color: #3c1e1e;
        }

        .kakao:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(254, 229, 0, 0.3);
            background: #fada00;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #64748b;
        }

        .footer b {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
  <img src="image/logo.png" class="logo" alt="(주)결 로고">

  <h1>(주)결</h1>
  <p>PREMIUM INTERIOR DESIGN</p>

  <div class="btn-group">
      <a class="btn home" href="https://kyeol-interior.github.io/">
        홈페이지 둘러보기
      </a>

      <a class="btn kakao" href="https://pf.kakao.com/_bTIEX/chat">
        1:1 카카오 상담
      </a>
  </div>

  <div class="footer">
    안전과 신뢰의 파트너 <b>KYEOL</b>
  </div>
</div>

</body>
</html>
