<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)결 | 인테리어 전문기업</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --accent-color: #d4af37; /* 고급스러운 골드 포인트 */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 배경 장식 요소 */
        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 50px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px); /* 유리창 효과 */
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 80px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: linear-gradient(to bottom, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 15px;
            font-weight: 300;
            color: #94a3b8;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 18px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* 홈페이지 버튼: 다크 모던 스타일 */
        .home {
            background: #ffffff;
            color: #0f172a;
        }

        .home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            background: #f1f5f9;
        }

        /* 카카오 버튼 */
        .kakao {
            background: #fee500;
            color: #3c1e1e;
        }

        .kakao:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(254, 229, 0, 0.2);
            background: #fada00;
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #64748b;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .footer b {
            color: var(--accent-color);
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container">

  <img src="image/logo.png" class="logo" alt="(주)결 로고">

  <h1>(주)결</h1>
  <p>PREMIUM INTERIOR DESIGN</p>

  <div class="btn-group">
      <a class="btn home" href="https://kyeol-interior.github.io/">
        홈페이지 둘러보기
      </a>

      <a class="btn kakao" href="https://pf.kakao.com/_bTIEX/chat">
        1:1 카카오 상담
      </a>
  </div>

  <div class="footer">
    안전과 신뢰의 파트너 <b>KYEOL</b>
  </div>

</div>

</body>
</html>
