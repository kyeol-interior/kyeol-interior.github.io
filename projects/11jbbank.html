<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KYEOL | PROJECT 11 - JB Bank</title>
    <link rel="stylesheet" href="../project-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 11번 프로젝트 전용 미세 조정 (외부 CSS 강제 덮어쓰기) */
        html, body { background: #ffffff !important; color: #111 !important; overflow-x: hidden !important; }
        .container { background: #ffffff !important; display: flex !important; }
        
        /* 왼쪽 고정 영역 */
        .left { 
            background: #ffffff !important; 
            border-right: 1px solid #f2f2f2 !important;
            padding: 120px 50px !important;
        }

        /* 오른쪽 콘텐츠 영역 */
        .right { background: #ffffff !important; padding: 100px 0 !important; }
        .right-item { margin-bottom: 150px; text-align: left; padding: 0 80px; }

        /* 사진 그리드 레이아웃 */
        .img-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 30px; 
            width: 100%;
        }
        .img-grid img { 
            width: 100%; 
            height: 450px; 
            object-fit: cover; 
            filter: brightness(1) !important; /* 사진 어둡게 나오지 않도록 고정 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* 캡션 및 숫자 스타일 */
        .step-num { font-family: 'Playfair Display', serif; color: #eee; font-size: 60px; font-weight: 700; line-height: 1; margin-bottom: 20px; }
        .img-caption { font-size: 15px; color: #666; line-height: 2; border-left: 3px solid #111; padding-left: 20px; text-align: left; }
        .img-caption b { color: #111; display: block; font-size: 19px; margin-bottom: 10px; font-weight: 700; }

        /* 모바일 대응 (좌우 흔들림 방지 핵심) */
        @media (max-width: 1024px) {
            .container { flex-direction: column !important; }
            .left { position: relative !important; width: 100% !important; height: auto !important; padding: 100px 25px 40px !important; border-right: none !important; border-bottom: 1px solid #eee !important; }
            .right { width: 100% !important; margin-left: 0
