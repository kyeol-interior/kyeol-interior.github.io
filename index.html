<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>(주)결 | 전주 학교·관공서·사무실·상업공간·주거 전문 디자인.인테리어</title>
    <meta name="description" content="전주 인테리어 전문 (주)결. 공간의 밀도를 다시 쓰는 정교한 마감과 감각적인 디자인을 제안합니다.">
    <meta name="keywords" content="전주 인테리어, (주)결, 주식회사 결, 전주 사무실 인테리어, 전주 카페 인테리어, 전주 리모델링">

    <meta property="og:type" content="website">
    <meta property="og:title" content="(주)결  - 당신이 머무는 곳마다 기분 좋은 결이 흐르도록">
    <meta property="og:description" content="공간의 가치를 높이는 인테리어 디자인 & 건축 전문 기업 (주)결입니다.">
    <meta property="og:image" content="./image/main-thumb.jpg"> 
    <meta property="og:url" content="https://kyeol-interior.github.io">

    <meta name="naver-site-verification" content="naver2ed49a1b11963851e656e3963ca055a2">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; }

        /* [1] 상단 네비게이션: 메뉴 삭제 후 로고만 중앙 정렬되도록 구성 가능하지만, 
           기존 왼쪽 배치를 유지하며 높이를 충분히 주었습니다. */
        nav { 
            position:fixed; top:0; width:100%; height:200px; 
            display:flex; justify-content: flex-start; align-items:center; 
            padding:0 50px; background:transparent; z-index:1000; 
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            overflow: visible;
        }

        .logo-img {
            /* PC 로고 크기 150px */
            height: 150px; 
            width: auto;
            /* 흰색 강제 반전 + 시인성 극대화 */
            filter: brightness(0) invert(1) !important; 
            -webkit-filter: brightness(0) invert(1) !important; /* 아이폰/사파리용 */
            drop-shadow: 0px 0px 10px rgba(255,255,255,0.5);
            transition: 0.3s;
            object-fit: contain;
        }

        /* [2] 배경 영상 */
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }
        .video-background video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }

        /* [3] 메인 문구 */
        .main-content {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            color: #fff; padding: 0 20px; position: relative; z-index: 1;
        }
        .main-title { font-size: 56px; font-weight: 800; line-height: 1.2; margin-bottom: 25px; letter-spacing: -2px; word-break: keep-all; }
        .main-sub { font-size: 18px; font-weight: 300; letter-spacing: 5px; color: rgba(255,255,255,0.8); margin-bottom: 50px; }
        .enter-btn { padding: 15px 45px; border: 1px solid #fff; text-decoration: none; color: #fff; font-size: 13px; letter-spacing: 4px; transition: 0.4s; }
        .enter-btn:hover { background: #fff; color: #000; }

        /* 📱 모바일 설정 */
        @media (max-width: 1024px) {
            nav { padding: 0 25px; height: 160px; } 
            
            .logo-img { 
                /* 모바일 로고 크기 120px */
                height: 120px !important; 
                /* 모바일에서 절대적으로 흰색으로 보이게 조치 */
                filter: brightness(0) invert(1) !important;
                -webkit-filter: brightness(0) invert(1) !important;
                display: block !important;
            } 
            
            .main-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo-link">
            <img src="./image/image_1.png" alt="(주)결 로고" class="logo-img">
        </a>
        </nav>

    <div class="video-background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="./image/main_video.mp4" type="video/mp4">
        </video>
    </div>

    <div class="main-content">
        <h1 class="main-title">당신이 머무는 곳마다,<br>기분 좋은 결이 흐르도록.</h1>
        <p class="main-sub">INTERIOR DESIGN & ARCHITECTURE</p>
        <a href="about.html" class="enter-btn">ENTER VIEW</a>
    </div>

</body>
</html>
