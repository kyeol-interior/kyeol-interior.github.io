<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부분수리 + 전체인테리어 즉시 견적 | (주)결</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Noto Sans KR';
background:#0b0b0b;
color:#fff;
}

.hero{
padding:40px 20px;
text-align:center;
background:#111;
}

.hero h1{
font-size:22px;
font-weight:900;
}

.container{
max-width:650px;
margin:auto;
padding:20px;
}

/* PROBLEM GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.problem{
background:#1b1b1b;
padding:14px;
border-radius:10px;
cursor:pointer;
font-size:13px;
text-align:center;
border:1px solid transparent;
transition:0.2s;
}

.problem.active{
border:1px solid #d4af37;
background:#222;
}

/* CARD */
.card{
background:#151515;
padding:15px;
border-radius:12px;
margin-top:15px;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:10px;
border-radius:8px;
border:none;
background:#222;
color:#fff;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
font-weight:900;
border-radius:8px;
cursor:pointer;
}

.result{
display:none;
margin-top:15px;
padding:18px;
background:#1b1b1b;
border-left:4px solid #d4af37;
border-radius:10px;
}

.price{
font-size:20px;
font-weight:900;
color:#d4af37;
}

.fixed{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
}

.fixed a{
flex:1;
text-align:center;
padding:14px;
font-weight:900;
text-decoration:none;
}

.kakao{background:#fee500;color:#000;}
.call{background:#d4af37;color:#000;}

.small{
font-size:12px;
color:#aaa;
margin-top:8px;
line-height:1.4;
}
</style>
</head>

<body>

<div class="hero">
<h1>문제 선택 → 즉시 견적</h1>
<p style="color:#aaa;font-size:13px;">
부분수리 + 전체인테리어 모두 가능
</p>
</div>

<div class="container">

<!-- PROBLEM SELECT -->
<div class="card">
<h3>어떤 문제가 있나요?</h3>

<div class="grid">

<div class="problem" onclick="toggleProblem(this,'door')">문 / 방문 손상</div>
<div class="problem" onclick="toggleProblem(this,'silicone')">실리콘 곰팡이</div>
<div class="problem" onclick="toggleProblem(this,'wall')">벽지 오염</div>
<div class="problem" onclick="toggleProblem(this,'light')">조명 고장</div>
<div class="problem" onclick="toggleProblem(this,'window')">창문 틈 / 외풍</div>
<div class="problem" onclick="toggleProblem(this,'full')">전체 인테리어</div>

</div>

<p class="small">
선택된 문제는 자동으로 공사 항목으로 변환됩니다
</p>
</div>

<!-- INPUT -->
<div class="card">

<h3>추가 정보</h3>

<input id="name" placeholder="이름">
<input id="phone" placeholder="연락처">
<input id="addr" placeholder="주소 (아파트)">

<select id="size">
<option value="0">평수 선택 (전체공사 시)</option>
<option value="20">20평</option>
<option value="30">30평</option>
<option value="40">40평</option>
<option value="50">50평 이상</option>
</select>

<button onclick="calc()">즉시 견적 보기</button>

<p class="small">
※ 부분수리 + 전체공사 자동 비교 견적 제공
</p>

</div>

<!-- RESULT -->
<div class="result" id="result">
<div class="price" id="price"></div>
<div id="detail"></div>

<button style="margin-top:10px;" onclick="kakao()">카카오 상담</button>
</div>

</div>

<div class="fixed">
<a class="kakao" href="https://pf.kakao.com/_uxhhjX/chat">카카오 상담</a>
<a class="call" href="tel:01000000000">전화 상담</a>
</div>

<script>

let selected = {};
let last = 0;

/* 문제 선택 */
function toggleProblem(el,type){

el.classList.toggle("active");

if(el.classList.contains("active")){
selected[type]=1;
}else{
delete selected[type];
}
}

/* 견적 엔진 */
function calc(){

const name=document.getElementById('name').value;
const phone=document.getElementById('phone').value;
const addr=document.getElementById('addr').value;

if(!name || !phone || !addr){
alert("고객 정보 입력 필요");
return;
}

/* PARTIAL */
let partial = 0;

if(selected.door) partial += 120000;
if(selected.silicone) partial += 150000;
if(selected.wall) partial += 100000;
if(selected.light) partial += 80000;
if(selected.window) partial += 120000;

/* FULL */
let size = Number(document.getElementById('size').value);
let full = size > 0 ? size * 150000 : 0;

/* HYBRID LOGIC */
let recommend = partial;

if(full > 0){
recommend = Math.min(partial + full*0.2, full);
}

last = Math.round(recommend);

/* UI */
document.getElementById('result').style.display="block";

document.getElementById('price').innerHTML =
"예상 견적: " + last.toLocaleString() + " 원";

document.getElementById('detail').innerHTML =
"부분수리 기준 + 전체공사 비교 견적 포함";
}

function kakao(){
window.open("https://pf.kakao.com/_uxhhjX/chat?msg=견적:"+last);
}

</script>

</body>
</html>
