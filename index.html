<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주식회사 결 | 전주 인테리어·리모델링·실내건축 전문 (주)결</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; color: #fff; }

        /* 배경 영상 컨테이너 */
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #000;
        }
        .video-mobile, .video-pc { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .video-pc { display: none; }
        @media (min-width: 1025px) { .video-mobile { display: none; } .video-pc { display: block; } }
        .video-background::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); }

        /* 로고 영역 (상단 왼쪽 재배치) */
        nav { 
            position:fixed; top:0; width:100%; height:160px; 
            display:flex; justify-content: flex-start; align-items:center; 
            padding:0 60px; background:transparent; z-index:1000; 
        }
        .logo-img { height: 120px; width: auto; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15)); }

        /* 메인 콘텐츠 레이아웃 */
        main {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px; position: relative; z-index: 1;
        }

        .main-title { 
            font-size: 52px; font-weight: 800; line-height: 1.3; 
            margin-bottom: 15px; letter-spacing: -1.5px; word-break: keep-all; 
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .main-sub { 
            font-size: 15px; font-weight: 300; letter-spacing: 0.4em; 
            color: rgba(255,255,255,0.7); margin-bottom: 55px; 
        }

        /* 버튼 그룹 */
        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }

        .enter-btn { 
            padding: 15px 60px; border: 1px solid rgba(255,255,255,0.8); 
            text-decoration: none; color: #fff; font-size: 13px; 
            letter-spacing: 4px; transition: 0.4s; 
            background: rgba(0,0,0,0.2); backdrop-filter: blur(5px);
        }
        .enter-btn:hover { background: #fff; color: #000; font-weight: bold; }

        /* LIVE REPORT 버튼 */
        .live-btn { 
            padding: 13px 40px; border: 1px solid #d4af37; 
            text-decoration: none; color: #d4af37; font-size: 12px; 
            letter-spacing: 2px; transition: 0.4s; font-weight: 700;
            background: rgba(212, 175, 55, 0.1); border-radius: 4px;
            width: 240px;
        }
        .live-btn:hover { background: #d4af37; color: #000; }

        /* 하단 메뉴 */
        .side-menu { position: fixed; width: 100%; bottom: 55px; text-align: center; z-index: 1000; }
        .side-menu a { 
            display: inline-block; margin: 0 20px; font-size: 14px; 
            color: rgba(255,255,255,0.6); text-decoration: none; 
            letter-spacing: 1.5px; transition: 0.3s; font-weight: 500;
        }
        .side-menu a:hover { color: #fff; }

        footer { position: fixed; bottom: 25px; width: 100%; text-align: center; z-index: 900; }
        .copyright { font-size: 10px; color: rgba(255, 255, 255, 0.2); }

        /* 모바일 반응형 최적화 */
        @media (max-width: 1024px) {
            nav { padding: 0 25px; height: 110px; justify-content: flex-start; } /* 모바일 왼쪽 유지 */
            .logo-img { height: 75px !important; } 
            .main-title { font-size: 28px; margin-bottom: 10px; }
            .main-sub { font-size: 12px; margin-bottom: 35px; letter-spacing: 0.2em; }
            
            .enter-btn { padding: 14px 0; width: 220px; font-size: 12px; }
            .live-btn { padding: 12px 0; width: 220px; font-size: 11px; }
            
            .side-menu { bottom: 75px; }
            .side-menu a { font-size: 14px; margin: 0 12px; } 
            footer { bottom: 30px; }
        }
    </style>
</head>
<body>

</body>
</html>
