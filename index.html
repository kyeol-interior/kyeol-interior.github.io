<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>(주)결 | 전주 학교·관공서·사무실·상업공간·주거 전문 디자인.인테리어</title>
    <meta name="description" content="전주 인테리어 전문 (주)결. 공간의 밀도를 다시 쓰는 정교한 마감과 감각적인 디자인을 제안합니다.">
    <meta name="keywords" content="전주 인테리어, (주)결, 주식회사 결, 전주 사무실 인테리어, 전주 카페 인테리어, 전주 리모델링">

    <meta property="og:type" content="website">
    <meta property="og:title" content="(주)결  - 당신이 머무는 곳마다 기분 좋은 결이 흐르도록">
    <meta property="og:description" content="공간의 가치를 높이는 인테리어 디자인 & 건축 전문 기업 (주)결입니다.">
    <meta property="og:image" content="./image/main-thumb.jpg"> <meta property="og:url" content="https://kyeol-interior.github.io">

    <meta name="naver-site-verification" content="naver2ed49a1b11963851e656e3963ca055a2">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; }

        /* [1] 상단 네비게이션: PC에서는 메뉴가 다 보임 */
        nav { 
            position:fixed; top:0; width:100%; height:100px; /* 로고 영역 확장을 위해 높이 약간 조정 */
            display:flex; justify-content:space-between; align-items:center; 
            padding:0 50px; background:transparent; z-index:1000; 
        }

        /* --- 로고 관련 신규 및 수정 CSS --- */
        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            gap: 15px; /* 이미지와 텍스트 사이 간격 */
        }
        .logo-img {
            height: 40px; /* 로고 이미지 높이 조정 (적절히 조절하세요) */
            width: auto;
            /* darker blue line 로고(image_1.png)를 어두운 배경에 맞게 밝게 조정 (옵션) */
            filter: brightness(0) invert(1); /* 이미지가 어두우면 켜서 흰색으로 만듭니다. */
        }
        .logo-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .logo-text-ko {
            font-size: 18px; /* 국문 로고 크기 */
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .logo-text-en {
            font-size: 11px; /* 영문 로고 크기 */
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0.8; /* 영문은 살짝 투명하게 */
        }
        /* --- 로고 관련 신규 및 수정 CSS 끝 --- */
        
        .nav-links { display:flex; gap:35px; }
        .nav-links a { text-decoration:none; color:rgba(255,255,255,0.7); font-size:13px; letter-spacing:2px; transition: 0.3s; }
        .nav-links a:hover { color:#fff; }

        /* [2] 모바일용 햄버거 (기본은 숨김) */
        .menu-btn { display: none; cursor: pointer; flex-direction: column; gap: 6px; z-index: 1002; }
        .menu-btn span { width: 22px; height: 2px; background: #fff; }

        .mobile-nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: #fff; display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1100;
        }
        .mobile-nav a { padding: 20px; text-decoration: none; color: #111; font-size: 24px; font-weight: 700; }

        /* [3] 배경 영상 */
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }
        .video-background video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }

        /* [4] 메인 문구 */
        .main-content {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            color: #fff; padding: 0 20px; position: relative; z-index: 1;
        }
        .main-title { font-size: 56px; font-weight: 800; line-height: 1.2; margin-bottom: 25px; letter-spacing: -2px; word-break: keep-all; }
        .main-sub { font-size: 18px; font-weight: 300; letter-spacing: 5px; color: rgba(255,255,255,0.8); margin-bottom: 50px; }
        .enter-btn { padding: 15px 45px; border: 1px solid #fff; text-decoration: none; color: #fff; font-size: 13px; letter-spacing: 4px; transition: 0.4s; }
        .enter-btn:hover { background: #fff; color: #000; }

        /* 📱 모바일 설정 (이때만 햄버거 등장) */
        @media (max-width: 1024px) {
            nav { padding: 0 25px; height: 70px; }
            .logo-img { height: 30px; } /* 모바일에서 로고 크기 축소 */
            .logo-text-ko { font-size: 16px; }
            .logo-text-en { font-size: 10px; }
            .nav-links { display: none; } /* PC 메뉴 숨김 */
            .menu-btn { display: flex; }    /* 햄버거 버튼 등장 */
            .main-title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo-container">
            <img src="./image/image_1.png" alt="(주)결 로고" class="logo-img">
            <div class="logo-text-group">
                <span class="logo-text-ko">주식회사 결</span>
                <span class="logo-text-en">KYEOL Co., Ltd.</span>
            </div>
        </a>

        <div class="nav-links">
            <a href="about.html">ABOUT</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="proposal.html">PROPOSAL</a>
            <a href="contact.html">CONTACT</a>
        </div>
        <div class="menu-btn" id="menuToggle"><span></span><span></span><span></span></div>
    </nav>

    <div class="mobile-nav" id="dropdown">
        <a href="about.html">ABOUT</a>
        <a href="portfolio.html">PORTFOLIO</a>
        <a href="proposal.html">PROPOSAL</a>
        <a href="contact.html">CONTACT</a>
    </div>

    <div class="video-background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="./image/main_video.mp4" type="video/mp4">
        </video>
    </div>

    <div class="main-content">
        <h1 class="main-title">당신이 머무는 곳마다,<br>기분 좋은 결이 흐르도록.</h1>
        <p class="main-sub">INTERIOR DESIGN & ARCHITECTURE</p>
        <a href="about.html" class="enter-btn">ENTER VIEW</a>
    </div>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('dropdown');
        menuToggle.onclick = function(e) {
            e.stopPropagation();
            dropdown.style.display = (dropdown.style.display === 'flex') ? 'none' : 'flex';
        };
        window.onclick = function() { dropdown.style.display = 'none'; }
    </script>
</body>
</html>
