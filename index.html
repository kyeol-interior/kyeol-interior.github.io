<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부분공사 견적 | 방문·화장실·필름 즉시 견적</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Noto Sans KR';
background:#0b0b0b;
color:#fff;
}

.hero{
padding:50px 20px;
text-align:center;
background:#111;
}

.hero h1{
font-size:24px;
font-weight:900;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

.card{
background:#151515;
padding:18px;
border-radius:12px;
margin-top:15px;
}

select,input{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:10px;
border-radius:8px;
border:none;
background:#222;
color:#fff;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
font-weight:900;
border-radius:8px;
cursor:pointer;
}

.result{
display:none;
margin-top:15px;
padding:18px;
background:#1b1b1b;
border-left:4px solid #d4af37;
border-radius:10px;
}

.price{
font-size:22px;
font-weight:900;
color:#d4af37;
}

.fixed{
position:fixed;
bottom:0;
width:100%;
display:flex;
}

.fixed a{
flex:1;
text-align:center;
padding:14px;
font-weight:900;
text-decoration:none;
}

.kakao{background:#fee500;color:#000;}
.call{background:#d4af37;color:#000;}
</style>
</head>

<body>

<div class="hero">
<h1>부분공사 즉시 견적</h1>
<p style="color:#aaa;font-size:13px;">
방문 / 화장실 / 싱크대 / 실리콘 / 필름
</p>
</div>

<div class="container">

<!-- 작업 선택 -->
<div class="card">
<h3>공사 선택</h3>

<select id="job" onchange="setUnit()">
<option value="door">방문 필름 시공</option>
<option value="bath">화장실 1칸</option>
<option value="sink">싱크대 실리콘</option>
<option value="film">창호/유리 필름</option>
<option value="silicone">전체 실리콘 보수</option>
</select>

<div id="unitBox"></div>
</div>

<!-- 고객 정보 -->
<div class="card">
<h3>연락 정보</h3>

<input id="name" placeholder="이름">
<input id="phone" placeholder="연락처">
<input id="addr" placeholder="주소 (아파트)">

<button onclick="calc()">즉시 견적 보기</button>

<p style="font-size:12px;color:#777;text-align:center;">
※ 상담 목적 외 사용되지 않습니다
</p>
</div>

<!-- 결과 -->
<div class="result" id="result">
<div class="price" id="price"></div>
<div style="margin-top:10px;">
현장 기준 평균 견적입니다.
</div>

<button style="margin-top:12px;" onclick="kakao()">카카오 상담</button>
</div>

</div>

<div class="fixed">
<a class="kakao" href="https://pf.kakao.com/_uxhhjX/chat">카카오</a>
<a class="call" href="tel:01000000000">전화</a>
</div>

<script>

let unit=1;
let last=0;

function setUnit(){
const job=document.getElementById('job').value;

let html="";

switch(job){
case "door": unit=4; html="방문 1개 기준"; break;
case "bath": unit=120; html="화장실 1칸 기준"; break;
case "sink": unit=3; html="싱크대 1m 기준"; break;
case "film": unit=2; html="창호 1㎡ 기준"; break;
case "silicone": unit=1.5; html="1m 기준"; break;
}

document.getElementById('unitBox').innerHTML=
`<p style="color:#aaa;font-size:13px;">${html}</p>`;
}

function calc(){

const name=document.getElementById('name').value;
const phone=document.getElementById('phone').value;
const addr=document.getElementById('addr').value;

if(!name||!phone||!addr){
alert("정보 입력 필요");
return;
}

const job=document.getElementById('job').value;

// 수량 (단순화)
let qty=1;

let price=qty*unit*10000;

// 심리 보정
price*=1.1;

last=Math.round(price);

document.getElementById('result').style.display="block";
document.getElementById('price').innerHTML=
"예상 견적: "+last.toLocaleString()+"원";
}

function kakao(){
window.open("https://pf.kakao.com/_uxhhjX/chat?msg=부분공사:"+last);
}

setUnit();

</script>

</body>
</html>
