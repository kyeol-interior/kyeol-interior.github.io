<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주식회사 결 | 전주 인테리어·리모델링·실내건축 전문 (주)결</title>
    <meta name="description" content="상업공간의 성공과 주거의 품격, 전주 인테리어 전문 디자인 기업 (주)결입니다.">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; min-height: 100vh; color: #fff; }
        .video-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000 center center / cover no-repeat; }
        .video-mobile, .video-pc { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .video-pc { display: none; }
        @media (min-width: 1025px) { .video-mobile { display: none; } .video-pc { display: block; } }
        .video-background::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); }
        nav { position:fixed; top:0; width:100%; height:140px; display:flex; justify-content: flex-start; align-items:center; padding:0 60px; z-index:1000; }
        .logo-img { height: 100px; width: auto; }
        main { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .main-title { font-size: clamp(24px, 5vw, 52px); font-weight: 800; margin-bottom: 20px; }
        .btn-group { display: flex; flex-direction: column; gap: 18px; align-items: center; }
        .btn-base { text-decoration: none; padding: 16px 70px; border: 1px solid rgba(255,255,255,0.8); color: #fff; font-size: 13px; letter-spacing: 4px; transition: 0.4s; }
        .btn-base:hover { background: #fff; color: #000; }
        .admin-link { color: rgba(255, 255, 255, 0.15); cursor: pointer; text-decoration: none; font-size: 10px; }
        #loginOverlay, #adminAppContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 9999; }
        #loginOverlay { background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .login-box { background: white; padding: 35px; border-radius: 12px; width: 340px; color: #2d3748; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; text-align: center; font-size: 20px; font-weight: bold; }
        #adminAppContainer { background: #f7fafc; overflow-y: auto; color: #2d3748; padding: 20px; }
        .calc-container { max-width: 630px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; }
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-button { flex: 1; padding: 11px; cursor: pointer; text-align: center; font-weight: bold; color: #718096; }
        .tab-button.active { color: #2b6cb0; border-bottom: 3px solid #2b6cb0; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .calc-btn { width: 100%; padding: 12px; background: #1a365d; color: white; border: none; cursor: pointer; font-weight: bold; }
        .result-card { border: 1px solid #e2e8f0; padding: 12px; margin-bottom: 10px; border-left: 5px solid #2b6cb0; }
    </style>
</head>
<body>
    <nav><img src="./image/image_1.png" alt="로고" class="logo-img"></nav>
    <div class="video-background"></div>
    <main>
        <h1 class="main-title">상업공간의 성공과 주거의 품격,<br>결이 다른 공간을 만듭니다.</h1>
        <div class="btn-group">
            <a href="about.html" class="btn-base">ENTER VIEW</a>
            <a href="live-report.html" class="btn-base" style="border-color:#d4af37; color:#d4af37;">LIVE 현장 리포트</a>
        </div>
        <p style="margin-top:50px;"><span class="admin-link" onclick="openLoginModal()">ADMIN</span></p>
    </main>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>보안 인증</h2>
            <input type="password" id="passInput">
            <button class="calc-btn" onclick="checkPassword()">인증하기</button>
        </div>
    </div>

    <div id="adminAppContainer">
        <div class="calc-container">
            <button onclick="exitAdminSystem()">나가기</button>
            <h1>(주)결 입찰 확률 계산기</h1>
            <div class="tabs">
                <div class="tab-button active" onclick="switchTab('predictTab', this)">🎯 투찰 예측</div>
                <div class="tab-button" onclick="switchTab('dbTab', this)">📊 데이터 등록</div>
            </div>
            <div id="predictTab" class="tab-content active">
                <select id="institution"><option value="edu">교육청</option><option value="local">관공서</option></select>
                <input type="number" id="gicho" placeholder="기초금액">
                <button class="calc-btn" onclick="calculateBid()">산출</button>
                <div id="resultsContainer"></div>
            </div>
            <div id="dbTab" class="tab-content">
                <input type="text" id="newBidNo" placeholder="공고번호">
                <input type="number" id="newGicho" placeholder="기초">
                <input type="number" id="newResult" placeholder="낙찰">
                <button class="calc-btn" onclick="uploadToCloud()">등록</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://kyeol-bid-default-rtdb.firebaseio.com/" };
        let dbCounts = { edu: { c1: 34, c2: 12, c3: 18, cOther: 16 }, local: { c1: 30, c2: 15, c3: 20, cOther: 15 } };
        let samplePool = { edu: [], local: [] };
        let checkedLogs = {};

        function openLoginModal() { document.getElementById('loginOverlay').style.display = 'flex'; }
        function checkPassword() { if(document.getElementById('passInput').value === "6452") { document.getElementById('loginOverlay').style.display='none'; document.getElementById('adminAppContainer').style.display='block'; initFirebase(); } }
        function exitAdminSystem() { document.getElementById('adminAppContainer').style.display='none'; }
        function switchTab(id, el) { 
            document.querySelectorAll('.tab-content').forEach(c => c.style.display='none');
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(id).style.display='block'; el.classList.add('active'); 
        }

        function initFirebase() {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            firebase.database().ref('bidMaster').on('value', (s) => {
                const data = s.val();
                if(data) { dbCounts = data.dbCounts; samplePool = data.samplePool; checkedLogs = data.checkedLogs || {}; }
            });
        }

        function uploadToCloud() {
            const bidNo = document.getElementById('newBidNo').value;
            if(checkedLogs[bidNo]) { alert('이미 등록된 공고입니다.'); return; }
            // 계산 로직...
            firebase.database().ref('bidMaster').set({ dbCounts, samplePool, checkedLogs }).then(() => alert('완료'));
        }

        function calculateBid() { /* 계산 로직 */ }
    </script>
</body>
</html>
