<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>(주)결 | 전주 인테리어 전문 디자인</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="(주)결 | KYEOL DESIGN">
    <meta property="og:description" content="전주 인테리어·건축 전문 디자인 기업 (주)결">
    <meta property="og:image" content="./image/main-thumb.jpg"> 
    <meta property="og:url" content="https://kyeol-interior.github.io">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; }

        /* [1] 상단 네비게이션 - 로고 위치 최적화 */
        nav { 
            position:fixed; top:0; width:100%; height:180px; 
            display:flex; justify-content: flex-start; align-items:center; 
            padding:0 50px; background:transparent; z-index:1000; 
        }
        .logo-img {
            height: 140px; 
            width: auto;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
        }

        /* [2] 배경 영상 - 원본 구조 유지 */
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }
        .video-background video { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: brightness(0.4); 
        }

        /* [3] 메인 문구 */
        .main-content {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            color: #fff; padding: 0 20px; position: relative; z-index: 1;
        }
        .main-title { font-size: 54px; font-weight: 800; line-height: 1.3; margin-bottom: 20px; letter-spacing: -1.5px; word-break: keep-all; }
        .main-sub { font-size: 16px; font-weight: 300; letter-spacing: 0.4em; color: rgba(255,255,255,0.7); margin-bottom: 50px; }
        
        .enter-btn { 
            padding: 16px 50px; border: 1px solid rgba(255,255,255,0.8); text-decoration: none; 
            color: #fff; font-size: 12px; letter-spacing: 4px; transition: 0.4s; 
            background: rgba(0,0,0,0.1); backdrop-filter: blur(5px);
        }
        .enter-btn:hover { background: #fff; color: #000; }

        /* [4] 하단 메뉴 (PC 화면 왼쪽 하단) */
        .side-menu {
            position: fixed; left: 50px; bottom: 40px; z-index: 1000;
        }
        .side-menu a {
            display: inline-block; margin-right: 25px; font-size: 10px;
            color: rgba(255,255,255,0.5); text-decoration: none;
            letter-spacing: 1.5px; transition: 0.3s;
        }
        .side-menu a:hover { color: #fff; }

        /* [5] 하단 카피라이트 */
        footer {
            position: fixed; bottom: 30px; width: 100%;
            text-align: center; z-index: 900;
        }
        .copyright {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        /* 📱 모바일 설정 - 2번 캡처 이미지 반영 */
        @media (max-width: 1024px) {
            nav { padding: 0 30px; height: 140px; } 
            .logo-img { height: 100px !important; } 
            .main-title { font-size: 32px; margin-bottom: 15px; }
            .main-sub { font-size: 14px; margin-bottom: 40px; }
            .side-menu { left: 0; width: 100%; text-align: center; bottom: 80px; }
            .side-menu a { margin: 0 15px; font-size: 9px; }
            footer { bottom: 30px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">
            <img src="./image/image_1.png" alt="(주)결 로고" class="logo-img">
        </a>
    </nav>

    <div class="video-background">
        <video autoplay muted loop playsinline preload="auto">
            <source src="./image/main_video.mp4" type="video/mp4">
        </video>
    </div>

    <div class="main-content">
        <h1 class="main-title">당신이 머무는 곳마다,<br>기분 좋은 결이 흐르도록.</h1>
        <p class="main-sub">INTERIOR DESIGN & ARCHITECTURE</p>
        <a href="about.html" class="enter-btn">ENTER VIEW</a>
    </div>

    <div class="side-menu">
        <a href="http://blog.naver.com/rotte123" target="_blank">NAVER BLOG</a>
        <a href="https://pf.kakao.com/_bTIEX/friend" target="_blank">KAKAO TALK</a>
    </div>

    <footer>
        <p class="copyright">© 2026 KYEOL. All rights reserved.</p>
    </footer>
</body>
</html>
