<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>주식회사 결 | 전주 인테리어·리모델링·실내건축 전문 (주)결</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; color: #fff; }

        /* 배경 영상 컨테이너 */
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #000;
        }
        .video-mobile, .video-pc { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .video-pc { display: none; }
        @media (min-width: 1025px) { .video-mobile { display: none; } .video-pc { display: block; } }
        .video-background::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); }

        /* 메인 콘텐츠 레이아웃 */
        main {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px; position: relative; z-index: 1;
        }

        /* 1. 로고 위치 및 크기 수정 (중앙 상단) */
        .logo-area { margin-bottom: 30px; }
        .logo-img { height: 160px; width: auto; filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2)); }

        .main-title { 
            font-size: 54px; font-weight: 800; line-height: 1.3; 
            margin-bottom: 15px; letter-spacing: -1.5px; word-break: keep-all; 
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .main-sub { 
            font-size: 16px; font-weight: 300; letter-spacing: 0.4em; 
            color: rgba(255,255,255,0.7); margin-bottom: 60px; 
        }

        /* 버튼 컨테이너 */
        .btn-group { display: flex; flex-direction: column; gap: 20px; align-items: center; }

        /* 기본 ENTER VIEW 버튼 */
        .enter-btn { 
            padding: 16px 60px; border: 1px solid rgba(255,255,255,0.8); 
            text-decoration: none; color: #fff; font-size: 14px; 
            letter-spacing: 4px; transition: 0.4s; 
            background: rgba(0,0,0,0.2); backdrop-filter: blur(5px);
        }
        .enter-btn:hover { background: #fff; color: #000; font-weight: bold; }

        /* 2. LIVE REPORT 독립 버튼 (ENTER VIEW 아래) */
        .live-btn { 
            padding: 14px 40px; border: 1px solid #d4af37; 
            text-decoration: none; color: #d4af37; font-size: 13px; 
            letter-spacing: 2px; transition: 0.4s; font-weight: 700;
            background: rgba(212, 175, 55, 0.1); border-radius: 4px;
        }
        .live-btn:hover { background: #d4af37; color: #000; }

        /* 3. 하단 메뉴 크기 키우기 */
        .side-menu { position: fixed; width: 100%; bottom: 60px; text-align: center; z-index: 1000; }
        .side-menu a { 
            display: inline-block; margin: 0 20px; font-size: 14px; 
            color: rgba(255,255,255,0.6); text-decoration: none; 
            letter-spacing: 2px; transition: 0.3s; font-weight: 500;
        }
        .side-menu a:hover { color: #fff; }

        footer { position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 900; }
        .copyright { font-size: 11px; color: rgba(255, 255, 255, 0.3); }

        /* 모바일 반응형 최적화 */
        @media (max-width: 1024px) {
            .logo-img { height: 120px; }
            .main-title { font-size: 32px; }
            .main-sub { font-size: 13px; margin-bottom: 40px; }
            .enter-btn { padding: 15px 50px; width: 240px; }
            .live-btn { width: 240px; font-size: 12px; }
            
            .side-menu { bottom: 80px; }
            .side-menu a { font-size: 15px; margin: 0 15px; } /* 모바일에서 더 크게 */
            footer { bottom: 35px; }
        }
    </style>
</head>
<body>

    <div class="video-background">
        <video class="video-mobile" autoplay muted loop playsinline preload="auto" poster="./image/main-thumb.jpg">
            <source src="./image/mobile-video.mp4" type="video/mp4">
        </video>
        <video class="video-pc" autoplay muted loop playsinline preload="auto" poster="./image/main-thumb.jpg">
            <source src="./image/pc-video.mp4" type="video/mp4">
        </video>
    </div>

    <main>
        <div class="logo-area">
            <img src="./image/image_1.png" alt="(주)결 로고" class="logo-img">
        </div>

        <h1 class="main-title">상업공간의 성공과 주거의 품격,<br>결이 다른 공간을 만듭니다.</h1>
        <p class="main-sub">INTERIOR DESIGN & ARCHITECTURE (주)결</p>
        
        <div class="btn-group">
            <a href="about.html" class="enter-btn">ENTER VIEW</a>
            <a href="live-report.html" class="live-btn">LIVE 현장 리포트 바로가기</a>
        </div>
    </main>

    <aside class="side-menu">
        <a href="http://blog.naver.com/rotte123" target="_blank" rel="noopener noreferrer">NAVER BLOG</a>
        <a href="https://pf.kakao.com/_uxhhjX/chat" target="_blank" rel="noopener noreferrer">KAKAO TALK</a>
    </aside>

    <footer>
        <p class="copyright">© 2026 (주)결 KYEOL Co., Ltd. All rights reserved.</p>
    </footer>

</body>
</html>
