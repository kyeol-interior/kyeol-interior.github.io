<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(주)결 | 인테리어 견적 계산기</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Noto Sans KR';
    background:#0a0a0a;
    color:#fff;
}

header {
    text-align:center;
    padding:40px 20px 10px;
}

h1 {
    font-size:24px;
}

.container {
    max-width:600px;
    margin:0 auto;
    padding:20px;
}

.card {
    background:#111;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

label {
    display:block;
    margin-bottom:6px;
    font-size:13px;
    color:#aaa;
}

input, select, textarea {
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin-bottom:12px;
}

button {
    width:100%;
    padding:14px;
    background:#d4af37;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

button:hover {
    background:#fff;
    color:#000;
}

.result {
    display:none;
    background:#1a1a1a;
    padding:20px;
    border-radius:10px;
    margin-top:15px;
}

.lock {
    text-align:center;
    font-size:14px;
    color:#aaa;
    margin-top:10px;
}

</style>
</head>

<body>

<header>
    <h1>전주 인테리어 견적 계산기</h1>
    <p style="color:#aaa;font-size:13px;">(주)결 KYEOL DESIGN</p>
</header>

<div class="container">

    <!-- 입력 -->
    <div class="card">
        <label>공사 유형</label>
        <select id="type">
            <option value="res">주거 인테리어</option>
            <option value="com">상업 인테리어</option>
        </select>

        <label>평수</label>
        <input type="number" id="size" placeholder="예: 30">

        <label>예산 기준 (만원)</label>
        <input type="number" id="budget" placeholder="예: 3000">
    </div>

    <!-- 고객 정보 (필수) -->
    <div class="card">
        <label>이름</label>
        <input type="text" id="name">

        <label>연락처</label>
        <input type="text" id="phone">

        <label>주소 (아파트/지역)</label>
        <input type="text" id="address">

        <label>요청사항</label>
        <textarea id="msg" placeholder="간단한 요청 내용을 입력해주세요"></textarea>

        <button onclick="calculate()">견적 확인하기</button>

        <div class="lock">※ 입력 완료 후 결과 확인 가능합니다</div>
    </div>

    <!-- 결과 -->
    <div class="result" id="resultBox">
        <h3>예상 견적 결과</h3>
        <p id="resultText"></p>
    </div>

</div>

<script>

function calculate() {

    // 고객정보 검증
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();

    if(!name || !phone || !address) {
        alert("이름 / 연락처 / 주소는 필수 입력입니다.");
        return;
    }

    // 계산 입력값
    const type = document.getElementById('type').value;
    const size = Number(document.getElementById('size').value);
    const budget = Number(document.getElementById('budget').value);

    if(!size || !budget) {
        alert("평수와 예산을 입력해주세요.");
        return;
    }

    // 기본 단가 로직
    let base = (type === "res") ? 120 : 180;

    let estimate = size * base;

    // 예산 반영 보정
    if(budget > estimate) estimate *= 1.05;
    else estimate *= 0.95;

    // 결과 출력
    document.getElementById('resultBox').style.display = 'block';

    document.getElementById('resultText').innerHTML = `
        예상 금액: <b>${Math.round(estimate).toLocaleString()}만원</b><br><br>
        입력하신 정보 기반으로 산출된 참고 견적입니다.<br>
        담당자가 확인 후 상세 견적을 안내드립니다.
    `;

    // 실제 운영용이면 여기서 DB / 카카오 전송 연결 가능
    console.log({
        name, phone, address,
        type, size, budget,
        estimate
    });
}

</script>

</body>
</html>
