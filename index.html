<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>전주 인테리어 무료 견적 | 30초 비용 계산 (주)결</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Noto Sans KR';
background:#0b0b0b;
color:#fff;
}

.hero{
padding:70px 20px;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
url('./image/main-thumb.jpg') center/cover;
}

.hero h1{
font-size:30px;
font-weight:900;
line-height:1.3;
}

.badge{
display:inline-block;
padding:6px 12px;
background:#d4af37;
color:#000;
font-size:12px;
font-weight:800;
border-radius:20px;
margin-bottom:15px;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

.card{
background:#151515;
padding:18px;
border-radius:12px;
margin-top:15px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:12px;
border-radius:8px;
border:none;
background:#222;
color:#fff;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
font-weight:900;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#fff;
color:#000;
}

/* RESULT LOCK */
.result{
display:none;
background:#1b1b1b;
padding:18px;
border-left:4px solid #d4af37;
border-radius:10px;
margin-top:15px;
}

.price{
font-size:22px;
font-weight:900;
color:#d4af37;
}

/* SOCIAL PROOF */
.info{
font-size:13px;
color:#aaa;
margin-top:10px;
line-height:1.6;
}

.fixed{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
}

.fixed a{
flex:1;
text-align:center;
padding:14px;
font-weight:900;
text-decoration:none;
}

.kakao{background:#fee500;color:#000;}
.call{background:#d4af37;color:#000;}

</style>
</head>

<body>

<div class="hero">
<div class="badge">전주 인테리어 실제 견적 기반</div>
<h1>30초 만에<br>우리 집 인테리어 비용 확인</h1>
<p style="color:#bbb;font-size:13px;">
평당 단가 기반 자동 계산 시스템
</p>
</div>

<div class="container">

<!-- FORM -->
<div class="card">

<h3>기본 정보 입력</h3>

<label>공사 유형</label>
<select id="type">
<option value="res">아파트 / 주거</option>
<option value="com">상업공간</option>
</select>

<label>평수</label>
<input type="number" id="size" placeholder="예: 32">

<label>예산 (선택)</label>
<input type="number" id="budget" placeholder="예: 3000">

</div>

<!-- LEAD LOCK -->
<div class="card">

<h3>결과 확인을 위해 정보 입력</h3>

<label>이름</label>
<input type="text" id="name">

<label>연락처</label>
<input type="text" id="phone">

<label>주소 (아파트)</label>
<input type="text" id="address">

<button onclick="calc()">무료 견적 확인</button>

<p class="info">
※ 입력된 정보는 상담 목적 외 사용되지 않습니다<br>
※ 평균 고객 견적: 2,000~6,500만원
</p>

</div>

<!-- RESULT -->
<div class="result" id="result">
<div class="price" id="price"></div>
<div style="margin-top:10px;">
담당자가 상세 견적 및 공정별 금액을 안내드립니다.
</div>

<button style="margin-top:12px;" onclick="goKakao()">카카오 상담 바로가기</button>
</div>

</div>

<!-- FIXED CTA -->
<div class="fixed">
<a class="kakao" href="https://pf.kakao.com/_uxhhjX/chat">카카오 상담</a>
<a class="call" href="tel:01000000000">전화 상담</a>
</div>

<script>

let last=0;

function calc(){

const name=document.getElementById('name').value;
const phone=document.getElementById('phone').value;
const address=document.getElementById('address').value;

if(!name||!phone||!address){
alert("정보 입력 후 확인 가능합니다");
return;
}

const type=document.getElementById('type').value;
const size=Number(document.getElementById('size').value);
const budget=Number(document.getElementById('budget').value);

if(!size){
alert("평수를 입력해주세요");
return;
}

// 🔥 광고 최적화 단가 구조
let base = (type==="res")?140:220;

let price = size * base;

// 심리 보정 (핵심 전환 장치)
if(budget>0){
price = budget>price ? price*1.08 : price*0.92;
}

last=Math.round(price);

document.getElementById('result').style.display="block";
document.getElementById('price').innerHTML=
"예상 견적: "+last.toLocaleString()+" 만원";
}

function goKakao(){
window.open("https://pf.kakao.com/_uxhhjX/chat?msg=견적문의:"+last);
}

</script>

</body>
</html>
