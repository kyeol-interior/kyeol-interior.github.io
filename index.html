<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부분공사 즉시 견적 | 필름 · 실리콘 · 보수공사</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Noto Sans KR';
background:#0b0b0b;
color:#fff;
}

header{
text-align:center;
padding:30px 15px;
background:#111;
}

header h1{
font-size:22px;
font-weight:900;
}

.container{
max-width:650px;
margin:auto;
padding:20px;
}

/* ACCORDION */
.section{
background:#151515;
margin-top:12px;
border-radius:12px;
overflow:hidden;
}

.section-title{
padding:14px;
cursor:pointer;
font-weight:800;
background:#1c1c1c;
display:flex;
justify-content:space-between;
align-items:center;
}

.section-content{
display:none;
padding:15px;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
font-size:14px;
color:#ddd;
}

.item input{
width:70px;
padding:6px;
border-radius:6px;
border:none;
background:#222;
color:#fff;
text-align:center;
}

/* CUSTOMER */
.card{
background:#151515;
padding:15px;
border-radius:12px;
margin-top:15px;
}

input,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:10px;
border-radius:8px;
border:none;
background:#222;
color:#fff;
}

button{
width:100%;
padding:14px;
background:#d4af37;
border:none;
font-weight:900;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#fff;
color:#000;
}

/* RESULT */
.result{
display:none;
margin-top:15px;
padding:18px;
background:#1b1b1b;
border-left:4px solid #d4af37;
border-radius:10px;
}

.price{
font-size:22px;
font-weight:900;
color:#d4af37;
}

/* FIXED CTA */
.fixed{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
}

.fixed a{
flex:1;
text-align:center;
padding:14px;
font-weight:900;
text-decoration:none;
}

.kakao{background:#fee500;color:#000;}
.call{background:#d4af37;color:#000;}
</style>
</head>

<body>

<header>
<h1>부분공사 즉시 견적 시스템</h1>
<p style="color:#aaa;font-size:13px;">필름 · 실리콘 · 도배 · 보수 · 전기</p>
</header>

<div class="container">

<!-- 1. 필름 -->
<div class="section">
<div class="section-title" onclick="toggle(this)">
📌 필름 공사 <span>▼</span>
</div>
<div class="section-content">

<div class="item">도어 필름 <input id="door_film" type="number" value="0"></div>
<div class="item">방화문 필름 <input id="fire_door_film" type="number" value="0"></div>
<div class="item">샷시 필름 <input id="window_film" type="number" value="0"></div>
<div class="item">가구 필름 <input id="furniture_film" type="number" value="0"></div>

</div>
</div>

<!-- 2. 실리콘 -->
<div class="section">
<div class="section-title" onclick="toggle(this)">
💧 실리콘 공사 <span>▼</span>
</div>
<div class="section-content">

<div class="item">화장실 <input id="bathroom" type="number" value="0"></div>
<div class="item">주방 <input id="kitchen" type="number" value="0"></div>
<div class="item">창호 <input id="window_silicone" type="number" value="0"></div>

</div>
</div>

<!-- 3. 도배/바닥 -->
<div class="section">
<div class="section-title" onclick="toggle(this)">
🧱 마감 보수 <span>▼</span>
</div>
<div class="section-content">

<div class="item">벽면 도배 <input id="wallpaper" type="number" value="0"></div>
<div class="item">바닥 보수 <input id="floor" type="number" value="0"></div>

</div>
</div>

<!-- 4. 고객정보 -->
<div class="card">
<h3>고객 정보 입력</h3>

<input id="name" placeholder="이름">
<input id="phone" placeholder="연락처">
<input id="addr" placeholder="주소 (아파트)">

<button onclick="calc()">즉시 견적 보기</button>

<p style="font-size:12px;color:#777;text-align:center;">
※ 입력 후 결과 확인 가능합니다
</p>
</div>

<!-- RESULT -->
<div class="result" id="result">
<div class="price" id="price"></div>
<div style="margin-top:10px;color:#aaa;">
현장 기준 예상 견적입니다
</div>

<button style="margin-top:12px;" onclick="kakao()">카카오 상담</button>
</div>

</div>

<!-- FIXED CTA -->
<div class="fixed">
<a class="kakao" href="https://pf.kakao.com/_uxhhjX/chat">카카오 상담</a>
<a class="call" href="tel:01000000000">전화 상담</a>
</div>

<script>

/* 단가 구조 */
const priceTable = {
door_film:35000,
fire_door_film:45000,
window_film:20000,
furniture_film:25000,

bathroom:120000,
kitchen:80000,
window_silicone:60000,

wallpaper:50000,
floor:30000
};

let last=0;

/* 아코디언 */
function toggle(el){
const content = el.nextElementSibling;
content.style.display = content.style.display === "block" ? "none" : "block";
}

/* 견적 계산 */
function calc(){

const name=document.getElementById('name').value;
const phone=document.getElementById('phone').value;
const addr=document.getElementById('addr').value;

if(!name || !phone || !addr){
alert("고객 정보 입력 필요");
return;
}

let total = 0;

for(let key in priceTable){
let qty = Number(document.getElementById(key).value || 0);
total += qty * priceTable[key];
}

/* 심리 보정 */
total *= 1.1;

last = Math.round(total);

document.getElementById('result').style.display="block";
document.getElementById('price').innerHTML =
"예상 견적: " + last.toLocaleString() + " 원";

}

/* 카카오 */
function kakao(){
window.open("https://pf.kakao.com/_uxhhjX/chat?msg=부분공사견적:"+last);
}

</script>

</body>
</html>
