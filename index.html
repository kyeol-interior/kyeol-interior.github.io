<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>(주)결 - 관리자 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* 기존 스타일 동일 */
    </style>
</head>
<body>
    <script>
        // 1. Firebase 설정
        const firebaseConfig = { databaseURL: "https://kyeol-bid-default-rtdb.firebaseio.com/" };
        
        // 데이터 변수 초기화
        let dbCounts = { edu: { c1: 34, c2: 12, c3: 18, cOther: 16 }, local: { c1: 30, c2: 15, c3: 20, cOther: 15 }, etc: { c1: 28, c2: 14, c3: 19, cOther: 17 } };
        let samplePool = { edu: [], local: [], etc: [] };
        let currentTotalCount = 138;
        let checkedLogs = {};

        // Firebase 초기화 함수
        function initFirebase() {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                firebase.database().ref('bidMaster').on('value', (s) => {
                    const data = s.val();
                    if(data) {
                        dbCounts = data.dbCounts;
                        samplePool = data.samplePool;
                        currentTotalCount = data.currentTotalCount;
                        checkedLogs = data.checkedLogs || {};
                        document.getElementById('totalCount').innerText = currentTotalCount;
                    }
                });
            } catch(e) {
                alert("Firebase 초기화 에러: " + e.message);
            }
        }

        // 2. 수정된 데이터 등록 함수
        function uploadToCloud() {
            try {
                const bidNo = document.getElementById('newBidNo').value.trim();
                const type = document.getElementById('newInstitution').value;
                const gicho = parseFloat(document.getElementById('newGicho').value);
                const resultPrice = document.getElementById('newResult').value;
                
                // 필수 입력값 체크
                if(!bidNo) { alert('공고번호를 입력하세요.'); return; }
                if(!gicho || !resultPrice) { alert('금액을 확인하세요.'); return; }

                // 로컬 데이터 업데이트
                // ... (이전 계산 로직 동일)
                
                // Firebase 저장
                firebase.database().ref('bidMaster').set({
                    dbCounts: dbCounts,
                    samplePool: samplePool,
                    currentTotalCount: currentTotalCount,
                    lastDate: document.getElementById('bidDate').value,
                    checkedLogs: checkedLogs
                })
                .then(() => {
                    alert('성공: 서버에 저장되었습니다.'); // 여기에 알림 추가
                })
                .catch((error) => {
                    alert('저장 중 오류 발생: ' + error.message);
                });

            } catch(e) {
                alert("코드 실행 중 에러: " + e.message);
            }
        }
    </script>
</body>
</html>
