    <style>
        /* 기본 스타일 초기화 */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; color: #fff; }

        /* 로고 영역 */
        nav { 
            position:fixed; top:0; width:100%; height:180px;

        /* 배경 영상 컨테이너 */
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; background: #000;
        }

        /* 영상 공통 속성 */
        .video-mobile, .video-pc {
            position: absolute; width: 100%; height: 100%; object-fit: cover;
        }

        /* PC/모바일 영상 전환 제어 */
        .video-pc { display: none; }
        @media (min-width: 1025px) {
            .video-mobile { display: none; }
            .video-pc { display: block; }
        }

        /* 오버레이 (텍스트 가독성 확보) */
        .video-background::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.35); /* 영상 밝기 조절 */
        }

        /* 메인 콘텐츠 */
        main {
            height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px; position: relative; z-index: 1;
        }
        .main-title { 
            font-size: 54px; font-weight: 800; line-height: 1.3; 
            margin-bottom: 20px; letter-spacing: -1.5px; word-break: keep-all; 
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .main-sub { 
            font-size: 16px; font-weight: 300; letter-spacing: 0.4em; 
            color: rgba(255,255,255,0.7); margin-bottom: 50px; 
        }
        
        .enter-btn { 
            padding: 16px 50px; border: 1px solid rgba(255,255,255,0.8); 
            text-decoration: none; color: #fff; font-size: 12px; 
            letter-spacing: 4px; transition: 0.4s; 
            background: rgba(0,0,0,0.1); backdrop-filter: blur(5px);
        }
        .enter-btn:hover { background: #fff; color: #000; font-weight: bold; }

        /* 하단 사이드 메뉴 (블로그, 카톡) */
        .side-menu { position: fixed; left: 50px; bottom: 40px; z-index: 1000; }
        .side-menu a { 
            display: inline-block; margin-right: 25px; font-size: 10px; 
            color: rgba(255,255,255,0.5); text-decoration: none; 
            letter-spacing: 1.5px; transition: color 0.3s;
        }
        .side-menu a:hover { color: #fff; }

        /* 카피라이트 */
        footer { position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 900; }
        .copyright { font-size: 10px; color: rgba(255, 255, 255, 0.3); letter-spacing: 1px; }

        /* 모바일 반응형 최적화 */
        @media (max-width: 1024px) {
            nav { padding: 0 30px; height: 140px; } 
            .logo-img { height: 100px !important; } 
            .main-title { font-size: 32px; }
            .video-background::after { background: rgba(0,0,0,0.25); } /* 모바일은 조금 더 밝게 */
            .side-menu { left: 0; width: 100%; text-align: center; bottom: 80px; }
            .side-menu a { margin: 0 15px; }
            footer { bottom: 30px; }
        }
