<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>주식회사 결 | 전주 인테리어</title>

<meta name="description" content="전주 인테리어 전문 (주)결">
<meta name="keywords" content="전주인테리어, 리모델링, 실내건축">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>

/* =====================
   기본
===================== */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;}
body{background:#000;color:#fff;overflow-x:hidden;}

/* =====================
   네비 (로고 복구)
===================== */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:110px;
    display:flex;
    align-items:center;
    padding:0 40px;
    z-index:9999;
}

.logo-img{
    height:80px;
    width:auto;
    filter:drop-shadow(0 0 10px rgba(255,255,255,0.2));
}

/* =====================
   비디오 배경
===================== */
.video-background{
    position:absolute;
    width:100%;
    height:100%;
    z-index:-1;
    overflow:hidden;
}

.video-background::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
}

.video-mobile,.video-pc{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-pc{display:none;}
@media(min-width:1025px){
    .video-mobile{display:none;}
    .video-pc{display:block;}
}

/* =====================
   메인 (타이틀 안정화)
===================== */
main{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:0 20px;
}

.main-title{
    font-size:clamp(20px,5vw,48px);
    font-weight:800;
    line-height:1.25;
    letter-spacing:-0.02em;
    word-break:keep-all;
    max-width:90%;
}

.main-sub{
    margin-top:12px;
    font-size:13px;
    opacity:0.7;
    letter-spacing:0.3em;
}

/* =====================
   버튼
===================== */
.btn-group{
    margin-top:40px;
}

.btn-group a{
    display:inline-block;
    margin:8px;
    padding:14px 28px;
    border:1px solid #fff;
    color:#fff;
    text-decoration:none;
}

/* =====================
   견적 배너
===================== */
.estimate-banner{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:linear-gradient(90deg,#1a365d,#2b6cb0);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    z-index:9999;
    cursor:pointer;
}

.estimate-banner strong{font-size:14px;}
.estimate-banner span{font-size:11px;opacity:0.8;}

.estimate-btn{
    background:#fff;
    color:#1a365d;
    padding:10px 14px;
    border-radius:6px;
    font-weight:bold;
    font-size:12px;
}

/* =====================
   모달
===================== */
.estimate-modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:10000;
}

.estimate-box{
    background:#fff;
    color:#333;
    width:92%;
    max-width:420px;
    padding:20px;
    border-radius:12px;
}

.estimate-box h2{
    color:#1a365d;
    margin-bottom:12px;
}

.estimate-box select,
.estimate-box input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

.calc-btn{
    width:100%;
    padding:12px;
    background:#1a365d;
    color:#fff;
    border:none;
    border-radius:6px;
    font-weight:bold;
}

.result{
    margin-top:10px;
    background:#f7fafc;
    padding:10px;
    border-radius:6px;
    display:none;
}

.close-btn{
    margin-top:10px;
    width:100%;
    padding:10px;
    background:#e53e3e;
    color:#fff;
    border:none;
    border-radius:6px;
}

/* =====================
   모바일 보정
===================== */
@media(max-width:768px){
    .main-title{
        font-size:22px;
        line-height:1.2;
    }

    .main-sub{
        font-size:11px;
        letter-spacing:0.25em;
    }

    nav{
        padding:0 20px;
    }

    .logo-img{
        height:65px;
    }
}

</style>
</head>

<body>

<!-- =====================
   로고 (복구 핵심)
===================== -->
<nav>
    <a href="index.html">
        <img src="./image/image_1.png" class="logo-img" alt="KYEOL">
    </a>
</nav>

<!-- =====================
   배경
===================== -->
<div class="video-background">
    <video class="video-mobile" autoplay muted loop>
        <source src="./image/mobile-video.mp4">
    </video>
    <video class="video-pc" autoplay muted loop>
        <source src="./image/pc-video.mp4">
    </video>
</div>

<!-- =====================
   메인
===================== -->
<main>
    <h1 class="main-title">
        상업공간의 성공과 주거의 품격,<br>
        결이 다른 공간을 만듭니다
    </h1>

    <p class="main-sub">INTERIOR DESIGN & ARCHITECTURE</p>

    <div class="btn-group">
        <a href="about.html">ENTER</a>
        <a href="live-report.html">LIVE</a>
    </div>
</main>

<!-- =====================
   견적 배너
===================== -->
<div class="estimate-banner" onclick="openEstimate()">
    <div>
        <strong>30초 간편 견적</strong><br>
        <span>필름 / 도배 / 실리콘 / 장판</span>
    </div>
    <div class="estimate-btn">견적보기</div>
</div>

<!-- =====================
   견적 모달
===================== -->
<div class="estimate-modal" id="estimateModal">
    <div class="estimate-box">
        <h2>간편 견적</h2>

        <select id="type">
            <option value="film">필름</option>
            <option value="silicone">실리콘</option>
            <option value="wallpaper">도배</option>
            <option value="floor">장판</option>
        </select>

        <input type="number" id="qty" placeholder="수량">
        <input type="text" id="addr" placeholder="아파트 / 지역">
        <input type="text" id="phone" placeholder="연락처">

        <button class="calc-btn" onclick="calc()">견적 계산</button>

        <div class="result" id="resultBox"></div>

        <button class="close-btn" onclick="closeEstimate()">닫기</button>
    </div>
</div>

<script>

function openEstimate(){
    document.getElementById('estimateModal').style.display='flex';
}

function closeEstimate(){
    document.getElementById('estimateModal').style.display='none';
}

function calc(){
    let type=document.getElementById('type').value;
    let qty=parseFloat(document.getElementById('qty').value);
    let phone=document.getElementById('phone').value;

    if(!qty||!phone){
        alert("필수 입력");
        return;
    }

    let priceMap={
        film:18000,
        silicone:12000,
        wallpaper:15000,
        floor:22000
    };

    let total=qty*priceMap[type];

    let box=document.getElementById('resultBox');
    box.style.display='block';
    box.innerHTML="예상 견적: <b>"+total.toLocaleString()+"원</b>";
}

</script>

</body>
</html>
