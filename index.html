<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>주식회사 결 | 전주 인테리어·리모델링·실내건축 전문 (주)결</title>
    <meta name="description" content="상업공간의 성공과 주거의 품격, 전주 인테리어 전문 디자인 기업 (주)결입니다.">
    <meta name="keywords" content="전주인테리어, 전주리모델링, 주식회사결, 실내건축, 상업인테리어, 주거인테리어">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kyeol-interior.github.io/">
    <meta property="og:title" content="(주)결 | KYEOL DESIGN">
    <meta property="og:description" content="전주 인테리어·실내건축 전문 디자인 기업 (주)결">
    <meta property="og:image" content="https://kyeol-interior.github.io/image/main-thumb.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
        body {
            background:#000;
            font-family:'Noto Sans KR', sans-serif;
            overflow-x:hidden;
            color:#fff;
        }

        /* VIDEO */
        .video-background {
            position:absolute;
            inset:0;
            z-index:-1;
            overflow:hidden;
            background:#000;
        }

        .video-mobile, .video-pc {
            position:absolute;
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .video-pc { display:none; }
        @media(min-width:1025px){
            .video-mobile{display:none;}
            .video-pc{display:block;}
        }

        /* NAV */
        nav {
            position:fixed;
            top:0;
            width:100%;
            height:120px;
            display:flex;
            align-items:center;
            padding:0 50px;
            z-index:10;
        }

        .logo-img {
            height:80px;
        }

        /* MAIN */
        main {
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:0 20px;
        }

        .main-title {
            font-size:clamp(22px,4vw,52px);
            font-weight:800;
            line-height:1.25;
            word-break:keep-all;
        }

        .main-sub {
            margin-top:15px;
            font-size:13px;
            letter-spacing:4px;
            opacity:0.7;
        }

        /* BUTTON GROUP (핵심 수정) */
        .btn-group {
            margin-top:40px;
            display:flex;
            flex-direction:column;   /* 👈 2줄 구조 */
            gap:12px;
            align-items:center;
        }

        .btn-base {
            width:260px;
            padding:15px;
            text-align:center;
            text-decoration:none;
            font-size:13px;
            letter-spacing:3px;
            transition:0.3s;
            backdrop-filter:blur(10px);
        }

        .enter-btn {
            border:1px solid #fff;
            color:#fff;
            background:rgba(255,255,255,0.05);
        }

        .enter-btn:hover {
            background:#fff;
            color:#000;
        }

        .live-btn {
            border:1px solid #d4af37;
            color:#d4af37;
            background:rgba(212,175,55,0.08);
        }

        .live-btn:hover {
            background:#d4af37;
            color:#000;
        }

        /* SIDE MENU */
        .side-menu {
            position:fixed;
            bottom:70px;
            width:100%;
            text-align:center;
        }

        .side-menu a {
            margin:0 15px;
            font-size:12px;
            opacity:0.6;
            color:#fff;
            text-decoration:none;
        }

        .side-menu a:hover { opacity:1; color:#d4af37; }

        footer {
            position:fixed;
            bottom:25px;
            width:100%;
            text-align:center;
            font-size:10px;
            opacity:0.3;
        }

        /* MOBILE TITLE FIX */
        @media(max-width:768px){
            .main-title{
                font-size:20px;
                line-height:1.3;
            }

            nav {
                padding:0 25px;
                height:90px;
            }

            .logo-img {
                height:60px;
            }

            .btn-base{
                width:240px;
            }
        }
    </style>
</head>

<body>

    <div class="video-background">
        <video class="video-mobile" autoplay muted loop playsinline>
            <source src="./image/mobile-video.mp4">
        </video>
        <video class="video-pc" autoplay muted loop playsinline>
            <source src="./image/pc-video.mp4">
        </video>
    </div>

    <!-- NAV -->
    <nav>
        <img src="./image/image_1.png" class="logo-img">
    </nav>

    <!-- MAIN -->
    <main>
        <h1 class="main-title">
            상업공간의 성공과 주거의 품격,<br>
            결이 다른 공간을 만듭니다.
        </h1>

        <p class="main-sub">INTERIOR DESIGN & ARCHITECTURE (주)결</p>

        <!-- 🔥 2줄 구조 -->
        <div class="btn-group">

            <a href="about.html" class="btn-base enter-btn">
                ENTER VIEW
            </a>

            <a href="live-report.html" class="btn-base live-btn">
                LIVE 현장
            </a>

        </div>
    </main>

    <!-- SIDE -->
    <div class="side-menu">
        <a href="http://blog.naver.com/rotte123" target="_blank">BLOG</a>
        <a href="https://pf.kakao.com/_uxhhjX/chat" target="_blank">KAKAO</a>
    </div>

    <footer>
        © 2026 (주)결 KYEOL DESIGN
    </footer>

</body>
</html>
