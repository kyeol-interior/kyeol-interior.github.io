<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>(주)결 | 전주 인테리어·리모델링</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans KR';
  background:#000;
  color:#fff;
  overflow-x:hidden;
}

/* ===== VIDEO ===== */
.video-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  background:url('./image/main-thumb.jpg') center/cover;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.9;
}

/* ===== NAV ===== */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:20px 40px;
  z-index:10;
}
nav img{
  height:70px;
}

/* ===== HERO ===== */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:0 20px;
}

.hero h1{
  font-size:clamp(22px,4vw,48px);
  font-weight:800;
  line-height:1.25;
  max-width:900px;
  word-break:keep-all;
}

.hero p{
  margin-top:15px;
  font-size:13px;
  letter-spacing:4px;
  opacity:0.7;
}

/* ===== BUTTON ===== */
.btn{
  margin-top:30px;
  padding:14px 40px;
  border:1px solid #fff;
  background:rgba(255,255,255,0.05);
  cursor:pointer;
}

/* ===== BANNER ===== */
.banner{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:520px;
  background:#d4af37;
  color:#000;
  padding:15px;
  border-radius:10px;
  font-weight:700;
  text-align:center;
  cursor:pointer;
  z-index:20;
}

/* ===== ESTIMATE PANEL ===== */
.panel{
  position:fixed;
  right:-100%;
  top:0;
  width:100%;
  max-width:420px;
  height:100%;
  background:#fff;
  color:#000;
  transition:0.4s;
  z-index:999;
  padding:20px;
  overflow:auto;
}
.panel.open{
  right:0;
}

.item{
  border:1px solid #ddd;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
}
.item.active{
  background:#f3f3f3;
  border-color:#d4af37;
}

.calc-btn{
  width:100%;
  padding:15px;
  background:#000;
  color:#fff;
  margin-top:15px;
}

/* 모바일 타이틀 보호 */
@media(max-width:768px){
.hero h1{
  font-size:22px;
  line-height:1.3;
}
}
</style>
</head>

<body>

<div class="video-bg">
  <video autoplay muted loop>
    <source src="./image/pc-video.mp4">
  </video>
</div>

<nav>
  <img src="./image/image_1.png" alt="logo">
</nav>

<div class="hero">
  <h1>공간의 본질을 설계합니다</h1>
  <p>INTERIOR DESIGN KYEOL</p>

  <button class="btn" onclick="openPanel()">견적 바로보기</button>
</div>

<!-- 🔥 견적 배너 -->
<div class="banner" onclick="openPanel()">
  🔥 우리 집 공사비용 바로 계산하기 (1분 견적)
</div>

<!-- ===== 견적 패널 ===== -->
<div class="panel" id="panel">

  <h2>부분 공사 견적</h2>
  <p style="font-size:12px;color:#666;margin-bottom:15px;">
    선택만 하면 자동 견적 계산
  </p>

  <!-- 필름 -->
  <h3>필름 공사</h3>

  <div class="item" onclick="toggle(this)">도어 필름 (방문 / 현관문)</div>
  <div class="item" onclick="toggle(this)">샷시 프레임 필름</div>
  <div class="item" onclick="toggle(this)">가구 필름 (붙박이장 등)</div>

  <!-- 실리콘 -->
  <h3>실리콘 공사</h3>

  <div class="item" onclick="toggle(this)">화장실 전체 실리콘</div>
  <div class="item" onclick="toggle(this)">싱크대 주방 실리콘</div>
  <div class="item" onclick="toggle(this)">샷시 누수 실리콘</div>

  <!-- 도배/장판 -->
  <h3>도배/장판</h3>

  <div class="item" onclick="toggle(this)">부분 도배</div>
  <div class="item" onclick="toggle(this)">전체 장판 교체</div>

  <button class="calc-btn" onclick="calc()">예상 견적 확인</button>

  <div id="result" style="margin-top:20px;font-weight:bold;"></div>

</div>

<script>
let selected = [];

function openPanel(){
  document.getElementById('panel').classList.add('open');
}

function toggle(el){
  el.classList.toggle('active');
}

function calc(){
  let items = document.querySelectorAll('.item.active');
  let price = 0;

  items.forEach(i=>{
    if(i.innerText.includes('도어')) price += 150000;
    if(i.innerText.includes('샷시')) price += 200000;
    if(i.innerText.includes('가구')) price += 180000;
    if(i.innerText.includes('화장실')) price += 250000;
    if(i.innerText.includes('싱크대')) price += 180000;
    if(i.innerText.includes('도배')) price += 300000;
    if(i.innerText.includes('장판')) price += 350000;
  });

  document.getElementById('result').innerText =
    "예상 견적: " + price.toLocaleString() + "원 ~";
}
</script>

</body>
</html>
