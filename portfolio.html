    <style>
        /* 기존 스타일 동일 */
        /* [1] 공통 스타일 및 네비게이션 */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
        body { background:#fff; font-family: 'Noto Sans KR', sans-serif; color:#111; overflow-x:hidden; }
        
        nav { 
            position:fixed; top:0; width:100%; height:80px; 
            display:flex; justify-content:space-between; align-items:center; 
            padding:0 50px; background:#fff; z-index:1100; 
            border-bottom:1px solid #f2f2f2;
        }
        .logo { font-family: 'Playfair Display', serif; font-size:24px; font-weight:700; text-decoration:none; color:#000; letter-spacing:4px; }
        
        /* PC 메뉴 */
        .nav-links { display:flex; gap:35px; }
        .nav-links a { text-decoration:none; color:#999; font-size:13px; letter-spacing:2px; font-weight:400; transition: 0.3s; }
        .nav-links a.active { color:#000; font-weight:700; }

        /* 햄버거 버튼 애니메이션 */
        .menu-btn { display: none; cursor: pointer; flex-direction: column; gap: 6px; z-index: 1200; position: relative; }
        .menu-btn span { width: 22px; height: 2px; background: #000; transition: 0.3s; transform-origin: center; }
        
        /* 햄버거 -> X 변환 */
        .menu-btn.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .menu-btn.open span:nth-child(2) { opacity: 0; }
        .menu-btn.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* 모바일 슬라이딩 메뉴 */
        .mobile-nav {
            position: fixed; top: -100%; left: 0; width: 100%; height: auto;
            background: #fff; border-bottom: 1px solid #eee;
            display: flex; flex-direction: column; padding: 100px 0 30px;
            z-index: 1050; transition: all 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .mobile-nav.active { top: 0; }
        .mobile-nav a { padding: 15px 50px; text-decoration: none; color: #111; font-size: 16px; font-weight: 500; border-bottom: 1px solid #f9f9f9; }

        /* [2] 포트폴리오 그리드 디자인 */
        .container { padding: 140px 50px 100px; max-width: 1600px; margin: 0 auto; }
        .filter-nav { font-size: 12px; letter-spacing: 5px; color: #999; text-align: center; margin-bottom: 60px; font-weight: 400; }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
        }
        
        .grid-item { 
            position: relative; overflow: hidden; background: #eee; aspect-ratio: 4/3; 
            display: block; text-decoration: none;
        }
        .grid-item img { 
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(100%); transition: 0.6s ease; transform: scale(1.0);
        }
        .item-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; 
            opacity: 0; transition: 0.4s ease;
        }
        .item-title { color: #fff; font-size: 15px; letter-spacing: 2px; font-weight: 300; border-bottom: 1px solid #fff; padding-bottom: 5px; }

        /* 호버 효과 */
        .grid-item:hover img, .grid-item.active img { filter: grayscale(0%); transform: scale(1.05); }
        .grid-item:hover .item-overlay, .grid-item.active .item-overlay { opacity: 1; }

        /* 모바일 대응 */
        @media (max-width: 1024px) {
            nav { padding: 0 25px; height: 70px; }
            .logo { font-size: 20px; }
            .nav-links { display: none; } 
            .menu-btn { display: flex; } 

            .container { padding: 110px 20px 80px; }
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .item-title { font-size: 12px; }
        }
    </style>
</head>
<body>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const dropdown = document.getElementById('dropdown');

        // 메뉴 토글 (X자 변환 + 슬라이딩)
        menuToggle.onclick = (e) => {
            e.stopPropagation();
            menuToggle.classList.toggle('open');
            dropdown.classList.toggle('active');
        };

        // 외부 클릭 시 닫기
        document.onclick = (e) => {
            if (!dropdown.contains(e.target) && !menuToggle.contains(e.target)) {
                menuToggle.classList.remove('open');
                dropdown.classList.remove('active');
            }
        };

        // 스크롤 감지 (흑백 -> 컬러 전환)
        const items = document.querySelectorAll('.grid-item');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('active'); }
            });
        }, { threshold: 0.1 });
        items.forEach(item => observer.observe(item));
    </script>
