    <title>PROPOSAL | (주)결</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* [1] 기본 레이아웃 및 내비게이션 */
        * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing: antialiased; }
        body { background:#000; font-family: 'Noto Sans KR', sans-serif; color: #fff; }
        
        nav { 
            position:fixed; top:0; width:100%; height:80px; 
            display:flex; justify-content:space-between; align-items:center; 
            padding:0 50px; background:rgba(0,0,0,0.95); z-index:1000; 
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-family: 'Playfair Display', serif; font-size:24px; font-weight:700; text-decoration:none; color:#fff; letter-spacing:4px; }
        .nav-links { display:flex; gap:35px; }
        .nav-links a { text-decoration:none; color:rgba(255,255,255,0.5); font-size:13px; letter-spacing:2px; }
        .nav-links a.active { color:#fff; font-weight:700; }

        /* [2] 카테고리 필터 탭 */
        .filter-wrap {
            position: fixed; top: 80px; width: 100%; background: rgba(0,0,0,0.9);
            display: flex; justify-content: center; gap: 40px; padding: 20px 0;
            z-index: 999; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .filter-item {
            cursor: pointer; font-size: 14px; color: rgba(255,255,255,0.4);
            letter-spacing: 1px; transition: 0.3s; position: relative;
        }
        .filter-item.active { color: #fff; font-weight: 700; }
        .filter-item.active::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: #fff;
        }

        /* [3] 이미지 컨테이너 */
        .proposal-container {
            padding-top: 180px; padding-bottom: 150px;
            display: flex; flex-direction: column; align-items: center; gap: 60px;
        }
        
        .proposal-page {
            width: 100%; max-width: 1000px; padding: 0 20px;
            display: none; /* 필터 작동 전까지 숨김 */
        }
        .proposal-page.show { display: flex; justify-content: center; }

        .proposal-page img {
            width: 100%; height: auto; display: block;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            opacity: 0; transform: translateY(30px);
            transition: all 0.8s ease-out;
        }
        .proposal-page img.visible { opacity: 1; transform: translateY(0); }

        @media (max-width: 1024px) {
            nav { padding: 0 25px; height: 70px; }
            .filter-wrap { top: 70px; gap: 20px; padding: 15px 0; }
            .filter-item { font-size: 12px; }
            .proposal-container { padding-top: 150px; gap: 40px; }
        }
    </style>
</head>
<body>

    <script>
        const filterItems = document.querySelectorAll('.filter-item');
        const pages = document.querySelectorAll('.proposal-page');

        function filterSelection(category) {
            pages.forEach(page => {
                page.classList.remove('show');
                if (category === 'all' || page.classList.contains(category)) {
                    page.classList.add('show');
                }
            });
            checkVisibility();
        }

        filterItems.forEach(item => {
            item.addEventListener('click', function() {
                filterItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                filterSelection(this.getAttribute('data-filter'));
            });
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        function checkVisibility() {
            document.querySelectorAll('.proposal-page.show img').forEach(img => observer.observe(img));
        }

        filterSelection('all');
    </script>
